# Publish site/ to GitHub Pages (owner review of d34fa93, item 5; restored 2026-11-14 night: the live site is
# https://sorenhgautam-dev.github.io/data-test-game/, no Vercel).
# Pages can only publish the repository root or /docs from a branch, so this workflow uploads site/ as the
# Pages artifact instead: nothing moves, and data/ and the pipeline are never published.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
