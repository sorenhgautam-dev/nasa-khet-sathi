      monsoon_shift: {inputs: [dhm_onset], also: [], scorecard: [monsoon_shift], rain_corrected: false}   # owner, 2026-11-15 (item 3): the sentence comes straight from DHM's onset dates; scored by verification.outputs.monsoon_shift (the copy and the arithmetic). Was: also chirps and gpm, no scorecard (2026-11-14, TRACEABILITY N5)
      plan_harvest: {inputs: [twin], also: [crop_calendar], scorecard: [harvest_years], rain_corrected: true}
