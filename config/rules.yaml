# Thresholds and rules. Every entry has a value AND a source (CLAUDE.md: never invent numbers).
# Claude's choices are marked TODO-CONFIRM until the owner decides (no TODO-CONFIRM is open: the owner approved every sourced threshold and, as 'Claude's choice, owner-approved 2026-11-13', every unsourced choice on 2026-11-13. Still with the owner, as the method page lists them (REVIEW_2 M7): gpm_series.correction_products and plans.third_plan_rule ('put to the owner'), and two readings never put to the owner, gpm_series.correction_fields and trends.shift_days_span); TODO-VERIFY = source detail to check. Load with
# pipeline/fetch/rules.py; tests/test_rules.py fails if any entry lacks a source.

rain_spike:                       # owner decision B, 2026-11-11
  min_mm:
    value: 50
    source: "Owner decision B, 2026-11-11: flag a day where one rain source exceeds 50 mm"
  ratio:
    value: 5
    source: "Owner decision B, 2026-11-11: ... and is more than five times another source"

power_rain:                       # owner decisions D6 and D, 2026-11-11
  never_fill_years:
    value: [2001, 2002, 2003]
    source: "Owner decision D, 2026-11-11: POWER rain 2001-2003 is about half of later years (VALIDATION.md 3.1); never use it to fill GPM gaps"
  max_filled_fraction_per_year:
    value: 0.05
    source: "Claude's proposal, owner-approved 2026-11-12 (owner's batch decisions, item 1) (REVIEW_NOTES M2): the weather table fails loudly if POWER fills more than 5% of any year's days (about 18 days), so a partly failed GPM download cannot turn into POWER rain unnoticed. Every filled day stays flagged (rain_filled, rain_source)"

temperature_correction:           # owner decision A, 2026-11-11
  columns:
    value: [tmin_c, tmax_c]
    source: "Owner decision A, 2026-11-11: correct Tmin, check Tmax (and RH) the same way"
  min_shared_days_per_year:
    value: 200
    source: "Owner-approved 2026-11-12 (proposed by Claude: the 330-record rule leaves no Tmin years at Kathmandu Airport; 200 keeps 2015, 2016, 2017, 2019, 2021, 2022, 2023)"
  min_shared_days_per_month:
    value: 20
    source: "Owner-approved 2026-11-12: a month needs at least 20 shared days across the fit years"
  split:
    value: alternate
    source: "Owner decision A; alternating sorted years owner-approved 2026-11-12"
  apply_only_if_held_out_error_drops:
    value: true
    source: "Owner-approved 2026-11-12: keep a correction only if it lowers the held-out error"

day_alignment:                    # owner decision C, 2026-11-11
  lags_days:
    value: [-1, 0, 1]
    source: "Owner decision C, 2026-11-11: daily rain correlation at lags -1, 0, +1"

cold_nights:                      # owner decision on step-3 review item 1, 2026-11-12
  method:
    value: empirical quantile mapping of Tmin, per month; per season when a month has too few shared days
    source: "Owner go, 2026-11-12. Method: empirical quantile mapping as in Gudmundsson et al. 2012, HESS 16, 3383-3390, doi:10.5194/hess-16-3383-2012 (empirical percentiles, linear interpolation) and Themessl, Gobiet & Leuprecht 2011, IJC 31, 1530-1544, doi:10.1002/joc.2168"
  seasons:
    value: {DJF: [12, 1, 2], MAM: [3, 4, 5], JJAS: [6, 7, 8, 9], ON: [10, 11]}
    source: "Owner, 2026-11-12: fit by season (Dec-Feb, Mar-May, Jun-Sep, Oct-Nov) if single months have too few days"
  min_shared_days_per_month:
    value: 20
    source: "Reuses the owner-approved 20 days per month (temperature_correction)"
  quantiles:
    value: 99
    source: "Claude's choice, owner-approved 2026-11-12 (step-4 review item 5): map at the 1st to 99th percentiles. Beyond the ends keep the end-quantile difference: Gudmundsson et al. 2012 state this for values above the training range; applying it below as well is Claude's choice"
  frost_night_c:
    value: 2.0
    source: "Owner, 2026-11-12: count of nights below 2 C (CLAUDE.md frost risk band is 0 to 2 C)"
  roles:
    value: {temperature_and_et0: monthly offset, frost: quantile mapping}
    source: "Owner, step-4 review item 1, 2026-11-12: use both, each for its purpose. The monthly offset stays for the twin's temperatures and ET0 (better MAE on held-out years); quantile mapping is used only for frost (better coldest-night error and nights below 2 C). Those two advantages rest on small samples: 3 held-out Januaries for the coldest night and 9 station nights below 2 C, with no uncertainty given (REVIEW_NOTES M8, 2026-11-12)"
  frost_display_note:
    value: "Held-out years 2016, 2019, 2022: nights below 2 C were 22 with the offset and 15 with quantile mapping, against 9 at the station."
    source: "Owner, step-4 review item 1, 2026-11-12: both overcount cold nights against the station (offset 22, QM 15, station 9), so frost is shown as risk bands with the caveat, never as a count. Numbers: VALIDATION.md 3.14"

rain_vote:                        # owner decision on step-3 review item 6, 2026-11-12
  rule:
    value: when GPM exists, a flagged day where GPM agrees with the station (their pair passes the spike rule) is marked a real local storm; where GPM agrees with POWER instead, the station value is marked suspect
    source: "Owner, 2026-11-12: let the three sources vote; if GPM agrees with the station, mark the day a real local storm. The 'suspect station' half is Claude's reading, owner-approved 2026-11-12 (step-4 review item 5). Caveat (REVIEW_NOTES H2, 2026-11-12): every Kathmandu Airport record is GHCN S-flag 'S', derived from synoptic reports, which the GHCN readme says to use with caution, especially for rain; a 'station value suspect' or 'real local storm' label rests on that series"

et0:
  rs_rso_limits:
    value: [0.3, 1.0]
    source: "FAO-56 eq. 39 limits Rs/Rso to <= 1.0; the 0.3 floor: ASCE-EWRI Task Committee final report (Jan 2005), eq. 18, p. 20: 'Rs/Rso = relative solar radiation (limited to 0.3 <= Rs/Rso <= 1.0)'; published as Allen et al. (eds.) 2005, The ASCE Standardized Reference Evapotranspiration Equation, ASCE, doi:10.1061/9780784408056. Owner-approved 2026-11-12"

soilgrids:
  nearest_cell_step_m:
    value: 250
    source: "SoilGrids 2.0 resolution is 250 m (Poggio et al. 2021)"
  nearest_cell_max_m:
    value: 3000
    source: "Owner, 2026-11-12 (REVIEW_NOTES M5): if the field's own SoilGrids cell has no prediction, use the nearest SoilGrids cell within 3 km. FAO HWSD v2 is not used (owner-approved 2026-11-12 (owner's batch decisions, item 21): CC BY-NC-SA licence, 1 km cells, no water contents at 33 or 1500 kPa), with a caveat that the soil is not the field's own. Was 1 km (owner-approved 2026-11-12, step-4 review items 2 and 5). The distance is recorded in the data card"

  neighbourhood:
    value: {radius_m: 2000, depth_m: 1.0}
    source: "Owner, 2026-11-13 (answer 10 to REVIEW_2 M5): keep the nearest soil cell and show the neighbourhood range. Shown: the water the soil holds for plants (field capacity minus wilting point) in the top metre, at the cell used and over every SoilGrids cell with values within 2 km of the field. The radius and the depth are Claude's choices; they are the ones REVIEW_2's check had already used on 2026-11-13 (so not fixed before a first look); put to the owner. A description only: the twin still uses the nearest cell"

  neighbourhood_median_soil:      # owner's queue item 4d (2026-11-14): a check run, the twin keeps the nearest cell
    value: "for each SoilGrids depth layer, the median field capacity (wv0033) and the median wilting point (wv1500), and the median sand and clay, over the cells with a prediction within neighbourhood.radius_m of the field (the same cells as the neighbourhood summary in the soilgrids card), read offline from the cached WCS maps; the twin is run with this profile beside the nearest cell's, and the two are shown as a range"
    source: "Owner, 2026-11-14 (queue item 4d): 'Run the current plan and the two suggested plans with the soil of the nearest SoilGrids cell (today) and with the neighbourhood median ... Show the results as a range'. Per-layer medians instead of the cell with the median water held: Claude's choice, fixed and committed before the first run (no tie between the 28th and 29th of 56 cells; each layer stays a value SoilGrids predicts nearby). Put to the owner"

curve_numbers:                    # SCS-CN for the bucket's runoff (twin/runoff.py)
  hydrologic_soil_group:
    value: C
    source: "NEH Part 630 Ch. 7 (2009) texture guidance: 'Group C soils typically have between 20 percent and 40 percent clay and less than 50 percent sand'. SoilGrids at the cell used (859 m SE of the field, WCS, 2026-11-12): clay 21-36%, sand 26-34% at 0-200 cm (top layer 20.6% clay, close to the 20% edge). Ksat unknown, so texture guidance only"
  by_cover:
    value: {bare: 91, small_grain: 83, row_crop: 85, close_seeded_legume: 81}
    source: "TR-55 (1986) Table 2-2b = NEH 630 Ch. 9 Table 9-1, hydrologic soil group C: Fallow bare soil 91; Small grain, straight row, good 83; Row crops, straight row, good 85; Close-seeded or broadcast legumes, straight row, good 81. Straight row and 'good' condition are Claude's choices for a flat valley-floor field, owner-approved 2026-11-12 (step-4 review item 5). Kept for the placeholder field, a 1.6 deg (about 2.8%) valley floor where a 30 m elevation model shows no terraces (owner-approved 2026-11-12 (owner's batch decisions, item 20)); revisit for a terraced hill field, which needs the contoured or contoured-and-terraced rows"
  crop_cover:
    value: {rice: small_grain, wheat: small_grain, maize: row_crop, potato: row_crop, lentil: close_seeded_legume, mustard: small_grain, buckwheat: small_grain, finger_millet: small_grain}
    source: "Claude's mapping of each crop to a TR-55 cover row, owner-approved 2026-11-12 (step-4 review item 5; TR-55 has no paddy row; rice uses small grain). Revisit for a terraced field, as above"

paddy_rice:
  ponding:
    value: "irrigated paddy only: refilled to field capacity at the start of every season day, booked as irrigation (pond_supply_mm is the paddy part); rain-fed paddy is the ordinary bucket with rice's Zr and p, no outside water"
    source: "Owner, 2026-11-12 (REVIEW_NOTES H1, L1; owner-approved 2026-11-12 (owner's batch decisions, item 6)): FAO-56 has no paddy balance. Replaces the rain-fed rule 'ponded until the first 10-day dry spell under 1 mm' (owner-approved at the step-4 review), which supplied 120-203 mm a season of unsourced water. Documentation only: no code reads this key"

season_dates:                     # item 4a (owner's queue, 2026-11-14): the farmer's sowing dates from the satellite's seasons
  # Written and committed BEFORE its first run. pipeline/twin/season.py plan_from_seasons; scripts/run_replay.py --season-dates.
  apply:
    value: false
    source: "Owner's decision, 2026-11-14 afternoon: 'The two model changes (satellite planting dates, rice waiting for rain): undo. Record both tries honestly in VALIDATION.' Switched on earlier the same day (e89d3e1); with it on, the independent checks got weaker (SMAP, GLDAS ET, FAOSTAT rice and potato; VALIDATION 4.2b, 4.2d, 4.3) and the farmer's plan was dated differently from the suggested plans. The record of the try: VALIDATION 4.2c and data/checks/demo/seasons_from_hls/switched_on.json"
  farmer_plans:
    value: "a plan is the farmer's when its id (plans.generate.plan_id) is the current plan's or a current-plan option's (the field's current_rotation_options, built by plans/options.option_specs); the field's rotation as run by scripts/run_replay.py, run_diary.py (soil words), run_memory.py, run_smap_check.py, run_twin_now.py and run_validation_checks.py is the farmer's. Code: pipeline/plans/twin_options.py"
    source: "Claude's choice, fixed before the first run with the switch on (the satellite sees only what the farmer grows, `match`); put to the owner"
  suggested_plans:
    value: "every other plan (the suggested plans and every plan generated for the choice) keeps the calendar sowing of its season options (plans.generate.plan_dates) in every year. So in the HLS years the current plan is sown on the observed days and a suggested plan on the calendar's: their harvest difference holds the date difference as well as the crop difference"
    source: "`match` as committed (7538f10: 'suggested plans keep their calendars'), restated for scripts/run_plans.py evaluate() and plan_export() and pipeline/future/runs.plan_run before the first run; Claude's choice, put to the owner"
  with_paddy_rainfed:
    value: "order: the farmer's plan takes the satellite's dates first; then, in the rain-fed case only, every paddy season still on a calendar day (a year with no HLS monsoon season, the years before HLS, every suggested plan, the twin's run past the last HLS year) waits for its land-preparation rain (paddy_rainfed). A paddy dated by the satellite keeps its day: the observed green-up already holds that year's transplanting delay. Code: pipeline/plans/twin_options.dated_plan"
    source: "Claude's choice, fixed before the first run with both switches on (owner's decisions of 2026-11-14 on 4a and 4c); put to the owner"
  seasons:
    value: "the chosen season method's seasons with source 'hls' (data/checks/<field>/diary_seasons.json chosen.seasons_by_year; 2014-2025 on the demo field); each in its slot by its peak month (rotation_guess: monsoon June-November, winter December-May). MODIS-year seasons are not used"
    source: "Owner's queue item 4a: 'Drive each year's sowing and harvest in the twin from the HLS seasons detected for that year (2014-2025) ... with source hls'. Slots: rules.yaml rotation_guess (pipeline/diary/guess.py SLOTS)"
  match:
    value: "a crop of the farmer's plan (the current rotation and the current options; suggested plans keep their calendars) takes, in each year, the detected season of its own slot (the slot of its calendar season's middle day) whose peak falls in the year its calendar season ends; a year with no such season keeps the calendar date"
    source: "Owner's queue item 4a: 'Keep the calendar defaults for years with no detected season'. Year of a season = the year it is harvested (rules.yaml replay.year_of_season); suggested plans are the twin's alternatives, not what the satellite sees. Claude's reading, fixed before the first run; put to the owner"
  sowing:
    value: "sowing = the detected season's start minus the crop's initial stage (crops.json stages_days.ini): the threshold method's start (20 % up the rise) is read as green-up, the end of FAO-56's initial stage"
    source: "FAO-56 Chapter 6: the initial stage runs from 'planting date to approximately 10% ground cover'; the same reading as rules.yaml rotation_guess ('green-up window (sowing + initial stage)'), owner-approved 2026-11-13"
  length:
    value: "the crop keeps its own season length (crops.json stages_days); the detected end is not used, and the difference between the detected season's length and the crop's is reported. A season longer than the crop leaves days the satellite sees green and the twin bare; a shorter one the reverse"
    source: "Claude's choice, fixed before the first run: the crop's stages, Kc curve and Ky stay those of the crop library (FAO-56 Table 11 lengths scaled to the FAO calendar, METHOD_NOTES 9); NDVI above the season threshold also counts weeds, residue and a second flush (REVIEW_NOTES M11), so stretching the crop to it would change the crop, not its dates. Put to the owner"
  overlaps:
    value: "crops are taken in the order of their new sowing days; a crop that would start before the previous one ends starts the day after it ends; a season pushed past the end of the weather record is dropped (its year is then incomplete and not scored)"
    source: "Claude's choice, fixed before the first run: the same hand-over as proposal 2c (paddy_rainfed) and crops.json's no-overlap rule (twin/season.py _segments refuses overlaps)"

paddy_rainfed:                    # proposal 2c (called 4c in the owner's queue): written and committed BEFORE the what-if run
  # Sources opened 2026-11-14 by a research sub-agent (quotes in SI_LOG). pipeline/twin/season.py paddy_transplant, paddy_outcome.
  status:
    value: "ON: the owner said yes on 2026-11-14 (values unchanged from the proposal committed in abbe701)"
    source: "Owner's decision, 2026-11-14: '4c: yes, apply the sourced rain-fed rice rule. Report honestly whether it catches the 2009 and 2015 monsoon droughts; don't tune it to them.' Proposal: notes/proposal_2c_rainfed_rice.md. No value below was changed after the what-if or after looking at any drought year"
  apply:
    value: false
    source: "Owner's decision, 2026-11-14 afternoon: 'undo' (as season_dates.apply). The rule caught neither the 2009 nor the 2015 monsoon drought (VALIDATION 4.1); the record of the try: data/checks/demo/seasons_from_hls/switched_on.json and notes/proposal_2c_rainfed_rice.md"
  rule:
    value: "a RAIN-FED paddy is transplanted on the first day, on or after its planned day, by which the rain since prep_days before the planned day (the nursery's sowing) reaches prep_mm (soaking and puddling); later than max_delay_days after the planned day the season fails: harvest 0 (the field is left fallow or the seedlings are lost). A late paddy is simulated from its actual day as the same plain bucket; a later crop that would overlap moves to the day after it ends. No extra loss per day of delay. Irrigated paddy is unchanged"
    source: "Structure of the rain-fed transplanting rules in Balwinder-Singh et al. 2019, Field Crops Research 239:92-103, sec. 2.3.2 (APSIM, Bihar: seedlings 'at least 21 days old', transplanting when 'surface water ponding exceeded 50 mm', no crop 'if these conditions were not met by 15 August') and Han, Montes, Hussain & Krupnik 2024, Climatic Change 177:77 (DSSAT, Bangladesh: transplanting when a 'threshold ponding water depth (30 mm) was reached by rainfall'). A rain total stands in for the ponding depth because the twin has no pond for rain-fed paddy (METHOD_NOTES 2). Claude's reading, fixed before the run; owner-approved 2026-11-14 ('4c: yes, apply the sourced rain-fed rice rule')"
  prep_mm:
    value: 150
    source: "Bouman, Barker, Humphreys, Tuong et al. 2007, 'Rice: feeding the billions', ch. 14 of Water for Food, Water for Life (IWMI/Earthscan), Box 14.2, p. 524: land preparation water 'as low as 100-150 mm ... when the time lag between soaking and transplanting is only a few days' (the upper end, since a rain-fed farmer cannot time the rain); Sri Lanka Department of Agriculture (RRDI), land preparation: '~150 mm' for low-humic-gley soils. Sensitivity: 100 (Bouman's lower end) and 200 mm (FAO Training Manual 4, Irrigation Scheduling, sec. 4.4: 'the amount of water needed to saturate the root zone is 200 mm')"
  prep_days:
    value: 21
    source: "Seedling age at transplanting: 'at least 21 days old' (Balwinder-Singh et al. 2019; Han et al. 2024); the Khumaltar trial transplanted '22 days old seedling' (Chaulagain et al. 2022, Agronomy Journal of Nepal 6(1):87-94). Land preparation is counted from the nursery's sowing, 21 days before the planned transplanting"
  max_delay_days:
    value: 30
    source: "Chaulagain et al. 2022 (Khumaltar, Kathmandu valley, 1,360 m, 2019-2020): transplanting about 16 days later (2 to 18 July) cut yield 32 % and about 30 days later (1 August) 85 %, with 'merely a few filled grains per panicle due to a lower temperature and less soil moisture in October'. So 30 days late is counted as a failed season. Sensitivity: 20 days (rain-fed farmers also use 40-day seedlings, Adhikari, Mehera & Haefele 2013, Am. J. Plant Sci. 4(12C):146-155: 40 - 21 = about 20 days of waiting) and 40 days"
  sensitivity:
    value: {prep_mm: [100, 200], max_delay_days: [20, 40]}
    source: "Declared with the rule, before the run: each value at the ends of its sourced range above; reported only, never used to choose"

paddy_losses:                     # owner's item 3 (2026-11-14 afternoon): the water a real paddy loses. Written and committed BEFORE its first run
  # Sources opened 2026-11-14 by Claude (pages read as text from fao.org): FAO Training Manual 3, Irrigation Water Needs
  # (Brouwer & Heibloem 1986, sec. 4.4, https://www.fao.org/4/s2022e/s2022e08.htm); FAO Training Manual 4, Irrigation
  # Scheduling (Brouwer, Prins & Heibloem 1989, ch. 4, sec. 4.4, https://www.fao.org/4/t7202e/t7202e07.htm); FAO Soils
  # Bulletin 55, Guidelines: land evaluation for irrigated agriculture (1985, https://www.fao.org/4/x5648e/x5648e0e.htm).
  # FAO-56 has no paddy balance (paddy_rice.ponding). Code: soil_water.step/run_bucket (sp_mm), season.simulate
  # (paddy_losses, land_prep_irrigation_mm), pipeline/plans/twin_options.py (paddy_losses). Not tuned to any event.
  keep_rule:
    value: "kept only if switching the losses on (with the tuned rain, 4a and 4c off, groundwater out of the water score) makes no independent check worse: worse = a check's verdict changes from 'holds up' to 'does not', or a primary statistic falls by more than 0.05 (SMAP L4 monthly-anomaly Pearson, GLDAS soil and ET Pearson, FAOSTAT rice, wheat and potato Spearman, twin vs HLS monsoon and winter Spearman; both on the central rain). If any is worse, the losses stay off and why is recorded"
    source: "Owner's decision, 2026-11-14 afternoon: 'Rice losses: yes, with the water score counting only the water the crop uses, but only if they don't make the independent checks worse (same rule as the other changes). If they do, leave them off and record why.' The 0.05 margin is Claude's choice, fixed before the comparison: smaller changes are within the rounding of the published checks"
  apply:
    value: true
    source: "Owner's decision, 2026-11-14 afternoon: 'Rice losses: yes, with the water score counting only the water the crop uses, but only if they don't make the independent checks worse' (keep_rule). Switched on after the keep test passed (data/checks/demo/paddy_losses/keep_test.json; central gauge-calibrated rain, 4a and 4c off, water_strict 1.0; off -> on): SMAP L4 Pearson 0.676 -> 0.684; GLDAS soil 0.333 -> 0.334, ET 0.391 -> 0.390; FAOSTAT Spearman rice 0.226 -> 0.226, wheat 0.539 -> 0.552, potato -0.200 -> -0.202; twin vs HLS Spearman monsoon 0.732 -> 0.739, winter 0.462 -> 0.462; no verdict changed (holds up: GLDAS ET, FAOSTAT wheat, HLS monsoon, before and after). No statistic falls by more than 0.05, so the losses stay. Was off from its rule commit (84eefb9) until this switch; --paddy-losses off gives the run without them"
  perc_mm_day:
    value: 5
    source: "FAO Training Manual 4 (1989), sec. 4.4, Step 5: 'The percolation and seepage losses depend on the type of soil. They will be low in very heavy, well-puddled clay soils and high in the case of more sandy soils. They can best be determined locally. If no local data can be obtained, the following values may be used: for heavy clay: PERC = 2 mm/day = 60 mm/month; for more sandy soils: PERC = 8 mm/day = 240 mm/month; on average: PERC = 5 mm/day = 150 mm/month'. The demo's topsoil is loam (VALIDATION 2.5), neither heavy clay nor sandy, so the 'average' value. (Manual 3, 1986, sec. 4.4, Step 5: heavy clay 4, sandy 8, average 6 mm/day.) Reading 'this soil type' as FAO's average class is Claude's choice, fixed before the first run; put to the owner"
  perc_sensitivity_mm_day:
    value: [2, 9]
    source: "Declared before the run; reported only, never used to choose. 2 = Manual 4's heavy clay (an old, well-puddled paddy). 9 = FAO Soils Bulletin 55 (1985), on seepage and percolation: 'Chin and Lee (1961) reported 7, 9, 10 and 12 mm/day for Taiwan soils having 25-30%, 15-25%, 10-15%, 5-10% clay content respectively'; the demo's topsoil has 20.6 % clay (SoilGrids 0-5 cm), in the 15-25 % class"
  sat_mm:
    value: 200
    source: "FAO Training Manual 3 (1986), sec. 4.4, Step 4, and Manual 4 (1989), sec. 4.4, Step 4: 'In the month before sowing or transplanting, water is needed to saturate the root zone. The amount of water needed depends on the soil type and rooting depth. For the purpose of this manual it is however assumed that the amount of water needed to saturate the root zone is 200 mm. Thus: SAT = 200 mm'. FAO gives no figure by soil type"
  wet_days:
    value: "a paddy day is wet when its root zone starts the day at field capacity (every ponded day, after the morning top-up) or the day's rain, less runoff, brings it back to field capacity. On a wet day perc_mm_day leaves the field: first out of the water above field capacity, which the bucket drains anyway (that deep percolation is counted as seepage and percolation, so no water is counted twice), the rest out of the root zone; at the wilting point the loss gives way first. A day that starts below field capacity and is not refilled loses nothing"
    source: "FAO's PERC is the loss of a flooded field ('A water layer is established ... and maintained throughout the growing season. The amount of water needed for maintaining the water layer has already been taken into account with the determination of the percolation and seepage losses', Manual 3, Step 6); the bucket has no water above field capacity (METHOD_NOTES 2), so 'at field capacity' stands for flooded or saturated. Manual 4, sec. 4.2: 'Puddling reduces the permeability of the soil and therefore also reduces the percolation losses'. Claude's reading, fixed before the first run; put to the owner"
  land_preparation:
    value: "the puddling water IS paddy_rainfed's land-preparation rain, counted once: with this switch on, paddy_rainfed's prep_mm (150 mm, Bouman et al. 2007) is replaced by sat_mm (200 mm, FAO); the rest of that rule is unchanged (rain counted from the nursery's sowing prep_days before the planned day; more than max_delay_days late, the season fails) and it applies where paddy_rainfed applies (rain-fed paddy on a calendar day, season_dates.with_paddy_rainfed). In the bucket that rain is not taken a second time: what it puts into the root zone is part of saturating it, the rest already leaves as deep percolation"
    source: "FAO's SAT (above) and paddy_rainfed's prep_mm are the same water, the soaking and puddling before transplanting; 200 mm was already paddy_rainfed's declared upper sensitivity (FAO Training Manual 4). Claude's combination, fixed before the first run; put to the owner"
  watered_case:
    value: "irrigated paddy: every ponded day is wet, so the pond's morning top-up (irrigation) also replaces the previous day's seepage and percolation. On its first day it also gets, as irrigation (land_prep_mm), the land-preparation water the rain did not give: max(0, sat_mm - the rain of the prep_days before that day - the pond's first top-up of the root zone, which is part of saturating it). Kept outside the root-zone balance, like the water above field capacity"
    source: "FAO Training Manual 3, sec. 4.4, Step 8: 'IN = ET crop + SAT + PERC + WL - Pe'; the coordinator's brief (2026-11-14 afternoon): 'the pond top-up is irrigation, so its irrigation total should grow by the same losses'. Claude's daily form, fixed before the first run"
  water_layer:
    value: "not modelled: FAO's 100-mm water layer (Manual 4, sec. 4.4, Step 6) is water held above the soil, a store the bucket has no room for (METHOD_NOTES 2); keeping it up is inside perc_mm_day (Step 6, quoted above). So a watered paddy's irrigation is short by up to 100 mm a season, and a rain-fed paddy's rain above field capacity is lost the same day instead of being held by the bunds"
    source: "FAO Training Manual 4, sec. 4.4, Step 6: 'Sometimes a water layer of 100 mm is established after transplant and maintained throughout the growing season. In other cases the water layer is reduced to 20 to 50 mm ...'. Claude's choice, stated before the first run"
  failure:
    value: "no new failure rule: rice fails only as paddy_rainfed says (land preparation more than max_delay_days late); otherwise the losses act through Ks and Ky"
    source: "Coordinator's brief (2026-11-14): a failure outcome needs a published source or the existing rules; none other is added"
  water_score:
    value: "with the losses on, the plans' water score (plans/score.water_score) counts the crop's own water need: the watered case's irrigation less irrigation_losses_mm. irrigation_losses_mm = the pond top-ups that replace the previous day's seepage and percolation (each top-up less what the crop alone used beyond that day's rain, so the first top-up of a season is the crop's) + the land-preparation water (watered_case). It is reported beside irrigation_mm in the seasons, the years and the plans, never hidden. With the losses off nothing changes"
    source: "Claude's choice (the coordinator's, 2026-11-14 afternoon), fixed before its first run; put to the owner. Why: Bouman, Barker, Humphreys, Tuong et al. (2007), 'Rice: feeding the billions', ch. 14 of Water for Food, Water for Life (IWMI/Earthscan), p. 523: 'Though runoff, seepage, and percolation are losses at the field level, they are often captured and reused downstream and do not necessarily lead to true water depletion at the irrigation area or basin scales. However, the proportion and magnitude of reuse of these flows are not generally known'; p. 526: 'Percolation from rice fields, canals, and storage reservoirs recharges groundwater systems'. Perry, Steduto & Karajeh (2017), Does improved irrigation technology save water? A review of the evidence (FAO, Cairo; ISBN 978-92-5-109774-8), p. 8: 'percolation from “inefficient” irrigation ... is often a major source of aquifer recharge'. Whether this valley's percolation is reused is not known (diary.groundwater is falling, so the score is already made stricter: plans.water_strict_when_falling); that is why the losses stay visible"

field_capacity_measured:          # owner's item 4 (2026-11-14 afternoon): the field's own field capacity. Written and committed before its first run
  # Protocol for the team: notes/FIELD_CAPACITY_PROTOCOL.md. Code: pipeline/fetch/field_visit.py (reads the file, data card),
  # pipeline/twin/field_capacity.py, pipeline/plans/twin_options.soil_versions. Sources opened 2026-11-14 by a research
  # sub-agent (Claude); the FAO-56 and FAO Soils Bulletin 79 lines re-read by Claude.
  apply:
    value: false
    source: "Off until the measurements exist and the integrator or the owner switches it on; then the replay and the plans run twice, 'map' and 'measured', and both are shown. Owner, 2026-11-14: 'When the numbers arrive, use the measured field capacity instead of the soil map's, keep the map's wilting point, and show both results'"
  file:
    value: "data/field_visit/<field>/field_capacity.csv, columns part,depth_cm,tin,tin_empty_g,tin_volume_ml,wet_with_tin_g,dry_with_tin_g,dried_how,notes. Per tin: water held theta = (wet - dry) / tin volume (1 g of water = 1 ml; m3/m3), bulk density = (dry - empty) / tin volume (g/cm3)"
    source: "Core of known volume, dried at 105 C: FAO (2023) GLOSOLAN-SOP-22, Standard operating procedure for soil bulk density, cylinder method (doi:10.4060/cc7568en), sec. 7.1 'a core cylinder of known volume', sec. 8 'dry at 105 °C ±5 °C for 24 hours or until the constant weight is achieved'; USDA ARS/NRCS (2001) Soil Quality Test Kit Guide, ch. 4, p. 13: 'Soil bulk density (g/cm3) = oven dry weight of soil / volume of soil'"
  when:
    value: "48 hours after the spot was soaked below 30 cm and covered against evaporation, with no rain in between"
    source: "FAO Soils Bulletin 79 (Shaxson & Barber 2003), glossary of soil moisture terms: 'FC is best determined in the field by saturating the soil and measuring its water content after 48 hours of drainage have elapsed'; FAO-56, ch. 8: field capacity is 'the amount of water that a well-drained soil should hold against gravitational forces, or the amount of water remaining when downward drainage has markedly decreased'; Ottoni Filho et al. (2014), Revista Brasileira de Ciência do Solo 38(6):1750-1764, p. 1752: the plot 'is flooded and, after irrigation, covered with a plastic sheet to avoid evaporation', p. 1753: 48 h 'a classical value (Cassel & Nielsen, 1986)', p. 1762: measure 'in the dry season whenever possible'"
  per_depth:
    value: "the median of all tins of a depth (four parts x 3 tins = 12 per depth); the per-part medians and bulk densities go into the data card (data/cards/<field>/field_capacity.json) for the sections"
    source: "Claude's choice, fixed before the first run (one bad tin cannot move a median much); put to the owner"
  layers:
    value: "each SoilGrids layer of the twin's soil table takes the measured median where it was measured (depth-weighted where it is partly measured) and keeps the map's field capacity below the deepest measurement; the map's wilting point everywhere. It stops the run: a tin lighter wet than dry or below its empty weight, water outside 0-0.6 m3/m3 or above the tin's pore space (1 - bulk density / 2.65), a measured field capacity at or below the map's wilting point"
    source: "Owner, 2026-11-14 (apply, above). Nothing is measured below 30 cm, so the map stays there: Claude's choice, fixed before the first run; put to the owner. Ranges: CLAUDE.md golden rule 12 (soil moisture 0 to 0.6 m3/m3); 2.65 g/cm3, the usual particle density of mineral soil"
  drying:
    value: "oven at 105 C for 24 hours is the method; a microwave to constant weight is accepted; sun drying only to constant weight (two weighings a day apart agree), recorded in dried_how and reported: sun-dried soil still holds some water, so its field capacity reads a little low"
    source: "Microwave: Soil Quality Test Kit Guide (2001), p. 10: 'dry for two or more four-minute cycles at full power ... When its weight does not change after a drying cycle, then it is dry'. Air-dry against oven-dry: USDA-NRCS (2014) Soil Survey Field and Laboratory Methods Manual, SSIR 51 v2, sec. 2.3.1, p. 34: 'air-dry soils contain about 1 to 2 percent water'. No open source endorses sun drying; Claude's choice to accept it flagged, fixed before the first run"

bare_soil:
  kc:
    value: 0.3
    source: "CLAUDE.md 'Crop water use': bare soil days use a soil evaporation coefficient, 'start with 0.3, tune, document' (not yet tuned). The method used while `apply` is false: a constant Kc drawing on the next crop's whole root zone through Ks"
  # Build step 2a (2026-11-14, night; REVIEW_NOTES M7, METHOD_NOTES 18): FAO-56's surface-layer method, approved in advance by
  # the owner (a published method, not fitted to validation events). Written and committed before its first run on real data.
  # FAO-56 = Allen et al. 1998, Chapter 7, https://www.fao.org/4/x0490e/x0490e0c.htm (read 2026-11-14). Code: pipeline/twin/evaporation.py
  apply:
    value: true
    source: "Switched on 2026-11-14 07:40 by the integrator (owner's plan, item 6: 'SCIENCE UPGRADE, approved: bare-soil evaporation from the surface layer only (FAO-56 eqs. 71 to 74) instead of the constant 0.3'), after its comparison run (data/checks/demo/bare_soil_fao56/, VALIDATION 3.21). Was off from 2026-11-13 night until this switch; `kc` 0.3 is kept for the record and for --bare-soil constant"
  method:
    value: "bare days: Ke = Kr x Kc max (eq. 71 with Kcb = 0 and few = 1); Kr = 1 while De <= REW, else (TEW - De) / (TEW - REW) (eq. 74, De at the end of the previous day); E = Ke x ET0; surface layer De = max(De_prev - (rain - runoff), 0) + E, limited to 0..TEW (eqs. 77-79, no irrigation, fw = 1, no transpiration). E also leaves the root-zone bucket (the layer is its top), with no Ks (no transpiration, no stress: ETc = ETa = E), and stops if the bucket reaches TAW (eq. 86). Runoff: the same SCS runoff as the bucket. Bare soil is never irrigated"
    source: "FAO-56 eqs. 71-79. Example 31 (bare soil): 'For rain on bare soil few = 1'; 'Since the soil in this situation is bare, one could set the Kcb equal to zero so that maximum Ke becomes Ke = Kc max = 1.20. Then all of the evaporation would be deducted from the surface soil layer'. Eq. 77 includes ROi. The day's rain wets the layer after the day's evaporation (eq. 74 as printed takes De,i-1; Example 35 note 9: 'If precipitation and irrigation occur late in the day, then column 6 should be set equal to De,i-1'), as the twin's bucket takes Ks before the day's rain (FAO-56 Example 37). The order and the shared runoff are Claude's reading, fixed before the first run; put to the owner"
  ze_m:
    value: 0.10
    source: "FAO-56 eq. 73: 'Where unknown, a value for Ze, the effective depth of the soil evaporation layer, of 0.10-0.15 m is recommended'; 0.10 m is the depth of Table 19's TEW column and of Examples 31 and 35. Claude's choice within the range, fixed before the first run"
  tew:
    value: "1000 x (theta_fc - 0.5 x theta_wp) x Ze (eq. 73), with theta_fc and theta_wp of the twin's SoilGrids table (data/clean/<field>/soilgrids.parquet) averaged by depth over 0..Ze. Demo (0-5 and 5-15 cm): 25.7 mm"
    source: "FAO-56 eq. 73; the soil's own water contents (the same values as the root zone's TAW) rather than Table 19's typical ones (brief for 2a). The demo's 25.7 mm is above Table 19's loam TEW (16-22 mm) because SoilGrids' field capacity (0.33) is above Table 19's loam range (0.20-0.30)"
  rew_mm:
    value: "the midpoint of table_19_rew_mm for the USDA texture class of SoilGrids' top layer (0-5 cm). Demo: sand 33.6, silt 45.8, clay 20.6 % = loam, 8-10 mm -> 9 mm. A class with no Table 19 row (sandy clay loam, clay loam, sandy clay) stops the run"
    source: "FAO-56 Table 19; Example 31 uses REW 9 mm for loam ('For Loam: TEW ~ 20 mm and REW ~ 9 mm'). The midpoint is Claude's choice, fixed before the first run. Texture: SSSA Glossary of Soil Science Terms (2022), 'soil texture', p. 115: 'loam - Soil material that contains 7 to 27% clay, 28 to 50% silt, and <52% sand' (p. 115 opened; the other classes, on p. 116, follow the USDA Soil Survey Manual as coded in the NRCS texture calculator: TODO-VERIFY)"
  table_19_rew_mm:
    value: {sand: [2, 7], loamy sand: [4, 8], sandy loam: [6, 10], loam: [8, 10], silt loam: [8, 11], silt: [8, 11], silty clay loam: [8, 11], silty clay: [8, 12], clay: [8, 12]}
    source: "FAO-56 Table 19, 'stage 1 REW' (mm), read 2026-11-14 (its 'Silt clay loam' row is the USDA silty clay loam)"
  rew_no_row_mm:                  # owner's item 3 (2026-11-14): any field on Earth; the field abroad's top layer is sandy clay loam. Written and committed BEFORE its first run
    value: [5, 12]
    source: "FAO-56 Chapter 7, 'Evaporation reduction coefficient (Kr)' (https://www.fao.org/4/x0490e/x0490e0c.htm, opened 2026-11-14): 'The depth [REW] normally ranges from 5 to 12 mm and is generally highest for medium and fine textured soils. Typical values for REW are given in Table 19.' A texture class with no Table 19 row takes the midpoint of this general range, 8.5 mm, as rew_mm takes a row's midpoint; the run's bare-soil label says so (rew_from). It replaces the stop that rew_mm's value names for such a class (rew_mm's text is kept as committed, so the method page's earlier entries do not change). Claude's choice, fixed before the first run; put to the owner. Nepal's five fields are loam (a Table 19 row): unchanged"
  kc_max:
    value: 1.20
    source: "FAO-56 eq. 72 with Kcb = 0 and h = 0 (no plants, so the climate term, multiplied by (h/3)^0.3, vanishes): max(1.2, 0.05) = 1.20; Example 31 (bare loam): 'From Eq. 72 Kc max = 1.20'. FAO-56 allows 'about 1.1' when the soil is wetted daily or every two days; not used (Claude's choice, fixed before the first run)"
  de_start:
    value: "on the first day of each bare spell De = TEW x Dr / TAW, Dr being the root-zone depletion handed over to the spell: a root zone at field capacity starts the layer wet (De = 0), one at the wilting point starts it dry (De = TEW)"
    source: "FAO-56 Chapter 7, 'Initial depletion': 'the user can assume that the topsoil is near field capacity following a heavy rain or irrigation, i.e., De, i-1 = 0. Where a long period of time has elapsed since the last wetting, the user can assume that all evaporable water has been depleted ... i.e., De, i-1 = TEW'. Between those two cases the root zone's own relative depletion, the fraction the twin already carries at every hand-over (METHOD_NOTES 1, season.carry_over). Claude's reading, fixed before the first run; put to the owner"

kc_climate:                       # REVIEW_NOTES M7, owner review of d34fa93 (item 6); twin/crops.py, twin/season.py
  apply:
    value: true
    source: "Owner review of d34fa93, item 6: add the FAO-56 Kc climate adjustment (eqs. 62 and 65) using RHmin and u2 from our weather. FAO-56 Chapter 6 (https://www.fao.org/4/x0490e/x0490e0b.htm, read 2026-11-12): Table 12 Kc mid and Kc end 'represent those for a sub-humid climate with an average daytime minimum relative humidity (RHmin) of about 45%' and 'calm to moderate wind speeds averaging 2 m/s'. Per season: u2 (POWER WS2M) and RHmin (eq. 63 from the weather table's ea and corrected Tmax) averaged over the mid-season days for Kc mid and the late-season days for Kc end; h is the crop's Table 12 maximum height (crops.json height_m), as in Example 27. Checked against Example 27 (maize: Taipei 1.07, Mocha 1.30) and Box 15 (dry bean 1.19)"
  limits:
    u2_ms:
      value: [1.0, 6.0]
      source: "FAO-56 eq. 62: 'for 1 m s-1 <= u2 <= 6 m s-1'. 'The limits expressed for parameters u2, RHmin and h should be observed'; FAO-56 gives no rule for values outside them, so they are held at the nearest limit (our reading)"
    rhmin_pct:
      value: [20.0, 80.0]
      source: "FAO-56 eq. 62: 'for 20% <= RHmin <= 80%'; held at the nearest limit (our reading). The monsoon often exceeds 80%"
    h_m:
      value: [0.1, 10.0]
      source: "FAO-56 eq. 62: '0.1 m < h < 10 m' (eq. 65 prints the same limits inclusive); every crop height in crops.json lies inside"
  kc_end_min_to_adjust:
    value: 0.45
    source: "FAO-56 eq. 65: 'only applied when the tabulated values for Kc end exceed 0.45'; 'No adjustment is made when Kc end (Table) < 0.45'. Exactly 0.45 is read as not adjusted"

water_source_unknown:
  show:
    value: "both cases side by side: the replay's own fields are rain-fed ('if you can't water'), its irrigated object is watered ('if you can water'); plans/simulate.py WATER_CASES['unknown']"
    source: "Owner, 2026-11-12 (owner's batch decisions, item 8): keep the demo field's water_source unknown (null) and show BOTH cases side by side, in the export and on screen, clearly labelled 'if you can water' and 'if you can't'. In the export each replay year's harvest, dry_days and event are the rain-fed case and its irrigated object is the watered case (both always written); field.water_source says 'unknown'. Was: treat unknown as rain-only (step-4 review item 5)"

crop_calendar:
  rule:
    value: sow at the middle of the crop's default sowing window; season length from crops.json stages_days. Step 7's plan generator may also sow at the window's start or end and keeps the sequences that fit without overlap; the current plan stays at the middle. No relay cropping, so maize then rice stays out (rice's latest default sowing is 15 Jul)
    source: "Claude's choice, owner-approved 2026-11-12 (step-4 review item 5); start, middle or end in step 7 owner-approved 2026-11-12 (owner's batch decisions, item 10). Windows from the FAO Crop Calendar, Nepal Hill zone (crops.json calendar sources)"
  zone_from_fao:                  # owner's item 3 (2026-11-14): a field with no country profile takes its zone's FAO calendar (config/countries/default.yaml crop_calendar; pipeline/fetch/cropcalendar.py). Written and committed BEFORE its first run
    value: "for the zone the field config names (fao_crop_calendar country and aez, picked by a person): each FAO session of a library crop (fao_crop_ids) becomes a window: sow = early_sowing, sow_end = later_sowing, harvest = early_harvest, harvest_end = late_harvest, days = growing_period in days ('155 - 165' -> [155, 165]); a session with no growing period in days is dropped; days that cannot fit the window's own dates are recomputed from them; the note is FAO's session label plus 'Irrigated (FAO)' or 'rainfed (FAO ...)' when FAO's comments open with 'Irrigated', 'Not irrigated' or 'Unirrigated'. The default window is the session the field config names by FAO's label (crop_calendar_defaults), else the first listed. Stage lengths: FAO-56's (stages_fao56, else stages_days) when their total lies in the default window's days, else scaled to the middle of those days, rounded half up (pipeline/twin/crops.scale_stages). A library crop FAO does not list in the zone gets no window and is never sown there (simulate false)"
    source: "Owner's item 3, 2026-11-14 ('FAO crop calendars by country' as the global default). The mapping copies how crops.json's Nepal windows were read from the same API (crops.json calendar sources; a session without days dropped, as Nepal's fourth rice session; days recomputed from dates, REVIEW_NOTES H4; stages kept or scaled to the window's middle, REVIEW_NOTES H4, owner-approved 2026-11-12). The irrigation words, the first-listed default and rounding half up are Claude's choices, fixed before the first run; put to the owner. API field names from api-cropcalendar.apps.fao.org/api/v1 (opened 2026-11-14): early_sowing, later_sowing, early_harvest, late_harvest, growing_period {period, value}, additional_information, comments"
  fao_crop_ids:
    value: {rice: "0303", wheat: "0373", potato: "0283", lentil: "0200", maize: "0113", mustard: "0109", buckwheat: "0061"}
    source: "The FAO Crop Calendar ids of the Nepal Hill-zone entries crops.json's windows were read from (api-cropcalendar.apps.fao.org/api/v1/countries/NP/cropCalendar?language=en&aez=002, opened 2026-11-14): Rice 0303, 'Wheat, bread' 0373, Potato 0283, Lentil 0200, 'Corn, sweet' 0113 (crops.json maize: 'id 0113 = Maize in FAO's Nepal list'), 'Colza(rapeseed)' 0109 (crops.json mustard), 'Buck Wheat (Sweet)' 0061. Finger millet's windows are not FAO's (Chaulagain et al. 2025), so it has no id and is not sown abroad"

ky_assumed:                       # owner, step-4 review item 4, 2026-11-12
  neutral:
    value: 1.0
    source: "Owner, step-4 review item 4, 2026-11-12: for crops with no published seasonal Ky, use a neutral Ky of 1.0 (yield falls in step with water shortage), labelled 'assumed' in crops.json and in the explanations"
  sensitivity:
    value: [0.8, 1.2]
    source: "Owner, step-4 review item 4, 2026-11-12: rerun the plan ranking with Ky 0.8 and 1.2 for those crops and report whether the ranking changes"

replay:                           # build step 5 (pipeline/plans/simulate.py, scripts/run_replay.py)
  year_of_season:
    value: the year the season is harvested (its last day)
    source: "Claude's choice, owner-approved 2026-11-12 (owner's batch decisions, item 13): a winter crop sown in Oct-Nov belongs to the year of its harvest (potato sown 30 Oct 2001 counts in 2002)"
  combine_crops:
    value: a year's harvest is the mean of its crops' harvest percentages; its dry days are their sum
    source: "Claude's choice, owner-approved 2026-11-12 (owner's batch decisions, item 14): the contract (replay_year) has one harvest and one dry-day count per year"
  complete_years_only:
    value: true
    source: "Owner-approved 2026-11-12 (owner's batch decisions, item 14): export only years in which every crop of the rotation was harvested. For rice then potato that is 2002-2025: 2001 has rice only (potato sown in Oct 2000 has no weather), so its basket would look like the best year only because its winter crop is missing"
  rotation_unknown:
    value: [rice, potato]
    source: "Placeholder while config/fields/<field>.yaml current_rotation is null: the owner's placeholder rotation for the demo field, rice in the monsoon then potato in winter (owner, 2026-11-12; was wheat then rice from CLAUDE.md build step 4). The owner sets the real rotation with the farmer; every output says it is a placeholder. Demo field only (owner-approved 2026-11-12 (owner's batch decisions, item 16)): any other field with a null current_rotation stops the run with an error, because rice then potato means nothing for a field abroad"
  rotation_unknown_fields:
    value: [demo]
    source: "Owner-approved 2026-11-12 (owner's batch decisions, item 16): only these fields may fall back to rotation_unknown; any other field with a null current_rotation stops (plans/simulate.py rotation_for)"
  water_cases:
    value: [rain-fed, irrigated]
    source: "Owner, step-4 review item 3, 2026-11-12: run every replay both rain-fed and irrigated and keep both results, so the site can show what irrigation changes. Irrigated = refill whenever Dr passes RAW (CLAUDE.md), water assumed always available"
  dry_run_min_station_coverage:
    value: 0.9
    source: "Claude's choice, owner-approved 2026-11-12 (owner's batch decisions, item 2), for the TEMPORARY station-rain dry run only (never exported): a year is used only if the station has rain on at least 90% of its days; missing days are filled from POWER and flagged"

events:                           # replay.<plan>[].event (build step 5); sources opened 2026-11-12 by a research sub-agent
  scope:
    value: "one weather event per calendar year for the field, the same on every plan: from the field's rain alone, never from a plan's crop seasons"
    source: "Owner, 2026-11-13 (answer 9 to REVIEW_2 M4): one weather event per year for the field on every tab (events computed from each plan's crop seasons differed between plans in 7 of 24 years). Fixed and committed before its first run (owner's answer 21)"
  seasons:
    value: {monsoon: [6, 7, 8, 9], winter: [12, 1, 2]}
    source: "DHM's seasons, as in its seasonal summaries (monsoon June to September; winter December to February, counted in the year of its January and February; a winter with a month missing from the record is left out). Drought (drought_decile_max) is judged on each season's rain total over the record's seasons; where a year's drought comes from one season the export says which (replay year event_season: 'winter' or 'monsoon'; owner's answer 9: 'dry winter'). Claude's reading of the owner's answer, fixed and committed before its first run; put to the owner"
  flood_day:
    value: "the calendar year's wettest day (ETCCDI Rx1day), in deciles flood_decile_min..10 of the record's years"
    source: "Owner's answer 9 (one event per year for the field): the wettest day of the calendar year, no longer of a plan's crop-season days, which is ETCCDI's own annual Rx1day (etccdi.pacificclimate.org list of 27 indices). Classes and deciles as before (flood_decile_min). Claude's reading, fixed and committed before its first run; put to the owner"
  drought_decile_max:
    value: 2
    source: "Rainfall deciles (Gibbs & Maher 1967, Bureau of Meteorology Bulletin No. 48; cited by WMO & GWP 2016, Handbook of Drought Indicators and Indices, WMO-No. 1173, pp. 11-12). Classes from Hayes, 'Drought Indices', National Drought Mitigation Center (archived 2009-05-10, https://webarchive.library.unt.edu/eot2008/20090510055327id_/http://www.drought.unl.edu/whatis/indices.htm): 'deciles 1-2: lowest 20% much below normal'. Applied to each crop's season rain over the replay record, decile = ceil(10 x rank / n) with average ranks for ties. The method wants a long record (Australia uses 100 years); 25 seasons is short. Calling 'much below normal' a drought: Claude's choice, owner-approved 2026-11-12 (owner's batch decisions, item 17)"
  flood_decile_min:
    value: 9
    source: "Owner, 2026-11-12 (owner's batch decisions, item 18): the flood rule is fixed in advance from sources, never chosen by checking which value matches the known floods, because those events are validation layer 4.1. A year is a flood year when its wettest crop-season day is in deciles 9-10 of the record's years. Wettest day: ETCCDI Rx1day, 'Monthly maximum 1-day precipitation', Rx1day = max(RR) (ETCCDI, 'Climate Change Indices: Definitions of the 27 core indices', http://etccdi.pacificclimate.org/list_27_indices.shtml, read 2026-11-12; Karl, Nicholls & Ghazi 1999, Climatic Change 42, 3-7), taken here over the days of the year's crop seasons. Classes: Hayes, 'Drought Indices', NDMC (archived 2009-05-10, URL as for drought_decile_max): 'deciles 9-10: highest 20% much above normal' (Gibbs & Maher 1967). Decile = ceil(10 x rank / n) over the years, average ranks for ties, as for drought. Mirrors the drought rule (much below normal season rain). By construction about one year in five is a flood year, whatever the amounts: a relative rule, as the drought rule is. Replaces 'a season day of 100 mm or more' (DHM 'very heavy'), which marked 10 of 25 years"
  precedence:
    value: [drought, flood]
    source: "Claude's choice, owner-approved 2026-11-12 (owner's batch decisions, item 19): the contract allows one event per year; drought before flood, in the contract's enum order. Frost is no longer a replay event (owner, 2026-11-12, REVIEW_NOTES M1): the frost Tmin is known to overcount cold nights, so frost is shown only as a risk band in the monthly calendar (diary.months[].frost), never per year. The removed per-year rule (wheat 0 C mid-season, potato -2 C whole season, with its sources) is kept in METHOD_NOTES.md for the record"

groundwater:                      # diary.groundwater from GRACE (D5, D7)
  # step 6c additions (pipeline/diary/groundwater.py), fixed before they were run:
  alpha:
    value: 0.05
    source: "Seasonal Mann-Kendall test (Hirsch, Slack & Smith 1982; Hirsch & Slack 1984; pymannkendall.seasonal_test) at the conventional 5% level. Claude's choice of test, owner-approved 2026-11-13: the test fits a monthly series with a strong yearly cycle and gaps (GRACE/GRACE-FO 2017-2018)"
  direction_rule:
    value: "steady unless p < alpha; then falling or rising by the sign of the seasonal Sen slope"
    source: "Claude's choice, owner-approved 2026-11-13 (D7: 'the rule for steady and for confidence is set and cited in rules.yaml at step 6'): 'steady' = no trend at the test's 5% level"
  confidence_rule:
    value: "1 - p"
    source: "Claude's choice, owner-approved 2026-11-13, no published source: how strongly the record shows a change (1 - the test's p-value); not a probability that the direction is right"
  scale_factor:
    value: "not applied: the unscaled trend is the main number; the factor's value at the cell is recorded in the card"
    source: "Owner, 2026-11-12 (REVIEW_NOTES M4): the CRI scale factor is CLM-based (land hydrology) and the mascon includes glaciers and snow; no source was found for applying it here, so it is not applied (earlier the same day: applied). File attribute (scale_factor.description): 'Gridded scale factors to be used with mascon solution that has the CRI filter applied; based on CLM data from 2002-2009'. A positive factor cannot change the trend's direction (the reader refuses a non-positive one)"
  caveat:
    value: "Regional water storage, not the field's own aquifer: GRACE measures the total water stored over an area hundreds of km across (one 3-degree mascon, about 330 km), including glaciers and snow in the mountains and the groundwater of the plains. It is not the field's own well or aquifer."
    source: "Owner, 2026-11-12: say this in diary.groundwater and every explanation. 3-degree equal-area mascons: the file's geospatial_lat_resolution attribute"

probe:                            # build step 10 (robot/bridge.py); the probe is the robot teammate's own build
  serial_line:
    value: "Temperature: 23.1 °C  |  Moisture: 45%"
    source: "Owner, 2026-11-12: the probe prints one line every 2 seconds over USB serial in exactly this format, and 'Temperature: Check wiring  |  Moisture: 45%' when the temperature sensor is disconnected. Moisture is already 0-100%, calibrated on the probe itself. The probe's code is not changed and not in this repository"
  repeat_spread_max_pct:
    value: 3
    source: "Claude's proposal, owner-approved 2026-11-12 (owner's batch decisions, item 24): five readings of one cup 'barely differ' (VALIDATION 5.2) when max - min is at most 3 points on the probe's 0-100% moisture scale; the variance of the same five readings is recorded as the probe's error variance R (CLAUDE.md 'Probe fusion'). No standard was opened; the robot teammate may tighten it after the first bench test"
  # Build step 10 (pipeline/twin/kalman.py, pipeline/fetch/now.py, scripts/run_twin_now.py, robot/calibrate.py, robot/bridge.py,
  # scripts/build_probe_log.py). Written and committed BEFORE the first run on real data (owner's answer 21); none of it is
  # tuned to a result. Everything below marked "Claude's choice" is put to the owner.
  kalman:
    state:
      value: "the twin's root-zone wetness 100 x (1 - Dr/TAW) in percent (0 = wilting point, 100 = field capacity) on the as_of day, for the field's current plan (data/checks/<field>/plans.json shown.current) in the field's export water case (pipeline/plans/simulate.export_case: rain-fed while the water source is unknown), run day by day from the first weather day through the as_of day (weather.parquet, then weather_now.parquet), the crop in the ground on that day included even though its season is not over"
      source: "CLAUDE.md 'Probe fusion': predict x = twin soil wetness for today; the brief for step 10 (2026-11-13). Claude's reading, 2026-11-14"
    as_of:
      value: "the last day on which NASA POWER has every input the twin uses (T2M_MAX, T2M_MIN, RH2M, WS2M, ALLSKY_SFC_SW_DWN) and IMERG Late V07 has rain (POWER may fill only the rain of days IMERG lacks, as in weather.py: decision D and power_rain.max_filled_fraction_per_year). Nothing after it is filled or guessed; the state is labelled 'as of <date>'"
      source: "Brief for step 10 (2026-11-13): 'the latest day both have'. POWER's solar input (FLASHFlux) arrives days after its meteorology (GEOS-IT), so the solar input usually sets the date"
    p0:
      value: {years: [2002, 2025], half_window_days: 15}
      source: "Claude's choice, 2026-11-14 (CLAUDE.md: P0 from comparing SMAP with the twin; the brief's example: what the calendar alone tells): P0 = the mean, over the days within 15 days either side of the as_of day's calendar day, of the variance across the years 2002-2025 (the exported complete years) of the twin's wetness on that day. Averaging per-day variances keeps the seasonal change inside the 31-day window out of P0; the window steadies a variance taken from 24 years"
    prior:
      value: "prior_var = P0 x (1 - r^2); sure_prior = 1 - sqrt(prior_var / P0). r = the correlation of the daily anomalies of the twin's wetness (the state run) and of SMAP L4 root-zone soil moisture (SPL4SMGP sm_rootzone, data/clean/<field>/smap.parquet) over every day both have; a day's anomaly = its value minus the same series' mean over the days within 15 days either side of its calendar day, in the years both have"
      source: "CLAUDE.md 'Probe fusion' (P0 and Q come from comparing SMAP with the twin). Claude's choice, 2026-11-14: 1 - r^2 is the share of the twin's anomaly variance that the best straight line on SMAP's anomaly leaves unexplained. If SMAP's errors are independent of the twin's errors and of the truth, the twin's own error variance cannot be larger, so prior_var is an upper bound and sure_prior a lower bound; with shared errors (both are models; SMAP L4's rain forcing is gauge-corrected and may share gauges with IMERG) it is not a bound. SMAP L4 is model-assisted, at 9 km, 0-100 cm: not the field's root zone. One r for every time of year (the r of the 31 days around as_of is reported, not used)"
    q:
      value: "q_var_per_day = prior_var x (1 - phi^2), phi = the lag-1 autocorrelation of the daily residual (twin anomaly minus k x SMAP anomaly, k the least-squares slope). Predict: P = min(P + Q x days since the last update, prior_var)"
      source: "CLAUDE.md 'Probe fusion' (Pk = Pk + Q, the model variance grows daily). Claude's choice, 2026-11-14: if the twin's error behaves like a first-order autoregressive series with variance prior_var and lag-1 autocorrelation phi, its growth over the first day from a known state is prior_var x (1 - phi^2); the cap keeps P from passing what the twin alone gives"
    age_after_as_of:
      value: "on a day after as_of the prior is the as_of state (x unchanged) with P = min(prior_var + q_var_per_day x whole days since as_of, p0_var); sure from that P and the as_of day's P0"
      source: "Claude's choice, 2026-11-14 (added before the first run): POWER's solar input arrives about ten days late, so on the demo day the twin's state is days old. Its variance grows by Q a day (the rule above), capped here at P0, what the calendar alone tells, because no weather of those days is known. Keeping x is the simplest forecast (persistence); its drift is not modelled"
    r:
      value: "sure is computed only after the bench test, with the R it produces; until then sure is null. R (twin wetness points squared) = R_probe (probe.bench.r, probe percent squared) x (b / (theta_fc - theta_wp))^2, b = the bench fit's slope in water-% points per probe % at the reading, theta_fc and theta_wp the twin state's root-zone values"
      source: "Owner's probe brief, 2026-11-14 ('the Kalman sure is computed only after the bench test, using the R that the bench test produces'); CLAUDE.md 'Probe fusion' (R from repeated readings). Replaces the five-repeat-cup R committed in 6ca9bd1 (never run). The conversion is the chain rule through water % -> theta -> wetness (FAO-56 eqs. 82, 85). R is the probe's repeatability only: it leaves out the fit's own error and the depth mismatch (the probe senses the top few cm, the twin's root zone is 0.4-1.5 m), so sure after a reading is too high"
    one_part_one_measurement:
      value: "a part's settled reading (the median of its probe.measure_lines lines) is one measurement: the part is updated once from the twin's prior (wetness_pct, prior_var aged by age_after_as_of); a part measured again starts from the twin again; an off-scale or not-steady reading is never fused"
      source: "Owner's probe brief, 2026-11-14 (fix 1: settle, then measure; one number per part). Replaces one_session_one_measurement and not_fused_readings_pct committed in 6ca9bd1 (never run): lines 2 s apart from one insertion share their error, so they are not stacked"
    z:
      value: "z = 100 x (water_pct / 100 - theta_wp) / (theta_fc - theta_wp), theta_fc and theta_wp the twin state's root-zone values"
      source: "FAO-56 eqs. 82 and 85 for an evenly wet root zone: 1 - Dr/TAW = (theta - theta_wp) / (theta_fc - theta_wp). Claude's reading, 2026-11-14: the probe's few cm stand for the whole root zone (stated)"
    z_outside_bucket:
      value: "a converted reading below 0 (drier than wilting point) or above 100 (wetter than field capacity) is set to 0 or 100 for the update; the log keeps the value before and a flag z_limited"
      source: "Claude's choice, 2026-11-14: the bucket holds no water above field capacity (FAO-56 eq. 88 drains it the same day) and none below wilting point (eq. 86), so the twin cannot take a value outside 0-100"
  settle_lines:
    value: 20
    source: "Owner's probe brief, 2026-11-14 (fix 1): per part, discard the first 20 good lines (40 s at the sketch's 2-second lines) while the probe settles. The bench log reports how long settling really takes (probe.bench.settling)"
  measure_lines:
    value: 10
    source: "Owner's probe brief, 2026-11-14 (fix 1): then take the next 10 good lines (20 s); a part's reading is their median moisture and median temperature, with their spread (max - min) and n. Steady when the moisture spread is at most repeat_spread_max_pct; otherwise 'test_again' and no number"
  temp_spread_max_c:
    value: 0.5
    source: "Owner's probe brief, 2026-11-14 (fix 1: 'for example a spread of at most 0.5 C over the 10 lines'); the DS18B20's stated accuracy is +/-0.5 C from -10 to +85 C (Maxim / Analog Devices DS18B20 datasheet; cited from memory, not opened tonight). A part whose temperatures spread wider gets temp null ('not steady'); its moisture still counts. 'Check wiring' lines give no temperature and still give moisture"
  off_scale_pct:
    value: [0, 100]
    source: "Owner's probe brief, 2026-11-14 (fix 1): the sketch limits moisture to 0..100 (constrain), so a median of 0 or 100 is 'off the scale': shown as that, never as a real value (no water_pct, no band, not fused)"
  same_band_pct:
    value: 3
    source: "Claude's choice, 2026-11-14 (fix 4: without a calibration the site shows only 'drier / wetter than the other parts'): a part is 'drier' or 'wetter' than the median of the other measured parts when it differs by more than repeat_spread_max_pct (3 points, owner-approved), otherwise 'about the same'"
  probe_depth_m:
    value: 0.10
    source: "Claude's choice, 2026-11-14: the probe's blade senses about the top 10 cm (a capacitive blade about 10 cm long; not measured on this probe, the owner may give the real length). Used only to pick the SoilGrids layers for the band"
  band:
    value: "theta = water_pct / 100; theta_fc and theta_wp = SoilGrids water at 33 and 1500 kPa, depth-weighted over 0..probe_depth_m (data/clean/<field>/soilgrids.parquet); theta_raw = theta_fc - p x (theta_fc - theta_wp), p = crops.json p (FAO-56 Table 22) of the crop in the ground on the twin state's day. 'needs water' below theta_raw, 'good' from theta_raw to theta_fc, 'too wet' above theta_fc; no calibration or bare ground: no band"
    source: "Owner's probe brief, 2026-11-14 (fix 4): needs water below the point where that crop starts to suffer, good between that and field capacity, too wet above field capacity. FAO-56 ch. 8, eqs. 82-84: stress starts (Ks < 1) when depletion passes RAW = p x TAW, i.e. theta below theta_fc - p (theta_fc - theta_wp); field capacity is the water held at 33 kPa, wilting point at 1500 kPa. The top layers (where the probe reads) and the table p, not the day's ETc-adjusted p, are Claude's reading; bare ground has no crop to suffer (Claude's choice). Caveats shown: the soil cell is 859 m from the field; the reading is for the top few cm, not the root zone"
  bench:                          # fix 3: the bench test (robot/bench.py, scripts/run_probe_bench.py). Fixed before any bench data exists
    water_pct:
      value: "a cup's true water % = water_added_g / cup_volume_ml x 100 (1 g of water = 1 ml)"
      source: "Owner's probe brief, 2026-11-14 (fix 3c). Water added only: the sun-dried soil's own few percent are not counted (stated)"
    push_ins:
      value: 3
      source: "Owner's probe brief, 2026-11-14 (fix 3): 3 push-ins per cup, Enter between, each settled and measured as in the field (settle_lines, measure_lines)"
    cup_value:
      value: "the median of the cup's steady, on-scale push-in medians"
      source: "Claude's choice, 2026-11-14: one odd push-in must not move a cup"
    exclude_cups:
      value: "a cup is left out of the fit and the order test (and listed with the reason) when its notes say water pooled on top or the soil could not be packed to the line (notes containing 'pool' or 'pack'), when water_added_g / cup_volume_ml exceeds its pore space 1 - (dry_soil_g / cup_volume_ml) / 2.65, when its value is off the scale (0 or 100), or when no push-in is steady"
      source: "Owner's probe brief, 2026-11-14 (fix 3: excluded by a rule written down before fitting; soil can't hold more water than its pore space). 2.65 g/cm3 is the usual particle density of mineral soil (standard soil-physics value, e.g. Hillel, Introduction to Environmental Soil Physics; cited from memory, not opened tonight). The note words are Claude's choice"
    r:
      value: "R_probe (probe percent squared) = the pooled variance of the steady push-in medians about their own cup's mean (sum of squared deviations over the cups used / sum over those cups of (push-ins - 1)), at least 1/12"
      source: "Owner's probe brief, 2026-11-14 (fix 3a: the variance of the repeats is the probe's error R, for the Kalman). Pooling over cups is Claude's reading; the 1/12 floor is the rounding to whole percents (a rounding error spread evenly over one step has variance step^2 / 12)"
    steady:
      value: "every push-in's spread (max - min of its measured lines) at most repeat_spread_max_pct; the spread between a cup's push-in medians is reported beside it"
      source: "Owner's probe brief, 2026-11-14 (fix 3a; VALIDATION 5.2): the spread within each push-in (rule <= 3) and between the 3 push-ins"
    order:
      value: "the values of the cups used, in order of water_added_g, must rise strictly; Spearman's rho is reported"
      source: "Owner's probe brief, 2026-11-14 (fix 3b; VALIDATION 5.3): pass only if strictly increasing"
    fit:
      value: "water % = a + b x probe %, least squares over the cups used; a quadratic is used instead only if there are at least 5 cups and its leave-one-cup-out mean absolute error is at least 1.0 water-% point lower than the line's; the residuals of both are reported"
      source: "Owner's probe brief, 2026-11-14 (fix 3c): a straight line by default; decide before looking at the data when a curve would be used. The 1.0-point margin and the 5-cup minimum are Claude's choices, fixed before any bench data"
    error:
      value: "leave one cup out: refit without the cup and predict it; the mean absolute error in water-% points (MAE) is the 'give or take'"
      source: "Owner's probe brief, 2026-11-14 (fix 3c): the score is never on the cups it was fitted on (VALIDATION 5.1)"
    min_cups:
      value: 4
      source: "Claude's choice, 2026-11-14: a line scored by leaving one cup out needs at least 4 cups, so that each refit has 3"
    ice_c:
      value: {expected: 0.0, tolerance: 0.5}
      source: "Owner's probe brief, 2026-11-14 (fix 3d): the ice-water cup should read 0 C within about 0.5 C (DS18B20 datasheet, +/-0.5 C from -10 to +85 C; cited from memory, not opened tonight)"
    settling:
      value: "per push-in, the settling time = the time from its first good line to the first line from which every later line of the push-in stays within repeat_spread_max_pct of its measured median"
      source: "Owner's probe brief, 2026-11-14 (fix 1: use the bench log to report how long settling really takes). The definition is Claude's choice"
    real_only:
      value: "config/probe_calibration.yaml is written only from push-ins read from a real serial port, with every proof run; a log from the fake probe, stdin or a pseudo-terminal gives a labelled rehearsal result and no calibration file"
      source: "Owner's probe brief, 2026-11-14 (fix 3: no such file until real bench data exists); golden rule: no made-up number is exported"
    spoon:                        # the rough calibration without a scale (owner, 2026-11-15). Committed before any cup was measured. A cups sheet with the column cup_spoons uses these rules; the weighed-cup rules above stay for a sheet with grams
      reference:
        value: "each cup is filled to the same line; its volume N = level spoonfuls of water to the line (one spoon for everything); the water added to cup k = w_k level spoonfuls of the same spoon; reference water content = w_k / N m3/m3 (water % = 100 x w_k / N), with the w_k actually added. The spoon's size cancels out. A printed cup volume (ml), when the cup has one, is recorded as a cross-check: spoon size = printed volume / N is reported, never used"
        source: "Owner, 2026-11-15 ('4 cups but no scale: a rough volumetric calibration with the spoon method')"
      levels:
        value: "4 cups: w_k = 0, 10, 20 and 30 % of N (to the nearest level spoonful; the reference uses the spoonfuls written down), each mixed in a bowl until even and packed back to the line; a cup that will not go back to the line has 'pack' in its notes and is left out (exclude_cups)"
        source: "Owner, 2026-11-15. Nearest whole spoonful: Claude's choice (a level spoon is the most repeatable measure)"
      dry_soil:
        value: "the soil is air-dried as far as possible; its starting moisture is not known and the reference counts only the water added, so every cup's true water content may be a few percent above its reference: the dry point may be a few percent above zero. Stated with every result; not inside the error"
        source: "Owner, 2026-11-15"
      pore_space:
        value: "not tested: without a scale the dry soil's mass is not known (exclude_cups's pore-space test needs it). The notes words ('pool', 'pack') and the steady and off-scale tests still leave cups out"
        source: "Claude's reading, 2026-11-15"
      push_ins:
        value: "3 per cup (push_ins), driest cup first; the probe is let go of while it settles and measures. Whether the cups were logged driest first is reported (driest_first), not a pass or fail"
        source: "Owner, 2026-11-15"
      error:
        value: "the bench's straight line (fit; with 4 cups a quadratic is never used), scored leave one cup out (error): the mean absolute error ('give or take') and the root mean square error, both in m3/m3"
        source: "Owner, 2026-11-15 ('fit the probe reading to the reference, give the leave-one-out error')"
      passes:
        value: "the cups used rise strictly (order), at least min_cups are used, and the leave-one-cup-out root mean square error is at most 0.04 m3/m3 (4 water-% points)"
        source: "Owner, 2026-11-15: compare it with SMAP's 0.04 m3/m3 yardstick (NASA SMAP's accuracy requirement, Entekhabi et al. 2010, Proc. IEEE 98:704, Table 1, as in verification.outputs). SMAP's is a root-mean-square-type requirement, so the RMSE is compared; it is never smaller than the MAE, so this is the stricter reading (Claude's choice)"
      label:
        value: "rough calibration (spoon measures, air-dried soil)"
        source: "Owner, 2026-11-15: on bench.json, on the calibration file and with every reading calibrated by it"
      use:
        value: "config/probe_calibration.yaml is written only if it passes (and real_only holds): only then does the fog clear with it. In the Kalman update its own error is added to the probe's: R (water-% points squared) = R_probe x b^2 + the leave-one-cup-out mean squared error, then converted to wetness points as in probe.kalman.r. If it fails: no calibration file, the site keeps 'drier / wetter than the other parts' and the fog stays"
        source: "Owner, 2026-11-15 ('use it for the fog only if it passes, with its own error in the Kalman update'). Adding the two variances (a reading's repeat noise and the line's own error) is Claude's reading"
  live:
    stale_after_s:
      value: 10
      source: "Claude's choice, 2026-11-14 (REVIEW_2 L7): live.json is marked stale (stale: true, with the reason) when no good line has come for 10 s (five of the probe's 2-second lines), when the port closes or the USB cable is pulled, and when the bridge stops, so the site never shows an old reading as live"
    reconnect_every_s:
      value: 2
      source: "Claude's choice, 2026-11-14 (REVIEW_2 L7): after a pulled cable the bridge says so in plain words, marks live.json stale and tries to reopen the port every 2 s (the probe's own line interval) until it is back or Ctrl-C"
    state_writes:
      value: "live.json is written when a part starts settling, when it starts measuring and when it is done or test_again, never with a number taken while the probe settles; every raw line still goes to the log (data/probe/<field>/readings_<date>.jsonl)"
      source: "Owner's probe brief, 2026-11-14 (fix 2): write live.json only with the final median for a part, not every line; keep logging every raw line"
    replay_sources:
      value: ["serial"]
      source: "Golden rule: no made-up number is ever exported (owner, 2026-11-13). Only sessions read from a real serial port may enter site/data/probe_log.json; sessions from robot/fake_probe.py, stdin or a pseudo-terminal are refused, and those sources may not write under site/data/ at all"
    practice_on_phone:
      value: "the site never reads a practice reading (one not from a real serial port, robot/bridge.py is_real), on any address: it would show as the field's parts. The soil test and Today show only readings of the field itself; without them the soil test says 'Readings come after our team tests it'. The fake probe never writes under site/data/ (the bridge refuses; live.json is git-ignored), so no pushed file can hold them"
      source: "Owner, 2026-11-15: 'Practice and indoor-bowl readings never show as the field's parts. The public soil screen stays at \"Readings come after our team tests it\" until the real test is published.' This replaces the owner's answer 2 of 2026-11-14 night (practice shown on the laptop's hotspot under a 'Practice: made-up numbers' banner)"
    garden_test:
      value: "a test of the probe away from the field (scripts/build_probe_log.py --test garden or --test indoor): probe_log.json kind 'garden_test' (a 2 m by 2 m garden mini-field, one patch watered) or 'indoor_test' (4 bowls of the same soil, one watered, probed in order, 60 seconds each), its note and the site's label: 'Garden test of our soil stick, recorded on <date>' or 'Indoor test of our soil stick. 4 bowls of soil, recorded on <date>' (two short sentences: the 8-word rule; the screens' word for the probe is 'soil stick': no science words outside the glossary). Every part's before and after are dropped and twin_date is null (this soil is not the field's twin, so no Kalman update with it), and its bands never set the field's soil at the start. The walk itself is the usual one: four patches or bowls s1-s4, each settled then measured, real serial port only. Owner, 2026-11-15: such a test never shows as the field's parts; the site shows it on How we know only, as bowls (its label and one line per bowl)"
      source: "Owner's answer 4, 2026-11-14 night: 'one real probe walk (the garden mini-field test: 2 m by 2 m, one patch watered, all 4 patches probed) ... build probe_log.json from it, labelled \"a garden test of our probe, recorded on <date>\"'. Owner's finishing list item 2, the same night: 'Add the indoor option ... (4 bowls of the same soil, one watered, probed in order, 60 seconds each, real probe only), labelled on the site \"Indoor test of our soil stick (4 bowls of soil), recorded on <date>\", with the same rules as the garden test.' Dropping the twin and the start band is Claude's, fixed before the first run"
    watered_check:
      value: {times_repeat_error: 2}
      how: "a garden or indoor test passes when the watered bowl (or patch) reads more than 2 x the repeat error above EVERY other bowl. A bowl's reading = the median of the 10 measured lines of its steady attempt (the number the walk already gives). Repeat error = the standard deviation of those 10 lines, pooled over the four bowls (square root of the mean of the four variances, population variance), on the probe's own 0-100 scale. If any bowl has no steady reading, the check is 'not possible'. Written into probe_log.json sessions[].check (scripts/build_probe_log.py --watered sN --watered-at HH:MM) and shown on the soil screen as one line"
      source: "Owner's message, 2026-11-14 night: 'score it with the rule fixed in advance (the watered bowl must read wetter than every other bowl by more than twice the repeat error)'. Written here before Claude knew which bowl got the water (the message left the bowl and time blank). The repeat error's definition is Claude's choice: the bench test that would give the probe's R has not run, and the walk has one steady push-in per bowl. It counts how much the readings jitter while the stick stays in, not how much they change when the stick is pushed in again, so it is a lenient test (stated in the result)"

ecostress:                        # optional layer (steps 6 and 8)
  qc_needs_valid_value:
    value: true
    source: "Owner-approved 2026-11-12 (owner's batch decisions, item 25): V002 QC and cloud layers read 0 ('best quality', 'clear') where a window has no data, so a pixel's QC and cloud values are used only where its LST or ESI value is valid (not the file's nodata and inside the product's valid range). Golden rule 12c: missing data must never pass as perfect"

gpm_series:                       # rain check B (Friday): is the 2017 jump real or a break in the data?
  break_suspected_from:
    value: 2017
    source: "Owner, 2026-11-12: from 2017 GPM's yearly totals jump well above both the Kathmandu Airport station and POWER (GPM/station about 1.0-1.2 in 2015-2016, then 1.5-2.3). Rain check B runs a change-point test on yearly GPM totals and on the yearly GPM/POWER ratio over 2001-2025, and checks the 4 neighbouring GPM cells (hills nearby?), then says whether the jump is real or a data break"
  trend_caveat:
    value: "The rain gauges behind GPM's rain around this field stopped reporting in January 2017, and GPM's rain jumps then. The twin's rain after 2016 is scaled back to GPM's own 2001-2016 level, month by month, which also hides any real change across 2017. So a rain trend over 2001-2025 cannot be trusted either way: compare it with the uncorrected run."
    source: "Owner, 2026-11-12: until the break is settled, no rain trend or monsoon-shift trend is reported without saying the break may explain it (onset, shift_days, dry spells, heavy-rain days, rain terciles). Rain check B (VALIDATION 3.9b, 2026-11-13) found a data break (gauge input lost from January 2017); the owner chose the correction below (2026-11-13, decision 1), so the caveat now names both the break and the correction"
  correction:
    value: "scale the twin's IMERG Final rain from correction_from on, month by month, back to GPM's own level over correction_reference_years: factor = the mean complete-month total of that calendar month over the reference years / its mean from correction_from to the last Final day, in the field's cell. The uncorrected rain is kept (weather.parquet rain_uncorrected_mm), every rain-based result is also run with it, and results it changes are shown as a range"
    source: "Owner, 2026-11-13 (decision 1): apply 'scale 2017-2025 month by month back to GPM's own 2001-2016 level' (best on held-out months against the Kathmandu Airport station, VALIDATION 3.9b), keep the uncorrected GPM run too and show both as a range where it changes results. Cause: IMERG Final's monthly gauge input around the field collapses in January 2017 (GPM_3IMERGM gauge weight 96-98% to 56-72%; GPCC Full Data V2022 stations in the field's 1-degree box about 50 to about 1 a month). By construction the correction also removes any real change in rain across 2017"
  correction_reference_years:
    value: [2001, 2016]
    source: "Owner, 2026-11-13 (decision 1): 'GPM's own 2001-2016 level'"
  correction_from:
    value: "2017-01-01"
    source: "Owner, 2026-11-13 (decision 1): '2017-2025'; the gauge weight drops in January 2017 (GPM_3IMERGM, VALIDATION 3.9b)"
  break_evidence:
    value: {gauge_weight_before_pct: [96, 98], gauge_weight_after_pct: [56, 72], gpcc_stations_before: 50, gpcc_stations_after: 1}
    source: "data/cards/<field>/gauge_evidence.json `summary` (pipeline/fetch/gauge_evidence.py, 2026-11-13, REVIEW_2 M6: all 297 months of 2001-01 to 2025-09 fetched; before that the numbers had been read by hand as 96-97%, and 17 of the 192 months before 2017 are in fact 98%). VALIDATION 3.9b: GPM_3IMERGM V07 gaugeRelativeWeighting at the field's cell and in the 3x3 cells around it (96-98% in every month of 2001-2016; yearly means 56-72% from January 2017) and GPCC Full Data Monthly V2022 stations in the field's 1-degree box (about 50 a month in 2011-2016, about 1 in 2017-2020), read by a research sub-agent (quotes in SI_LOG); shown on the method page"
  correction_factor_products:
    value: [final]
    source: "Owner, 2026-11-13 (answer 7): 'the same monthly factors', that is, the factors fitted on IMERG Final months (mean complete-month total over the reference years / its mean from correction_from to the last Final day). Late days never set a factor"
  level_caveat_ratio:
    value: 1.25
    source: "Owner, 2026-11-13 (answer 8 to REVIEW_2 H4): one 'unknown' line that the rain may still read high, keyed on the ratio of the twin's mean yearly rain to DHM's 1991-2020 normal of the nearest station. The limit 1.25 is Claude's choice, fixed before its first run (the lower edge of the 25 to 40 percent band that keyed the station lines, owner-approved 2026-11-12); put to the owner. A field without such a normal gets no line"
  correction_fields:
    value: [demo]
    source: "Owner, 2026-11-13 (decision 1) is about this field: 'the rain gauges behind NASA's correction disappeared around this field in January 2017'. Claude's reading, owner-approved 2026-11-13 (answer 20 to REVIEW_2): a field abroad (build step 11) is corrected only after its own rain check B finds the same break, since gauge networks differ by country"
  correction_for_samples:
    value: "A sample field (config `sample_of`), or a field that shares a sample's source box by the owner's word (config `box_of`), is corrected as the demo is, from correction_from, when its OWN break test (gpm_series.break_test; data/checks/<field>/break_test.json) finds the break in correction_from's year. A break found in another year, or any other field, is put to the owner (correction_fields)"
    source: "Integrator's choice, 2026-11-14, under the owner's decision 1 (2026-11-13) and CLAUDE.md 'Who supplies what to the twin' ('demo field only until a field's own rain check finds the break'): the Bhaktapur sample fields lie in the demo's own GPM cell or the next one, behind the same lost gauges. Fixed before any sample's rain check was run (pipeline/checks/rain_check.py break_corrected). `box_of`: owner, 2026-11-15, for the real farm in Kharipati (in the demo's own GPM cell): 'Same fix as demo' (its own rain check first; the fix only if it finds the same 2017 jump). Written and committed before Kharipati's first rain check"
  correction_products:
    value: [final, late]
    source: "Owner, 2026-11-13 (answer 7 to REVIEW_2 H4): scale the 92 IMERG Late days (Oct-Dec 2025) with the same monthly factors; owner-approved 2026-11-13. The factors are still set by IMERG Final months only (correction_factor_products). Reason: the Late check and DHM's own 2025 gauges show Late at the un-gauged, too-wet level (October 2025: 427.7 mm against 204.8 / 210.5 / 197.7 mm at three gauges; VALIDATION 3.9b, 3.9c). History: Claude's reading, fixed 2026-11-13 before the Late check (IMERG Late 2014-2019) was read: only IMERG Final days are scaled, and only they set the factors. The 92 IMERG Late days (Oct-Dec 2025, D1) are left as they are, because Late uses a climatological gauge calibration, not the monthly gauges that vanished, so the 2017 loss cannot reach it; the Late check tests that. POWER-filled days (none on the demo field) are another source and are not scaled either. If the Late check shows Late stepping up in 2017 as Final does, this is put back to the owner. Late check (2026-11-13, VALIDATION 3.9b): Late does not step with Final (1.13 against 1.62), but it is wetter than gauge-adjusted Final in 2014-2016 (Final/Late 0.64-0.85) and about equal to Final from 2017 (1.00-1.13): Late sits at the un-gauged level, so whether to scale the 92 Late days too is put to the owner"
  break_test:                     # build step 11: does a field's OWN rain check B find the break? (pipeline/checks/rain_check.py break_test)
    rule:
      value: "The break is found only when all three hold. (1) Cause, gauge input lost: the yearly mean of IMERG's monthly gauge weight at the field's 0.1 deg cell (GPM_3IMERGM V07 gaugeRelativeWeighting; years with at least min_months_per_year months) falls in some year Y, after at least min_years_before such years, by at least gauge_drop_pct_points below the mean of all the years before Y, and stays that far below that mean in every later year. (2) GPM steps against an independent product: Pettitt's test on the yearly ratio GPM / CHIRPS v3.0 rnl at the field's cells (complete years, 2001-2025) gives p below pettitt_p_max, and the first changed year (change_after + 1) is within change_year_tolerance years of Y. (3) The reference does not step then: Pettitt's test on CHIRPS's own yearly totals gives p at or above pettitt_p_max, or a first changed year outside that window. Without the gauge-weight series or CHIRPS the break is not found. Reported, never required: Pettitt on GPM's yearly totals and on GPM / POWER, GPCC's station counts in the field's 1-degree box (to 2020), and the step (mean GPM / CHIRPS from Y over the mean before Y). A field whose own test finds the break is put to the owner for gpm_series.correction_fields, with the correction from 1 January of Y; until the owner's go nothing is corrected"
      source: "Claude's choice, 2026-11-14, fixed before any rain data of the field abroad existed (brief for build step 11; REVIEW_2 H6). It asks for the independent lines of evidence of VALIDATION 3.9b (demo): the cause (the gauge weight), and a step seen against an independent product that does not itself step. Test: Pettitt 1979 (Applied Statistics 28:126-135), the change-point test rain check B already uses (pipeline/checks/rain_check.py pettitt, with its usual p approximation). GPM / POWER is reported, not required: POWER's rain is a model field that varies on its own (demo: p 0.10, VALIDATION 3.9b)"
    gauge_drop_pct_points:
      value: 20
      source: "Claude's choice, 2026-11-14: a fifth of the estimate passing from the gauge analysis to the satellite estimate, far above the spread of a gauged cell (demo 2001-2016: every month 96-98%). No published threshold found: the IMERG V07 Technical Documentation defines the variable, not a limit"
    min_months_per_year:
      value: 6
      source: "Claude's choice, 2026-11-14: a year's mean gauge weight needs at least half its months (IMERG Final ends in September 2025, so 2025 has 9)"
    min_years_before:
      value: 5
      source: "Claude's choice, 2026-11-14: at least five earlier years set the gauged level"
    pettitt_p_max:
      value: 0.05
      source: "The conventional 5% significance level, as rain check B reads Pettitt's p (VALIDATION 3.9b); Pettitt 1979's approximation p = 2 exp(-6 K^2 / (n^3 + n^2))"
    change_year_tolerance:
      value: 1
      source: "Claude's choice, 2026-11-14: yearly totals place a change at a year boundary, so a loss that starts during year Y may show first in Y or Y + 1 (and Pettitt's split can fall a year early)"

  dhm_scaling:                    # owner's queue item 4b (2026-11-14): a third rain version, side by side; never the central case unless the owner says so
    rule:
      value: "rain version 'dhm' (pipeline/twin/inputs.with_rain; runners' --rain dhm into data/checks/<field>/rain_dhm/): the twin's break-corrected rain (the central case) times one factor per calendar month, on every day of the record. Factor for month m = the station's 1991-2020 normal for m / the mean complete-month total of m in the corrected rain over `years`. The other two versions stay as they are (GPM as published, break-corrected)"
      source: "Owner, 2026-11-14 (queue item 4b): 'break-corrected, then scaled month by month to DHM Bhaktapur's 1991-2020 monthly normals', shown beside GPM as published and the break-corrected rain. Why: the corrected rain is still 1,853 mm a year, 1.35 x Bhaktapur's normal (VALIDATION 3.1, 3.9c). The exact factor is Claude's reading, fixed and committed before the first run; put to the owner"
    station:
      value: "Bhaktapur (DHM index 1052, 27.68 N, 85.42 E, 1,315 m, about 2.3 km from the field): config/dhm_normals_1991_2020.csv, precip_mm, months 1-12 (sum 1,374.7 mm)"
      source: "DHM Climate Division monthly bulletins (Annex 1 prints each month's 1991-2020 normal), as transcribed in config/dhm_normals_1991_2020.csv (owner's upgrade item 1, 2026-11-13); the nearest DHM station with normals"
    years:
      value: [2001, 2020]
      source: "Claude's choice, fixed before the first run: the years the twin's record (2001-2025) shares with the normals' period (1991-2020), so the two means cover as much of the same time as they can. The overlap problem stays: the normal also holds 1991-2000, which the twin has no rain for, and 2021-2025 are scaled with factors fitted without them; a real change in rain between the decades would be scaled away, as the 2017 correction already removes any real change across 2017"
  gauge_calibration:              # owner's choice pending (2026-11-14): the corrected rain or the gauge-calibrated winner of verification.rain_selection as the twin's central rain. One-line flip: apply
    apply:
      value: true
      source: "Owner's decision, 2026-11-14 afternoon: 'Rain: tuned. Keep the other versions as the range, and rain stays an ESTIMATE in the compliance table.' The gauge-calibrated rain won the selection fixed in advance (verification.rain_selection, eb3a57d; VALIDATION 3.9e: 40 of 83 against 38 of 83 for the corrected rain); on the locked 2026 months every version scored 3 of 15"
    factors:
      value: {jjas: 1.053, other: 0.746}
      source: "verification.rain_selection's winner, the gauge-calibrated version (VALIDATION 3.9e; data/checks/demo/rain_selection/selection.json factors.gauge_calibrated_all_four_gauges, 1.0530 and 0.7458 rounded): the ratio of sums gauge / corrected over the selection months (June 2023-December 2025) of all four gauges (Bhaktapur, Changu Narayan, Nagarkot, Kathmandu Airport), June-September and the other months. Leave one gauge out: 40 of 83 gauge-months within 19% against 38 for the corrected rain; locked 2026 test: 3 of 15 (20%, 7-45%), the same as the corrected rain"
    fields:
      value: [demo]
      source: "Claude's choice, fixed before any run: the factors were fitted at the demo field's GPM cell against the gauges around it, so they apply to the demo only; any other field (samples included) is put to the owner"
    rule:
      value: "when apply is true, for a field in `fields`, the twin's central rain (weather.parquet rain_mm, built by pipeline/fetch/weather.correct_gpm_break after the break correction, and so every run, the 2001-2025 record and the now-cast's weather_now.parquet alike) is the break-corrected rain times factors.jjas on every day of June-September and factors.other on every other day. rain_uncorrected_mm (GPM as published) is unchanged, and so is the DHM-scaled version (with_rain 'dhm': its monthly factors to DHM's normals absorb these). The weather cards record it (corrections.rain_break.gauge_calibration) and the method page's rain words say it in one plain line"
      source: "Owner, 2026-11-14 (via the coordinator): 'When on, the twin's central rain ... is the corrected rain times those factors, for 2001-2025 and for the 2026 now-cast inputs; the as-published and DHM-scaled versions stay as they are; record the version in the weather card and in the export's method page'"
    untuned:
      value: "the range's fourth rain version, 'untuned': the break-corrected rain before these factors, i.e. the central rain_mm divided by the month's factor (factors.jjas in June-September, factors.other otherwise; pipeline/twin/inputs.with_rain 'untuned', scripts/common.rain_kw); for a field whose rain is not calibrated it is the central rain itself. Run like the other versions (replay, plans, the 2040 runs) into data/checks/<field>/rain_untuned/; the range is the lowest and highest of tuned, untuned and DHM-scaled (the exporter's fields untuned_rain, score_untuned_rain, future_untuned_rain)"
      source: "Owner's decision, 2026-11-14 afternoon: 'Rain: tuned. Keep the other versions as the range' (apply above); the coordinator's brief of the same day: 'the break-corrected rain without the gauge factors (rain_mm divided by the month's gauge factor)'. Fixed before its first run"

monsoon_onset:                    # diary, build step 6a (pipeline/diary/onset.py); rain = the twin's GPM rain
  # Owner, 2026-11-12: the rule is kept as set in CLAUDE.md, with no tuning to the results, although it fails
  # its sanity check (median 16 May vs DHM's normal onset of 13 June, VALIDATION 4.1d); the 15- and 20-day runs are robustness
  # checks. The dates it finds are the first lasting rain spell, not the monsoon's arrival.
  search_from:
    value: "05-15"
    source: "CLAUDE.md 'Field diary' (owner): search from 15 May"
  search_until:
    value: "09-30"
    source: "Owner-approved 2026-11-13 (batch: every threshold with a published source). Claude's choice: stop the search at 30 September, so a year with no qualifying start has no onset (reported as none, never guessed). DHM Climate Division, 'Monsoon Onset and Withdrawal date information' (1968-2024), p. 1, dhm.gov.np: normal onset (eastern Nepal) 13 June, latest on record 27 June 1982; normal withdrawal 2 October"
  wet_day_mm:
    value: 1.0
    source: "Owner-approved 2026-11-13 (batch: every threshold with a published source). Claude's reading of CLAUDE.md: a wet day has at least 1 mm, the complement of the rule's own dry day 'under 1 mm per day'; ETCCDI list of 27 indices (etccdi.pacificclimate.org): 'wet days, w (RR >= 1mm)'"
  wet_days_min:
    value: 2
    source: "CLAUDE.md (owner): 'the first run of at least 2 wet days'. Owner-approved 2026-11-13 (batch: every threshold with a published source). Claude's reading: the onset day d is itself wet, and the wet days need not be consecutive, as in Moron, Robertson & Boer 2009 (J. Climate, sec. 2c): 'the first wet day of the first 5-day sequence receiving at least 40 mm'"
  window_days:
    value: 5
    source: "CLAUDE.md (owner): 'totalling 10 mm within 5 days'; the window is the 5 days starting on the onset day"
  total_mm:
    value: 10.0
    source: "CLAUDE.md (owner): 'totalling 10 mm within 5 days'"
  dry_spell_days:
    value: 10
    source: "CLAUDE.md (owner): 'not followed by a 10-day dry spell (under 1 mm per day)'"
  lookahead_days:
    value: 20
    source: "CLAUDE.md (owner): 'in the next 20 days'. Owner-approved 2026-11-13 (batch: every threshold with a published source). Counted from the onset date, d itself included, as Moron, Robertson & Boer 2009 (J. Climate, sec. 2c) count theirs: 'within the following 30 days from the onset date' (Claude first read it as the 20 days after d; the onset day is wet, so the readings differ only in the window's last day). A start whose look-ahead runs past the record is not confirmed"
  robustness_dry_spell_days:
    value: [15, 20]
    source: "CLAUDE.md (owner): 're-run with 15- and 20-day dry spells to show robustness'"
  climatology_check:
    value: "13 June (eastern Nepal; Kathmandu about 2 days later)"
    source: "Owner-approved 2026-11-13 (sourced batch): DHM's normal onset replaces CLAUDE.md's earlier 'about 10 June'. DHM Climate Division, 'Monsoon Onset and Withdrawal date information' (1968-2024), p. 1, dhm.gov.np: the normal onset in eastern Nepal is 13 June (Kathmandu about two days later, a DHM meteorologist in the Kathmandu Post, 20 Jun 2024; '10 June' is an older figure, Kathmandu Post 14 Jun 2020; both news items opened by a research sub-agent)"

onset_accumulation:               # a second, threshold-free onset measure beside monsoon_onset (pipeline/diary/onset_accumulation.py, scripts/run_onset_check.py)
  # Written and committed 2026-11-14 BEFORE its first run on real data. monsoon_onset above stays exactly as it is and
  # stays reported as failing its sanity check. The variants, the one that feeds shift_days and the trust test are all
  # fixed here; none is chosen by its trend.
  definition:
    value: "C(i) = sum over n = 1..i of (D(n) - Dbar), with D(n) the rain of day n of the calendar year (n = 1 is 1 January). Onset = the day after C reaches its absolute minimum, the minimum being searched from 1 January to 30 September. A tie goes to the first day that reaches the minimum. No smoothing. A year whose C is flat over the search (rain equal to Dbar every day, or no rain with Dbar 0) has no onset (none, never guessed)"
    source: "Noska, R., Misra, V. (2016), 'Characterizing the onset and demise of the Indian summer monsoon', GRL 43, 4547-4554, doi:10.1002/2016GL068409, p. 4548, eqs. 1-2: C'_m(i) = sum_{n=1}^{i} [D_m(n) - C=], 'D_m(n) is the daily AIR for day n of year m'; 'The onset of the ISM is defined as the day after C'_2000(i) reaches its absolute minimum, before the last three months of the year' (read 2026-11-13 from the authors' copy, coaps.fsu.edu/~vmisra/ism.pdf). No smoothing and no other window are stated. Their index 'builds upon Liebmann et al. [2007]' (the anomalous accumulation of Liebmann & Marengo 2001, J. Climate 14:4308; Liebmann et al. 2007, J. Climate 20:2037; 2012, J. Climate 25:4304); those three texts could not be opened (journals.ametsoc.org refused automated reads), so the definition used is the one Noska & Misra print. The tie rule (the first day, from 'reaches') and the flat-year rule are Claude's readings, fixed before the first run; put to the owner"
  variants:
    value: {climatological: "Dbar = the mean daily rain over every day of every year of the record (2001-2025), per rain version: the paper exactly", own_year: "Dbar = the mean daily rain of that calendar year"}
    source: "climatological: Noska & Misra 2016 eq. 2, 'the climatology of the annual mean of AIR over N (=365/366) days for M years'. own_year: Claude's variant, declared before any run for a physical reason, not from the papers: multiplying a year's rain by a constant k multiplies its C by k and leaves the day of the minimum unchanged, so the onset cannot move with a change in the level of rain, such as the 2017 GPM gauge-loss break (gpm_series) or a wet or dry year; with a fixed Dbar a wetter year crosses Dbar sooner and its onset comes earlier. Put to the owner"
  feeds_shift_days:
    value: "own_year variant on the twin's rain (rain_mm, corrected); the climatological variant and the uncorrected rain (rain_uncorrected_mm) are run and reported beside it"
    source: "Claude's choice, declared before any run and never revisited by looking at trends: shift_days is a change of timing, and only the own_year variant separates timing from the amount of rain, where the GPM break bites (the correction removes the break only as a month-by-month average, and only for fields that have the fix). The corrected rain because every other exported rain result uses it. Put to the owner"
  rain:
    value: "the twin's GPM IMERG rain from data/clean/<field>/weather.parquet: rain_mm (scaled from 2017, gpm_series.correction) and rain_uncorrected_mm (as published), UTC days, 2001-2025; every day of every year present, none missing (a gap fails loudly; the rain is never filled here)"
    source: "Coordinator's brief (2026-11-13, night): both rain versions, 2001-2025, UTC days as in pipeline/diary/onset.py; CLAUDE.md D6 (GPM supplies the twin's rain)"
  edge_days:
    value: 2
    source: "Claude's choice, the same 2 days as trends.shift_days_unmeasurable_when (owner-approved 2026-11-13): a year is at a window edge when its minimum falls within 2 days of either end of the search (1-3 January or 28-30 September). Fixed before the first run; put to the owner"
  sanity_window:
    value: ["06-02", "06-29"]
    source: "DHM Climate Division, 'Monsoon Onset and Withdrawal date information' (1968-2024; dhm.gov.np/uploads/dhm/climateService/monsoon_onset_and_withdrawal_dates_english3.pdf, read 2026-11-14), p. 1: 'The earliest and the late onset was observed on 31st May 1996 and 27th June 1982 respectively' (eastern Nepal; normal 13 June), shifted 2 days later for Kathmandu (monsoon_onset.climatology_check): 2 June to 29 June. Claude's choice of tolerance, fixed before the first run; put to the owner: a median outside every onset DHM recorded in 57 years cannot be the monsoon's arrival. Lenient on purpose (one 0.1 deg cell is not DHM's regional entry date); inside is necessary, not sufficient. For scale: DHM's 57 dates have median 13 June and standard deviation 6.0 days (Table 1, p. 3)"
  trust_test:
    value: "shift_days is exported only if every part holds for the variant that feeds it: (1) sanity: its median onset on the corrected rain is inside sanity_window; (2) not pinned: in no year, on either rain version, is its minimum at a window edge (edge_days); (3) robust to the rain version: its Sen slopes on the corrected and the uncorrected rain do not have opposite signs (product >= 0) and their 95% ranges overlap; (4) short record: the slope always comes with its 95% range (scipy theilslopes at 1 - trends.alpha) and the Mann-Kendall p; when p >= trends.alpha the words say 'no clear shift', and the range is exported even when it includes 0. Otherwise shift_days stays null ('can't tell'). The climatological variant gets the same four checks, reported only"
    source: "Coordinator's brief (2026-11-13, night): sanity against DHM, not pinned, robust to the rain version, honest about the 25-year record; trend as pipeline/diary/trends.py (Mann-Kendall, pymannkendall; Sen 1968 via scipy). The exact form of each part is Claude's choice, fixed and committed before the first run; put to the owner"
  shift_days_span:
    value: "last year - first year"
    source: "As trends.shift_days_span (schema.json diary.shift_days: 'Sen's slope x record length'; owner-approved 2026-11-13): slope and range times (2025 - 2001)"
  dhm_onset_dates:
    value: {2001: "06-03", 2002: "06-15", 2003: "06-16", 2004: "06-09", 2005: "06-20", 2006: "06-01", 2007: "06-07", 2008: "06-10", 2009: "06-23", 2010: "06-17", 2011: "06-15", 2012: "06-16", 2013: "06-14", 2014: "06-20", 2015: "06-13", 2016: "06-15", 2017: "06-12", 2018: "06-08", 2019: "06-20", 2020: "06-12", 2021: "06-11", 2022: "06-05", 2023: "06-14", 2024: "06-10"}
    source: "DHM Climate Division, 'Monsoon Onset and Withdrawal date information', Table 1, p. 3 (monsoon entering eastern Nepal; copied 2026-11-14). For information only, not part of the verdict (a regional entry date, not this cell): the year-by-year agreement (Spearman rank correlation, median difference in days) of each variant with DHM over 2001-2024, and DHM's own 2001-2024 trend by the same test"

monsoon_onset_dhm:                # owner, 2026-11-14: DHM's official onset dates are the record of a monsoon shift (pipeline/diary/onset_dhm.py, scripts/run_onset_dhm.py)
  # Committed 2026-11-14 BEFORE its first run. Fixes the answer, not the method: no further onset definition is tried.
  # monsoon_onset and onset_accumulation stay as they are, with their failed checks recorded (VALIDATION 4.1d, 4.1e, 3.22).
  record:
    value: {file: "config/dhm_onset_dates.csv", years: [2001, 2024]}
    source: "Owner, 2026-11-14 (answer to the onset result): 'DHM's official onset dates for 2001-2024 become the record of whether the monsoon has shifted', credited to DHM. DHM Climate Division, 'Monsoon Onset and Withdrawal date information' (1968-2024), Table 1, p. 3, copied into config/dhm_onset_dates.csv with config/dhm_onset_dates.NOTICE.md (the owner's pattern of answer 13, 2026-11-13). 2001-2024 are the years the twin's weather and DHM's table share"
  shift_days:
    value: "Sen's slope of the onset's calendar day (non-leap year: 15 June = 166 in every year) on the year, times (last - first), with its 95% range (scipy theilslopes at 1 - trends.alpha) and the Mann-Kendall p (pymannkendall.original_test), as pipeline/diary/trends.py mk_sen and over_record. 'No clear shift' when the range includes 0 or p >= trends.alpha; otherwise earlier (slope < 0) or later"
    source: "Owner, 2026-11-14: 'Sen's slope x (years - 1), with its range, Mann-Kendall as in pipeline/diary/trends.py'. The 'no clear shift' wording rule is Claude's reading, fixed before the run; put to the owner"
  caveat:
    value: "DHM's date is the day the monsoon enters Nepal in the east. It reaches Kathmandu a few days later."
    source: "Owner, 2026-11-14 ('DHM's date is the monsoon's entry into Nepal (eastern Nepal); it reaches Kathmandu a few days later'). DHM, p. 1: 'monsoon entered into eastern Nepal'; about two days later in Kathmandu: monsoon_onset.climatology_check"
  start_window:
    value: {percentiles: [25, 75], method: "numpy.percentile (linear, Hyndman & Fan type 7) of the calendar days of the record's years, each end rounded to the nearest day"}
    source: "Owner, 2026-11-14: 'the usual start window: the middle half of the years, i.e. the 25th-75th percentile dates'. The percentile method and the rounding are Claude's choice, fixed before the run; put to the owner"
  late_after:
    value: "06-20"
    source: "Owner's threshold, 2026-11-14 ('after 20 June', the owner's example). Claude's reading, fixed before the run; put to the owner: late = DHM's onset strictly after 20 June; years with the onset on 20 June itself are listed beside, not counted. Share = late years / years in the record"
  cross_check:
    value: "Noska & Misra 2016's onset, the record-mean variant exactly as onset_accumulation.definition and variants.climatological, on rain without the 2017 break: (a) CHIRPS v3.0 daily rnl at the field's cell (data/clean/<field>/chirps.parquet rain_mm, UTC days), 2001-2025, Dbar = its own 2001-2025 mean; (b) the twin's GPM rain for 2001-2016 only (before the correction starts; identical to GPM as published), Dbar = its own 2001-2016 mean. A record agrees with DHM ('no clear shift') when BOTH its Sen's slope 95% range includes 0 AND that range overlaps DHM's 2001-2024 slope range (days per year). Reported beside it, not part of the test: median date, years at a window edge (onset_accumulation.edge_days), Spearman correlation with DHM over shared years"
    source: "Owner, 2026-11-14 (item 3): 'Report whether each agrees with DHM: no clear shift ... Declare the agreement test before running (e.g. a trend range that includes 0, or overlapping trend ranges)'. Using both conditions is Claude's choice, fixed before the run; put to the owner. CHIRPS is daily at the cell (data/cards/<field>/chirps.json), so nothing is downloaded"
  words_rule:
    value: "The diary's shift words say only 'No clear change since <first year>, in Nepal's weather office records.' (or, if DHM's record shows a clear shift, its size and direction with the years measured). No sentence on whether the cross-checks agree: their result stays on the How we know page with its numbers"
    source: "Owner's decision, 2026-11-14 afternoon: 'Monsoon sentences: yes, change both to \"No clear change since 2001, in Nepal's weather office records\".' Replaces 'Three independent records agree' (owner, 2026-11-14 morning) and 'The rains start when they used to', which the skeptical-judge review called overclaims (docs/TOUGH_QUESTIONS.md 9: the range allows 11 days earlier or 8 later, and CHIRPS and IMERG may share DHM's gauges)"
  bs_dates:
    value: {month_starts_on_day: 15, mark: "तिर"}
    source: "Claude's choice, fixed before the run; put to the owner. Nepali dates show Bikram Sambat first with the Gregorian date beside (owner, 2026-11-12; pipeline/words/screens.json months: each BS month begins about the middle of the Gregorian month, with TODO-VERIFY on the start days). A Gregorian date is turned into an approximate BS date by taking each BS month to start on the 15th (Jestha 1 about 15 May, Asar 1 about 15 June), marked 'तिर' (about). BS months start on a slightly different day each year, so the BS day can be off by one or two; a native speaker reviews every Nepali line"

greenness:                        # diary, build step 6a (pipeline/diary/greenness.py)
  min_clear_fraction:
    value: 0.75
    source: "Claude's choice, owner-approved 2026-11-13 (CLAUDE.md: 'require a minimum clear-pixel fraction per image'): an HLS image counts for the field only when at least 75% of the field's pixels are clear (Fmask bits 0-5 zero) and hold NDVI; for the 60 m demo field (4 HLS pixels) that is 3 of 4. No published source found: the HLS v2.0 User Guide (Apr 2026, sec. 6.4) gives the Fmask bits but no clear fraction; the one parcel rule found masks parcels with more than 50% of pixels masked (Sitokonstantinou 2022, arXiv 2211.12584, App. A.1), so 75% is stricter"
  modis_reliability_ok:
    value: [0]
    source: "Owner-approved 2026-11-13 (batch: every threshold with a published source). Claude's choice: MOD13Q1 pixel reliability 0 ('good data') only; 1 (marginal), 2 (snow/ice) and 3 (cloudy) are dropped. Rank keys from the file's own Legend attribute; MOD13 User's Guide C6.1 (V3.10), Table 4: 0 'Good Data, Use with confidence', 1 'Marginal data, Useful, but look at other QA information'"
  hls_from:
    value: "2013-04-11"
    source: "CLAUDE.md 'Field diary': HLS from 2013, MODIS from 2000. The daily series uses HLS from its first clear field observation (HLSL30 starts with Landsat 8 in April 2013) and MODIS before it"
  pair_max_days:
    value: 8
    source: "Claude's choice, owner-approved 2026-11-13: an HLS observation and a MODIS composite are compared when their dates are at most 8 days apart (half of MODIS's 16-day composite; no source for the limit). The MODIS date is the pixel's own 'composite day of the year' (MOD13 User's Guide sec. 5.1: 'adjacent selected pixels may originate from different days')"

bare_days:                        # diary, build step 6a
  ndvi_max:
    value: 0.25
    source: "CLAUDE.md 'Field diary' (owner): a day is bare when interpolated NDVI is below the threshold, 'start at 0.25, tune with known bare dates' (not yet tuned)"
  uncertain_gap_days:
    value: 20
    source: "Owner-approved 2026-11-13 (batch: every threshold with a published source). CLAUDE.md: 'widen uncertainty in cloudy months, days since last clear image': a day is uncertain when the clear observations either side of it are more than 20 days apart, the line NASA's HLS phenology product draws (MSLSP30NA User Guide V1.1, sec. 3.3: 'we only fill the gaps that are greater than 20 days'; an indirect source: the product fills longer gaps). Was 30, Claude's unsourced first choice"

season_detection:                 # diary, build step 6b (pipeline/diary/seasons.py, pipeline/ml/seasons.py)
  # The method settings were set while looking at the full HLS series; the comparison design (held_out_*,
  # reference, best_margin) was fixed and written here BEFORE the held-out comparison was first run (2026-11-12,
  # night). Sources opened 2026-11-12 by a research sub-agent (quotes checked); Claude's choices wait for the owner's batch.
  smooth_window_days:
    value: 31
    source: "Claude's choice, owner-approved 2026-11-13: Savitzky-Golay window on the daily interpolated series (no source for 31 days: Chen et al. 2004 smoothed 10-day composites, not opened past the abstract; TIMESAT 3.3 manual, row 34, gives a rough half-window of a quarter of the points per year, far wider, and warns a large window 'affects the possibility to follow a rapid change')"
  smooth_polyorder:
    value: 2
    source: "Owner-approved 2026-11-13 (batch: every threshold with a published source). TIMESAT 3.3 Software Manual sec. 3.6: 'we fit a quadratic polynomial'"
  min_amplitude:
    value: 0.1
    source: "Owner-approved 2026-11-13 (batch: every threshold with a published source). NASA MCD12Q2 C6.1 User Guide sec. 2.2: a cycle counts when its amplitude 'is greater than or equal to 0.1, and greater than or equal to 35% of the time series maximum NBAR-EVI2 minus the minimum' (EVI2 there, NDVI here). Replaces Claude's unsourced 0.2, which gave exactly the same seasons on this field"
  min_amplitude_range_fraction:
    value: 0.35
    source: "Owner-approved 2026-11-13 (batch: every threshold with a published source). NASA MCD12Q2 C6.1 User Guide sec. 2.2 (above): at least 35% of the maximum minus the minimum"
  min_amplitude_range_years:
    value: 3
    source: "Owner-approved 2026-11-13 (batch: every threshold with a published source). NASA MCD12Q2 C6.1 User Guide sec. 2.2: the variation 'exhibited over the three-year interval' (the peak's calendar year and the years either side)"
  threshold_fraction:
    value: 0.2
    source: "Owner-approved 2026-11-13 (batch: every threshold with a published source). Claude's choice within the published range: season start and end at 20% of the rise and of the fall (TIMESAT 3.3 manual sec. 4.4: start at 'a user defined level (often a certain fraction of the seasonal amplitude) measured from the left minimum level', end from the right minimum; its examples use 0.5 and 0.3; NASA MCD12Q2 uses 15%, 50% and 90% of the green-up amplitude)"
  changepoint_params_per_change:
    value: 2
    source: "Owner-approved 2026-11-13 (batch: every threshold with a published source). PELT (Killick, Fearnhead & Eckley 2012) penalty; the 2 parameters per kink is Claude's reading, owner-approved 2026-11-13: sigma^2 x 2 x ln(n), a BIC-type penalty with 2 parameters per kink (its place and the change of slope); sigma = scatter of the clear observations about the smoothed curve (Killick, Fearnhead & Eckley 2012, arXiv:1101.1438 sec. 2: 'SIC, also known as BIC ... (beta = p log n), where p is the number of additional parameters introduced by adding a changepoint', for a cost of twice the negative log-likelihood, i.e. sigma^2 p ln n for a sum of squares; p = 2 is Claude's reading)"
  changepoint_min_size_days:
    value: 5
    source: "Claude's choice, owner-approved 2026-11-13: no segment shorter than 5 days"
  detective:
    value: {trees: 300, min_samples_leaf: 5, seed: 0, slope_days: 15, low_window_days: 120, weather_days: 30,
            mode_filter_days: 15, min_season_days: 30}
    source: "Claude's choices, owner-approved 2026-11-13: random forest (scikit-learn) with 300 trees, leaves of at least 5 days, fixed seed; slopes over 15 days; 'time since green-up' = days since the lowest smoothed NDVI of the last 120 days; rain and temperature over the last 30 days; labels smoothed by a 15-day majority; growing runs shorter than 30 days are not seasons"
  held_out_min_clear_obs:
    value: 90
    source: "Claude's choice, owner-approved 2026-11-13, fixed before the comparison: held-out years are full HLS years with at least 90 clear field observations (2018 and 2022-2025 on the demo field; written as '2017-2025' before the run, a miscount corrected afterwards, the rule unchanged), dense enough that their full-data labels are well constrained"
  held_out_thin_days:
    value: 16
    source: "Claude's choice, owner-approved 2026-11-13, fixed before the comparison: in the held-out year keep only the first clear observation in each 16 days (Landsat 8's revisit and MODIS's composite period: the density of 2013-2016 and of cloudy months)"
  reference:
    value: "days where the threshold and change-point methods, on all observations, give the same label"
    source: "Claude's choice, owner-approved 2026-11-13, fixed before the comparison: there is no field-observed calendar (placeholder field), so the reference is the two rule-based methods' agreement on dense data; each method is scored on how well it reproduces that reference from the thinned year. The two rule-based methods made the reference, so the score measures robustness to sparse data, not accuracy"
  best_margin:
    value: 0.02
    source: "Claude's choice, owner-approved 2026-11-13, fixed before the comparison: the method with the best mean held-out score is used, but it replaces the simplest (threshold) method only if it beats it by at least 2 percentage points"
  bare_max_from: 
    value: "bare_days.ndvi_max"
    source: "Between seasons a day is bare below the bare-day threshold (CLAUDE.md 0.25), harvested (stubble, residue or weeds) at or above it"
  no_dense_years:                 # owner's item 3 (2026-11-14): a cloudy field abroad. Written and committed BEFORE its first run
    value: "when no full HLS year has held_out_min_clear_obs clear observations, the held-out comparison cannot run: the threshold method sets the seasons (the comparison's own default, which another method replaces only by beating it by best_margin), the season detective is not trained (so no 'less sure' months), and the method page's comparison is null ('could not run: too few clear images a year'). The minimum is not lowered"
    source: "Claude's choice, fixed before its first run on such a field; put to the owner. The field in Madagascar has 30-49 clear HLS observations a year (data/clean/ambohidratrimo/greenness_field.parquet, counted on a shorter-record test copy, 2026-11-14), under the 90 that held_out_min_clear_obs (owner-approved 2026-11-13) asks; lowering the minimum after seeing those counts would be choosing the rule from the data. Nepal's five fields have qualifying years: unchanged"

  cover_sure:
    value: "per calendar month, the share of the days in the HLS years on which the season detective (SI) and the threshold method give the same day label (growing, harvested, bare)"
    source: "Owner, 2026-11-13 (priorities after REVIEW_2): add the season detective as an uncertainty signal, 'less sure' where it and the threshold method disagree; an addition, not a method change (the threshold method still sets every exported season and cover word). Exported as diary.months[].cover_sure, 0 to 1 like a section's sure. The detective is the final model of the step-6b comparison, trained on the days where the two rule methods agree in the densely observed years, so on those days it has seen the answer and agreement there is high by construction: the number says where SI and the rule part ways, not how right either is. Claude's definition, written and committed before its first run; put to the owner"

field_memory:                     # build step 7b (pipeline/ml/memory.py, scripts/run_memory.py); owner's priorities, 2026-11-13
  # Written and committed BEFORE the first run (owner's answer 21). NDVI is a stand-in for harvest: say so with the result.
  target:
    value: "each detected season's peak NDVI in the HLS years (the chosen season method), as its difference from the mean peak of its slot (monsoon, winter)"
    source: "CLAUDE.md 'Field memory': predict each season's observed peak-NDVI anomaly. Claude's reading (anomaly = difference from the slot's own mean over the HLS years), fixed before the first run; put to the owner"
  window:
    value: "the days from the season's detected start to its peak"
    source: "Claude's choice, fixed before the first run: what the crop went through before the satellite saw its peak; put to the owner"
  physics_only:
    value: "the twin's water shortfall over the window, 1 - sum(ETa) / sum(ETc), for the field's current rotation, rain-fed, as the only predictor (a straight line fitted on the training years)"
    source: "CLAUDE.md 'Field memory': the physics-only baseline is the twin's simulated stress. Claude's reading, fixed before the first run; put to the owner"
  memory_features:
    value: ["twin_shortfall", "rain_mm", "longest_dry_spell_days", "tmax_mean_c", "onset_doy", "slot_is_winter"]
    source: "CLAUDE.md 'Field memory': 'from the twin's simulated stress, onset date and dry spells'; rain and mean Tmax over the window and the season's slot are Claude's additions, fixed before the first run; put to the owner. onset_doy is the first lasting rain spell of the season's monsoon (a winter season takes the monsoon before it)"
  model:
    value: {kind: ridge, alpha: 1.0, standardise: true}
    source: "CLAUDE.md 'Field memory': 'ridge regression or a small random forest'. Ridge with alpha 1.0 on standardised predictors is Claude's choice for about two dozen seasons, fixed before the first run; put to the owner"
  validation:
    value: "leave one year out: both seasons of the held-out year are predicted by a model fitted on the other years; the score is the root-mean-square error of the predicted peak anomaly"
    source: "CLAUDE.md 'Field memory': leave-one-year-out validation"
  keep_rule:
    value: "the memory is kept only if its held-out error is lower than physics alone AND lower than predicting no anomaly at all; otherwise physics only. The result is reported either way"
    source: "CLAUDE.md 'Field memory': 'Apply the correction to future runs only if it beats the physics-only baseline on held-out years; otherwise report the result honestly and keep physics only'. Also beating 'no anomaly' is Claude's addition, fixed before the first run; put to the owner"

trends:                           # diary, build step 6c (pipeline/diary/trends.py). Fixed before it was run.
  alpha:
    value: 0.05
    source: "Mann-Kendall test (pymannkendall.original_test) and Sen's slope range (scipy.stats.theilslopes, Sen 1968) at the conventional 5% level"
  dry_day_mm:
    value: 1.0
    source: "CLAUDE.md 'longest dry spell (consecutive days under 1 mm)'; ETCCDI CDD: 'maximum number of consecutive days with RR < 1mm' (etccdi.pacificclimate.org list of 27 indices)"
  heavy_rain_mm:
    value: 20.0
    source: "CLAUDE.md 'heavy-rain days (20 mm or more)'; ETCCDI R20mm: 'annual count of days when PRCP >= 20mm'"
  hot_day:
    value: {pct: 90, window_days: 5, base_years: [2001, 2025]}
    source: "CLAUDE.md 'hot days (above the local 90th percentile of Tmax)'; ETCCDI TX90p: 'the calendar day 90th percentile centred on a 5-day window'. The base period is the record itself (2001-2025; ETCCDI uses 1961-1990, which the twin's weather does not cover), and the in-base bootstrap is not applied: Claude's choices, owner-approved 2026-11-13"
  hot_day_caveat:
    value: "NASA POWER's daytime temperatures for 2001-2003 are too high here (the same years whose POWER rain is about half of later years), so a fall in hot days over 2001-2025 comes from those three years. The trend is also given without them (without_faulty_years): trust that one."
    source: "REVIEW_2 H8 (AI review, 2026-11-13): POWER minus station Tmax on shared days is about 1.7 C higher in 2001-2003 than in 2004-2012, in every month, while the Kathmandu Airport station's own Tmax shows no warm spell; hot days number 96, 139 and 113 in 2001-2003 and at most 66 in any later year. The years left out are power_rain.never_fill_years. A label, not a threshold"
  shift_days_unmeasurable_when:
    value: "the onset is within 2 days of the search start in more than half of the years"
    source: "Claude's rule, owner-approved 2026-11-13, set AFTER seeing that 21 of 25 onsets fall on 15-17 May (honest outputs, golden rule 11): an onset pinned at the search start cannot move earlier, so its trend cannot show a shift and shift_days is exported as null ('can't tell')"
  shift_days_span:
    value: "last year - first year"
    source: "schema.json diary.shift_days: 'Sen's slope x record length'; Claude's reading, owner-approved 2026-11-13 (answer 20 to REVIEW_2): the change from the first to the last year, slope x (last - first)"

months:                           # diary.months[], build step 6c (pipeline/diary/months.py). Fixed before it was run.
  terciles:
    value: "rain, soil, heat: the four lowest of the twelve 2001-2025 monthly means take the first word, the four highest the last"
    source: "CLAUDE.md 'classify each month as low, medium or high (terciles of the 2001 to 2025 climatology)'; Claude's reading, owner-approved 2026-11-13: terciles of the twelve monthly means. Rain = GPM (with the GPM-break caveat); soil = the twin's root-zone wetness 1 - Dr/TAW, current rotation, rain-fed; heat = mean Tmax (station-corrected POWER)"
  frost_c:
    value: 0.0
    source: "CLAUDE.md 'Frost' (owner): a frost night is Tmin below 0 C"
  frost_risk_c:
    value: 2.0
    source: "CLAUDE.md 'Frost' (owner): risk band 0 to 2 C"
  frost_month_rule:
    value: "a month's band comes from its coldest night (frost Tmin, tmin_frost_c); a calendar month takes the band of its median coldest night over 2001-2025"
    source: "Claude's choice, owner-approved 2026-11-13, no published source: the band a typical year reaches (the frost Tmin overcounts cold nights against the station, CLAUDE.md, so the band carries that caveat)"
  cover_rule:
    value: "the most common day label of the month in the HLS years (2014-2025) of the chosen season method"
    source: "Claude's choice, owner-approved 2026-11-13: growing -> crop, harvested -> partial, bare -> bare (contract words); HLS years only, like bare days (VALIDATION 3.10)"

rotation_guess:                   # diary.guess, build step 6c (pipeline/diary/guess.py). Fixed before it was run.
  rule:
    value: "per slot (monsoon: peak June-November; winter: peak December-May), the crop with the smallest median distance over the HLS years 2014-2025; distance = days outside the green-up window (sowing + initial stage), the harvest window and the length range (crop days minus initial stage), summed with equal weights at the crop's best window"
    source: "Claude's choice, owner-approved 2026-11-13: crop windows and stage lengths from config/crops.json (each with its source); green-up at the end of FAO-56's initial stage ('planting date to approximately 10% ground cover', FAO-56 ch. 6); only crops with stage lengths (the ones the twin can simulate) take part. The farmer confirms the guess on screen; NDVI cannot name a crop"

plans:                            # build step 7 (pipeline/plans/generate.py, score.py; scripts/run_plans.py)
  sow_positions:
    value: ["start", "middle", "end"]
    source: "Owner's batch decisions item 10 (2026-11-12): the generator may sow at the start, middle or end of each window (crops.sow_date)"
  max_seasons:
    value: 3
    source: "Claude's choice, owner-approved 2026-11-13: up to three seasons a year (none of the library's crops leaves room for a fourth)"
  water_strict_when_falling:
    value: 1.0
    source: "Owner's decision, 2026-11-14 afternoon: 'Groundwater: background only. Show the regional trend as context, and take it out of the water scores.' 1.0 = irrigation counts once whatever the trend. Before: 1.5 while the regional trend was falling (Claude's choice, owner-approved 2026-11-13, no published source; it lowered the water scores by 14-21 points, VALIDATION 4.4; docs/TOUGH_QUESTIONS.md 10)"
  suggested_must_include:
    value: rice
    source: "Owner, 2026-11-13 (decision 4): keep rice in the monsoon in every suggested plan. Every rice window in config/crops.json is a monsoon window (sowing 15 May to 15 Aug), so a plan with rice has it in the monsoon. The Pareto set is taken among the rice plans (and the current plan)"
  cover_gap_rule:
    value: "among the rice plans: the highest cover among plans that keep at least the current harvest (ties: higher harvest); if none, the highest cover"
    source: "Claude's choice, owner-approved 2026-11-13 (CLAUDE.md 'the best cover the gap plan'; decision 6), fixed before the first run; chosen among rice plans (owner, decision 4). If it is rice then wheat, the plan is flagged: FAO's wheat window here is for irrigated wheat (decision 4)"
  third_plan_rule:
    value: "'Safest in bad years': among the rice plans of the Pareto set that grow other crops than the current and the cover-the-gap plan and keep at least today's cover, the best 10th-percentile year (ties: higher mean harvest). If no Pareto plan qualifies, every rice plan is looked at. The cover-the-gap plan, too, grows other crops than the current plan"
    source: "Owner, 2026-11-13 (decision 5): option A, best in bad years among plans that keep at least today's cover, named 'Safest in bad years' (not 'follow the shift', since shift_days cannot be measured; revisit only if step 9's 2040 projections finish). The fallback to every rice plan is Claude's, fixed before the run. 'Other crops' was added by Claude AFTER the first run, which picked rice then wheat again with rice sown on 1 June instead of 15 June: the same rotation, while CLAUDE.md and the challenge ask for at least three rotations. Owner-approved 2026-11-13 (answer 3 to REVIEW_2: the plan stays as chosen and is renamed 'Feed your soil')"
  third_plan_fallback:
    value: "If no rice plan growing other crops than the current and the cover-the-gap plan keeps today's cover (not even after looking at every rice plan), the third plan is the best 10th-percentile year (ties: higher mean harvest) among those plans whatever their cover; plans.json records it as safest_from 'all rice plans, any cover', and its cover score is shown as computed. With no such plan at all (two rotations only), the plans step stops: NOT READY"
    source: "Claude's choice, fixed 2026-11-14 before its first run (owner's item 3, a field on another continent): the FAO Crop Calendar for Madagascar's zone 004 lists four of the library's crops (rice, wheat, potato, maize), which make three rice rotations (rice then potato, rice then wheat, rice alone), so no third rotation keeps today's cover. CLAUDE.md and the challenge ask for at least three rotations including the current one (schema.json: plans minItems 3), and three different rotations come first. Never used for Nepal's five fields: each has a third rotation keeping today's cover (VALIDATION 3.25). Not owner-approved yet"
  plan_names:
    value: {current: "What you do now", cover_gap: "Fill the empty months", safest: "Feed your soil"}
    source: "Owner, 2026-11-13 (answer 3 to REVIEW_2 H2): the third plan is renamed 'Feed your soil' (its id stays `safest`), because rice then wheat does better in bad years (10th-percentile year 83.8 against 75.6) and what the plan gives is a pulse crop that feeds the soil and breaks the pest cycle. Before: owner, 2026-11-13 (decision 5): 'Safest in bad years'. 'What you do now' and 'Fill the empty months' are the names the site was built with (pipeline/export/mock.py, build step 1). Plan ids current, cover_gap (owner approved 2026-11-12, choice 4) and safest (replaces follow_shift, owner's decision 5)"
  third_plan_name_no_legume:
    value: "Safest in bad years"
    source: "Owner, 2026-11-13 (decision 5) named the third plan 'Safest in bad years'; the owner renamed it 'Feed your soil' because Nepal's third plan grows a pulse crop that feeds the soil (answer 3 to REVIEW_2 H2, plan_names). A third plan with no legume (on a field abroad whose FAO zone calendar lists none of the library's legumes, e.g. Madagascar's rice alone; plans.third_plan_fallback) keeps decision 5's name, since nothing in it feeds the soil. Claude's reading, fixed 2026-11-14 before its first run; put to the owner. Nepal's five fields: every third plan is rice then lentil, unchanged"
  gain_range:
    value: "the harvest gain of a suggested plan over the current plan is shown as a range: both plans are replayed with each of their crops at the smaller and at the larger root depth of its FAO-56 Table 22 range (config/crops.json zr_range_m), every combination, a crop having the same depth in both plans; the smallest and the largest gain are shown, rounded"
    source: "Owner, 2026-11-13 (answer 4 to REVIEW_2 H2): keep FAO's larger root depths for the scores; show the harvest gain as a range and explain it in the 'unknown' tab. Which runs make the range is Claude's reading, fixed and committed before its first run; put to the owner"
  current_options:
    value: "the current plan is exported once for each rotation in the field's current_rotation_options (config/fields/<id>.yaml), each with both water cases and both rain versions; the suggested plans stay as chosen and are compared with whichever the farmer picks. The first option is the default (the field's current_rotation, default windows, sown at the middle). In another option, a crop that the default does not grow is sown on the date (start, middle or end of a calendar window the twin can simulate, not overlapping the option's other crops) whose simulated season lies closest to the satellite's season of the same slot: the median over the HLS years of the days between green-up (sowing + initial stage against the detected start) plus the days between season ends; ties go to the later date"
    source: "Owner, 2026-11-13 (answer 6 to REVIEW_2 H3): the app asks the farmer to confirm the winter crop; precompute every answer (rice then potato, and rice then wheat with wheat on the FAO Hill-zone window that best fits the satellite's winter season). The distance is Claude's reading of 'best fits', fixed and committed before its first run; put to the owner"
  pareto_keys:
    value: ["harvest", "stability", "water", "cover", "soil_kept", "pest_break", "nitrogen"]
    source: "CLAUDE.md 'Plans' steps 3-4: harvest, stability (10th percentile year), water, cover, soil_kept, pest-cycle breaks, nitrogen"

tips:                             # plans[].tips (pipeline/plans/explain.py); owner's answer 5 to REVIEW_2 H3, 2026-11-13
  thirsty_min_dry_days_per_year:
    value: 5
    source: "Owner, 2026-11-13 (answer 5): a floor before any 'thirsty' tip. The number is Claude's choice, fixed and committed before its first run: the tip is shown only when, in the month the crop is most often short of water, that happens on at least 5 days a year on average over the rain-fed replay. Put to the owner"
  thirsty_skip_crops:
    value: [rice]
    source: "Owner, 2026-11-13 (answer 5): drop the rice tips for now (the model's rain-fed rice almost never runs short of water: METHOD_NOTES 36)"
  straw_months:
    value: "the satellite's bare months (diary.months[].cover == 'bare'): for the current plan the first of them; for a suggested plan the first of them in which that plan's own calendar also leaves the ground bare; no such month, no tip"
    source: "Owner, 2026-11-13 (answer 5): the straw tip from the satellite's bare months. The rule for a suggested plan is Claude's reading (a plan that grows a crop in a month does not need straw then), fixed and committed before its first run; put to the owner"

erosion:                          # plans' soil_kept (build step 7; pipeline/plans/score.py). Relative RUSLE: K, LS, P cancel on one field
  # Sourced values found 2026-11-13 by a research sub-agent; Claude checked the C rows and the model in the saved texts.
  # Added after the owner's 2026-11-13 approval of sourced thresholds, so listed for the owner.
  c_by_crop:
    value: {rice: 0.15, wheat: 0.20, maize: 0.38, potato: 0.34, lentil: 0.32, finger_millet: 0.20}
    source: "Panagos et al. 2015b crop C factors as reprinted in Benavidez et al. 2018, HESS 22:6059, Table 9 (rice 0.15, common wheat and spelt 0.2, grain maize 0.38, potatoes 0.34, dried pulses 0.32); finger millet = Borrelli et al. 2017, Nat Commun 8:2013, Supplementary Table 2, Cereal Grains 'Various 0.2'. Whole-year averages from European/global rain timing. Paddy: a ponded field erodes less (USDA-ARS RUSLE note; Yoshikawa et al. 2004), so rice's 0.15 likely overstates its loss"
  c_bare:
    value: 1.0
    source: "Wischmeier & Smith 1978, Agriculture Handbook 537, p. 4 (C is the ratio to 'tilled continuous fallow') and p. 8 ('L, S, C, and P each equal 1.0'); an upper bound for the gaps between crops (residue periods lose 23-47% of fallow loss, AH 537 Table 5)"
  threshold_mm:
    value: 12.7
    source: "Wischmeier & Smith 1978, AH 537 p. 5: showers of 'less than one-half inch' omitted (12.7 mm)"
  beta:
    value: 1.7265
    source: "Daily erosivity model R_day = 0.2686 [1 + 0.5412 cos(pi j / 6 - 7 pi / 6)] P_day^1.7265 (j = month), Xie et al., as tabulated in Yin et al. 2015, HESS 19:4113, Table 3 (fitted in China's monsoon climate); the constant 0.2686 cancels between plans. Sensitivity: 1.81, the average exponent of Richardson et al. 1983 (as reported by Sepaskhah & Panahi 2007, p. 241)"
  month_amplitude:
    value: 0.5412
    source: "Same model: the seasonal multiplier 1 + 0.5412 cos(pi j / 6 - 7 pi / 6), largest in July"

future:                           # build step 9 (pipeline/fetch/nexgddp.py, pipeline/future/, scripts/run_future.py)
  # Written and committed BEFORE the first NEX-GDDP-CMIP6 download (2026-11-14, 00:30 Nepal time).
  method:
    value: "delta change: per model and scenario, the monthly change at the field's NEX-GDDP-CMIP6 cell between the historical and the future period is applied to the observed 2001-2025 weather (data/clean/<field>/weather.parquet) and the twin is rerun. tasmax's change (future minus historical monthly mean, deg C) is added to tmax_c and tmax_c_power; tasmin's change to tmin_c, tmin_frost_c and tmin_c_power; pr's change (a ratio, rain_ratio_window_months) multiplies rain_mm and rain_uncorrected_mm. Humidity (rh_pct), wind (ws2m_ms) and sunshine (rs_mj_m2_day) stay as observed. ET0 is recomputed with pipeline/twin/et0.py exactly as pipeline/fetch/weather.py builds it, with the humidity rule below. A day whose shifted tmin_c or tmin_frost_c lies above its shifted tmax_c, or whose scaled rain leaves 0-500 mm, stops the run (golden rule 12c; never clipped)"
    source: "CLAUDE.md 'Future' (owner-approved method): 'compute monthly changes between 1995-2014 and 2026-2040 (temperature as a difference, rainfall as a ratio) and apply them to the observed 2001-2025 weather. Run the twin; report the spread across models as a range'. Only pr, tasmax and tasmin change (integrator's step-9 brief, 2026-11-13); the rest of the weather stays as observed, said on the method page"
  periods:
    value: {historical: [1995, 2014], future: [2026, 2040]}
    source: "CLAUDE.md 'Future': 'between 1995-2014 and 2026-2040'. 1995-2014 is the last 20 years of the CMIP6 historical experiment and the IPCC AR6 recent-past baseline"
  scenarios:
    value: [ssp245, ssp585]
    source: "CLAUDE.md 'Future': 'two scenarios (SSP2-4.5 and SSP5-8.5)'"
  variables:
    value: [pr, tasmax, tasmin]
    source: "Integrator's step-9 brief, 2026-11-13: pr, tasmax and tasmin only; humidity, wind and sunshine stay as observed"
  humidity:
    value: "relative humidity held: ea_kpa is rebuilt as weather.py builds it, POWER's RH2M / 100 x (e0(tmax_c_power + dTmax) + e0(tmin_c_power + dTmin)) / 2 (FAO-56 eq. 19 with POWER's own temperatures, shifted by the same monthly changes), capped at e0 of the shifted tmin_c; et0_mm uses it with the shifted corrected temperatures, and et0_rh_held_mm is rebuilt as in weather.py. So the vapour pressure rises with warming and the Kc climate adjustment's RHmin (FAO-56 eq. 63 from ea_kpa and tmax_c) stays about the same"
    source: "Claude's choice, 2026-11-14, fixed before the first download: climate models keep near-surface relative humidity roughly constant as they warm while the vapour pressure rises with temperature (Held & Soden 2006, J. Climate 19, 5686-5699, doi:10.1175/JCLI3990.1, p. 5687: 'climate models tend to maintain a fixed tropospheric relative humidity as they warm'; verified 2026-11-14); holding ea instead would add the whole warming to the vapour-pressure deficit. Over land, relative humidity falls in projections (Byrne & O'Gorman 2016, J. Climate 29, 9045-9061, doi:10.1175/JCLI-D-16-0351.1: it 'tends to increase slightly over oceans but decrease substantially over land'; verified 2026-11-14; corrected from 'a little' after the source was opened, the value unchanged), so holding it is on the low side for ET0's rise (said in the 'unknown' tab). NEX-GDDP's own hurs is not used (three variables)"
  rain_ratio_window_months:
    value: 3
    source: "Claude's choice, 2026-11-14, fixed before the first download: each month's rain ratio = the mean daily pr over the three calendar months centred on it (December, January and February for January), future over historical, because a dry month's own ratio rests on a few mm of model rain and is noisy. No cap on the ratio; the largest one is reported"
  models:
    value: "every model directory of the NEX-GDDP-CMIP6 THREDDS catalogue (ds.nccs.nasa.gov, AMES/NEX/GDDP-CMIP6) that offers pr, tasmax and tasmin for every year of both periods in historical, ssp245 and ssp585, with the one variant folder NEX-GDDP provides in each experiment (a model with two variant folders in an experiment is left out and reported). GFDL-CM4_gr2 is left out: it is GFDL-CM4 again, downscaled from that model's second output grid, so it would count one model twice. The outlook uses every model complete when run_future.py runs and lists them"
    source: "Integrator's step-9 brief, 2026-11-13 ('every NEX-GDDP-CMIP6 model that offers pr, tasmax and tasmin for historical, ssp245 and ssp585 (one variant per model, as NEX-GDDP provides it)'; 'the outlook uses every model complete at run time and lists them'). Leaving out GFDL-CM4_gr2 is Claude's choice, fixed before the first download"
  fetch_order_seed:
    value: 2026
    source: "Integrator's step-9 brief, 2026-11-13: models are fetched in a random order fixed by seed 2026 (numpy.random.default_rng(2026).permutation of the sorted model names), so that if time runs short the complete models are a random sample, not a choice"
  min_models:
    value: 5
    source: "Integrator's step-9 brief, 2026-11-13: at least 5 complete models; with fewer, no outlook is written (future stays in the export's mock list)"
  cell:
    value: "the NEX-GDDP-CMIP6 0.25 deg grid cell nearest the field centre (cell centres at odd multiples of 0.125 deg), requested at its centre; the server's returned grid point must be that centre. Raw files are cached by cell (data/raw/nexgddp/<cell>/), so fields in the same cell share them"
    source: "Integrator's step-9 brief, 2026-11-13"
  file_version:
    value: "where a year has a v1.x and a _v2.0 file side by side, the _v2.0 file; the file used is recorded for every year"
    source: "DATA_AUDIT 1.9: 'The bucket holds v1.0 and _v2.0 files side by side: step 9 chooses v2.0 and records it'"
  calendar:
    value: "each model's own calendar (standard, noleap or 360_day, from the file's time:calendar): only monthly means are used, and days are never matched between calendars"
    source: "Integrator's step-9 brief, 2026-11-13"
  outputs:
    value: "per plan (the three shown and every current-plan option) and per model x scenario run: the mean rain-fed harvest over the replay's complete years, with the same functions and years as scripts/run_plans.py evaluate() (plans.generate.plan_dates, plans.simulate.replay with bare_soil.kc and kc_climate.apply, plans.score.complete). harvest = the median over all model-scenario runs; harvest_low and harvest_high = the lowest and the highest run (the full spread). Per scenario also the median change in yearly dry days (rain-fed) and in the irrigated run's irrigation_mm. Each plan's baseline (no change, the observed weather) comes from the same code. Both rain versions: corrected (the default) and uncorrected (pipeline/twin/inputs.with_rain)"
    source: "Integrator's step-9 brief, 2026-11-13 (CLAUDE.md 'Future': 'report the spread across models as a range'; contract: harvest_low <= harvest <= harvest_high)"
  slider_grid:
    value: {rain_factor: [1.0, 0.9, 0.8, 0.7], warming_c: [0.0, 0.5, 1.0, 1.5, 2.0]}
    source: "CLAUDE.md 'Slider scenarios': 'precompute a grid (rain x 1.0, 0.9, 0.8, 0.7; warming +0, +0.5, +1, +1.5, +2 C) for the three plans'. Applied to the observed weather as the deltas are: every day's rain times the factor, the warming added to every temperature (Tmax and Tmin alike), ET0 rebuilt with relative humidity held"
  plausibility:
    value: {ssp245: {dtmax_c: [0.39, 1.02], dtmin_c: [0.54, 1.14], rain_change_pct: [-6.2, 15.7]},
            ssp585: {dtmax_c: [0.43, 1.11], dtmin_c: [0.59, 1.20], rain_change_pct: [-5.4, 15.2]}}
    source: "VALIDATION 4.7, fixed and committed 2026-11-14 BEFORE the first change was computed on real data. PASS when our ensemble median of each annual change (mean over all model days, 2026-2040 minus or over 1995-2014) lies inside the published 10th-90th percentile range across models. Published: World Bank Climate Change Knowledge Portal, 'Projected Climate Data, CMIP6 0.25-degree' (CC BY 4.0; catalogue https://datacatalog.worldbank.org/search/dataset/0042297, 'Historical Reference: 1995-2014'), annual anomalies 2020-2039 for Nepal (country mean), ensemble median [p10, p90]: SSP2-4.5 Tmax +0.70 [0.39, 1.02] C, Tmin +0.79 [0.54, 1.14] C, precipitation +6.1 [-6.2, +15.7]%; SSP5-8.5 Tmax +0.80 [0.43, 1.11], Tmin +0.87 [0.59, 1.20], precipitation +2.6 [-5.4, +15.2]% (read from the CCKP API by a research sub-agent, 2026-11-14; its method page could not be opened). Differences: a country mean that includes the High Himalaya, not our cell; 2020-2039 against our 2026-2040 (ours a few years later, so expected slightly warmer); possibly built from the same NEX-GDDP-CMIP6 data, so not independent. Context only, not part of PASS: DHM 2024 'Update of Climate Change Study of Nepal' (CMIP6, four models, 2016-2045 vs 1981-2010), Bhaktapur Tmax +0.7, Tmin +0.9 C, rain +10.0 / +7.7% (SSP2-4.5 / SSP5-8.5; Tables 0.16, 0.25, 0.7)"

site_main_field:                  # the field the site opens first (index.json fields[0]); the others follow, the demo next
  value: demo
  source: "Owner, 2026-11-15: keep Bhaktapur as the main field unless every Dhulikhel download finished and every check passes by 10:00 Nepal time; then Claude proposes Dhulikhel and shows before and after, and the owner decides. One-line switch: dhulikhel"

sections:                         # build step 8, small version (pipeline/sections/, scripts/run_sections.py). Fixed and committed before its first run.
  patches:                        # a drawn field's patches (owner, 2026-11-15: the Dhulikhel package's method)
    value: "a field whose config has `patches` (cell_m, min_piece_m2, ids) is split by pipeline/sections/grid.patches instead of the 30 m grid: a cell_m grid through the field's centre (its config lat, lon), each cell clipped to the outline, pieces under min_piece_m2 joined to the patch whose centre is nearest, numbered from the south-west, row by row (p1..). Distances flat-earth at the outline's mean latitude, as the other sections"
    source: "Owner, 2026-11-15: 'compute the 14 patches ourselves from the outline with the method in the README (a 10 m grid centred on the field, edge pieces under 50 m2 joined to the nearest patch, numbered from the south-west)'. 'Centred': grid lines through the centre (Claude's reading, chosen before the comparison: it gives 14 patches, 11 within 1 m of the package's; the other reading, a cell centred on the centre, was also tried and matches far worse). 'Nearest': by centre distance (Claude's reading)"
  patches_options:                # two options of the patches (owner, 2026-11-15: the Kharipati package's method)
    value: "config patches `grid: most_whole`: the grid is not through the centre but shifted: its origin moves in 0.5 m steps over one cell (0 to cell_m, east and north) and the position with the most whole cells (a cell lying entirely inside the outline, its piece within 0.5 m2 of cell_m squared) is used; ties: the position whose smallest patch (after joining) is largest, then the smallest shift. `join: touching`: a piece under min_piece_m2 is joined to the patch it shares the longest edge with (ties: the nearest centre); a piece touching no kept patch goes to the nearest centre. Without these keys the Dhulikhel method above is unchanged"
    source: "Owner, 2026-11-15: 'Compute its 13 patches in our own code with the README's method (10 m grid shifted for the most whole patches, edge pieces under 50 m2 joined to a touching patch, numbered from the south-west) and check they match the package's centres and areas'. The 0.5 m step, the whole-cell tolerance, the tie-breaks and 'longest shared edge' are Claude's readings, written and committed before the first comparison with the package"
  sub_pixel_patches:
    value: "a patch smaller than one HLS pixel (900 m2) gets the greenness word \"can't tell\": patches share their 30 m pixels, so the satellite cannot tell them apart. The sign test still runs and is kept in sections.json for the record"
    source: "Owner, 2026-11-15: 'Say plainly that the 30 m satellite data sees only about 2 squares of this farm, so the satellite history is for the area, while the probe sees each 10 m patch'. The 900 m2 floor (one 30 m pixel) is Claude's, fixed before the first run on patches"
  cell_m:
    value: 30
    source: "Integrator's step-8 brief, 2026-11-13: a section is about one HLS pixel (HLS User Guide v2.0, Apr 2026, sec. 3.3: 'Spatial resolution 30 m'), so the 60 m demo square gives 2 x 2. CLAUDE.md 'Sections' asked for about 10 m squares, 10 to 40 of them: a 10 m section has no satellite pixel of its own, so its greenness would only repeat its neighbours'. The demo gets 4 sections, fewer than CLAUDE.md's 10: put to the owner"
  max_sections:
    value: 40
    source: "CLAUDE.md 'Sections': aiming for 10 to 40 sections, coarser for big fields"
  coarsen_factor:
    value: 1.1
    source: "Claude's choice, kept from the step-1 grid (2026-11-13): when a field would have more than max_sections, the section side grows by 10% at a time until it fits"
  split:
    value: "four corners: split by the field's own corners (bilinear), n = round(side / cell_m) per direction and at least 1, a side being the mean of two opposite edges; any other outline: cells of its bounding box clipped to it, pieces under 1 m2 dropped"
    source: "Claude's choice, 2026-11-13 (brief: 'works for any field'): the sections tile the field exactly, whatever its orientation (pipeline/sections/grid.py)"
  hls_weights:
    value: "a section's NDVI on one image is the area-weighted mean of the HLS pixels it overlaps (weight = overlap area / section area; the section's corners projected to the HLS tile's UTM grid, edges straight)"
    source: "Integrator's step-8 brief, 2026-11-13"
  hls_clear:
    value: "as the field's greenness (pipeline/diary/ndvi.py clear_mask and scale_ndvi; greenness.min_clear_fraction), by area: an image counts for a section when its clear pixels holding NDVI carry at least min_clear_fraction of the section's weight; its NDVI is then the weighted mean over those pixels"
    source: "Integrator's step-8 brief, 2026-11-13: 'mask clouds exactly as the field's greenness does'. By area instead of by pixel count is Claude's reading (a section holds parts of pixels)"
  common_images:
    value: "the sections are compared only on images where every section counts; the field (all sections) on such an image is the area-weighted mean of its sections"
    source: "Claude's choice, 2026-11-13: every part is compared with the field on the same days"
  peak:
    value: "a season's peak = the maximum of the smoothed daily curve (pipeline/diary/greenness.daily_series, then season_detection.smooth_window_days and smooth_polyorder) between the season's start and end; anomaly = the section's peak minus the field's peak (all sections) in that season"
    source: "Integrator's step-8 brief, 2026-11-13 ('the peak NDVI by year, the field's peak (all sections) and the anomaly'); the curve drawn as the diary's season detection draws it (season_detection). Claude's reading"
  seasons:
    value: "the diary's chosen seasons (data/checks/<field>/diary_seasons.json, HLS rows), each in its slot by the month of its peak (rotation_guess: monsoon June-November, winter December-May)"
    source: "Integrator's step-8 brief, 2026-11-13: 'per section and season (the diary's monsoon and winter seasons)'"
  min_obs_per_season:
    value: 3
    source: "Claude's choice, 2026-11-13: a season counts only when at least 3 compared images fall between its start and end (with fewer, the peak is mostly drawn by the interpolation)"
  usually_test:
    value: "per section, a two-sided exact sign test on its seasons' anomalies (zeros left out), with Holm's step-down over the field's sections at family alpha. 'greener' (most anomalies positive) or 'less green' only when the test rejects AND the size of the median anomaly is larger than size_floor_relative x the field's median season peak NDVI; otherwise 'same' (shown as 'about the same'). 'can't tell' only when there are so few seasons that no outcome could pass Holm's first step. The ci_level interval for the median is reported, not used for the word"
    source: "Claude's choice of test, 2026-11-13, fixed before the first run (brief: 'pre-declare a consistency test'). Sign test and the median's interval: Conover 1999, Practical Nonparametric Statistics, 3rd ed., sec. 3.4 and 3.2; Holm 1979, Scand. J. Statist. 6:65-70 (standard results; neither text opened tonight). The seasons of one field are not fully independent (a tree line stays a tree line): 'usually' means a steady sign, which is what the test asks"
  alpha:
    value: 0.05
    source: "Conventional 5% level, as trends.alpha and groundwater.alpha"
  ci_level:
    value: 0.95
    source: "Claude's choice, 2026-11-13: the 95% interval, matching alpha"
  same_margin_ndvi:
    value: 0.05
    source: "Claude's choice, 2026-11-13, fixed before the first run: about twice the scatter of single clear observations about the field's smoothed curve (diary_seasons.json series.sigma_ndvi = 0.0267): a smaller difference cannot be told from one image's noise. NO LONGER USED from 2026-11-14 (owner's decision on the size floor): replaced by size_floor_relative; kept for the record of the first run (VALIDATION 3.20)"
  size_floor_relative:
    value: 0.045
    source: "Owner, 2026-11-14: \"'A little greener': yes, but only where a part's difference is larger than the satellite's normal noise (state the rule with its source); otherwise say 'about the same'.\" Noise: Ju et al. 2025, The Harmonized Landsat and Sentinel-2 version 2.0 surface reflectance dataset, Remote Sensing of Environment 324:114723, doi:10.1016/j.rse.2025.114723, abstract (read 2026-11-14 through OpenAlex): on 545 same-day Landsat/Sentinel-2 image pairs, 'the between-sensor VI difference is below 4.5% for most of the indices'. Why it fits: it is how much two HLS v2.0 measurements of the same 30 m place on the same day disagree, so a part whose typical season-peak NDVI differs from the field's by less than that is within the satellite's normal noise. Applied as a share of the field's median season peak NDVI (demo about 0.85, floor about 0.038). Conservative for NDVI: 4.5% bounds 'most' indices and the NDVI-specific number (Zhou et al. 2026, RSE 332:115084) was not opened. Same-day sensor differences partly cancel between parts of one image, so the floor may be stricter than needed. Claude's choice of figure, committed before the rerun"
  tpi_radius_m:
    value: 500
    source: "Weiss 2001 (Topographic Position and Landforms Analysis, poster, ESRI User Conference, San Diego) as documented by Jenness 2006 (Topographic Position Index v1.2, tpi_jen.avx, documentation): TPI = a cell's elevation minus the mean elevation of its neighbourhood (p. 5), illustrated with circles of 500 m and 2000 m radius (p. 5); 'small neighborhoods capture small and local hills and valleys' (p. 7). 500 m, the smaller one, is Claude's choice for a field-scale flag. De Reu et al. 2013 not opened"
  tpi_threshold_sd:
    value: -1.0
    source: "Weiss 2001's six slope-position classes as listed by Jenness 2006 (criteria set 'Sample 6-Class, de-emphasize class 2 & 5 (Weiss 2001)'): Valley TPI <= -1 SD; Lower Slope -1 SD < TPI <= -0.5 SD; SD = the standard deviation of the elevations within the neighbourhood (ddof 0: Claude's reading). Low ground = Weiss's valley class"
  dem_relative_error_m:
    value: 7.0
    source: "NASADEM User Guide (Buckley et al., Jan 2020) sec. 4.2.2.1: SRTM's requirement was a '10-m relative height error' (90%), and 'a global assessment of the SRTM performance showed the average absolute and relative height errors to be ~6.8 m and 7 m' (Rodriguez et al. 2005, 2006). NASADEM reprocesses SRTM (over North America its correction lowered the RMSE against ICESat from 6.1 to 5.3 m, sec. 4.2.6.2). A section whose TPI is smaller in size than this gets low_ground null ('can't tell'). Conservative: the relative error covers longer distances than 500 m"
  low_ground_rule:
    value: "a section's TPI and SD are the area-weighted means over its NASADEM pixels (each pixel's TPI over a circle of tpi_radius_m around it, itself included); low_ground = null when |TPI| < dem_relative_error_m, else true when TPI <= tpi_threshold_sd x SD, else false"
    source: "CLAUDE.md 'Frost': sections in low ground (negative TPI from NASADEM, D3) get a cold-air pooling flag. Threshold from Weiss 2001, the DEM's stated error from the NASADEM User Guide (above); the combination is Claude's, fixed before the first run"
  status_red_ks_below:
    value: 0.5
    source: "Claude's choice, 2026-11-13, fixed before the first run. FAO-56 eq. 84: Ks = (TAW - Dr) / ((1 - p) TAW) falls from 1 at RAW to 0 at TAW. Green when Dr <= RAW (Ks = 1, no stress); red when Ks < 0.5 (the crop gets less than half the water it would use unstressed: the root zone has used more than half of the water between RAW and TAW); yellow between; grey without a twin state. Every section shares the one twin state (one soil, one weather, one crop calendar)"

area_map:                         # Local Impact 4a (pipeline/area/, scripts/run_area_map.py). Written and committed BEFORE the first run.
  # Every cropland pixel of the demo fetch box, by the field diary's own methods. No new download: HLS windows and
  # WorldCover 2021 already cached for the box. Nothing here is tuned to a validation event.
  cropland:
    value: {worldcover_class: 40, min_cropland_fraction: 0.5, min_coverage_fraction: 0.5}
    source: "Claude's choice, 2026-11-14 (majority rule, the usual way to carry a class map to a coarser grid): an HLS 30 m pixel is cropland when at least half of the WorldCover 2021 v200 10 m pixels whose centres fall inside it are class 40 (cropland). It is judged only when at least half the expected number of WorldCover centres fall inside it (900 m2 over one WorldCover pixel's area at the box centre, about 11.8), that is, when it lies inside the fetch box"
  pure_check_min_fraction:
    value: 1.0
    source: "Claude's choice, 2026-11-14: a check on mixed pixels (a 30 m pixel half cropland, half houses or trees, mixes their greenness): every area number is also given for pixels whose WorldCover centres are all cropland. A check, not part of the range"
  series:
    value: "per pixel, the field diary's own series: HLS v2.0 L30 and S30 clear observations (Fmask bits 0-5 zero, NDVI not fill) from greenness.hls_from to 2025-12-31, same-day observations averaged, NDVI interpolated linearly in time between clear observations and never outside them (pipeline/diary/greenness.py daily_series). One pixel is its own 'field', so greenness.min_clear_fraction reduces to clear or not"
    source: "Owner's brief (Local Impact 4a, 2026-11-13): the same NDVI threshold, interpolation, cloud mask and years as the field's diary. MODIS (250 m) is not used: it cannot be mapped at 30 m, and the field's headline bare-days number is the HLS years' (below)"
  years:
    value: [2014, 2025]
    source: "The HLS years of the field's headline bare-days number (diary_bare_days.json summary mean_bare_days_hls_years: 2014-2025, each year with at least 300 days with a value) and of the field's HLS seasons"
  min_days_with_value:
    value: 300
    source: "The field diary's own rule for a year to count (scripts/run_diary.py run_greenness mean_bare: days_with_value >= 300); used for bare days and for seasons"
  min_years:
    value: 6
    source: "Claude's choice, 2026-11-14: a pixel is shown only if at least half of the 12 HLS years count for it; otherwise it is 'not enough clear pictures'"
  bare_days:
    value: "a day is bare when the interpolated NDVI is below bare_days.ndvi_max; a pixel's number is the mean of its yearly bare-day counts over the years that count"
    source: "rules.yaml bare_days (the field diary's rule, CLAUDE.md 'Bare days'); the mean over years as the field's summary mean_bare_days_hls_years"
  seasons:
    value: "the threshold method chosen in step 6b (rules.yaml season_detection: Savitzky-Golay 31 days, order 2; amplitude 0.1 and 35% of the 3-year range; start and end at 20%), run on each pixel's whole daily series; a season belongs to the calendar year of its peak (as diary_seasons.json seasons_by_year); a pixel's seasons a year = the mean count over the years that count, rounded to the nearest whole number (halves up), classes 0, 1, 2, 3 or more"
    source: "Owner's brief (4a): the season detection method chosen in step 6b, the threshold method (VALIDATION 3.15). Rounding the mean is Claude's choice, 2026-11-14"
  long_bare_days:
    value: 60
    source: "Claude's choice, 2026-11-14, no published source: 'bare more than 60 days a year', two months, an amount a farmer can picture. The demo field's own value (62.5 days a year, HLS years) was known when this was set"
  numbers:
    value: ["median_bare_days: the median over cropland pixels of each pixel's mean bare days a year", "share_long_bare: the share of cropland pixels whose mean bare days a year exceed long_bare_days", "share_two_seasons: the share of cropland pixels with two crop seasons a year"]
    source: "Owner's brief (4a): two or three honest area numbers, each with its uncertainty. Shares are of the cropland pixels shown (enough clear pictures), each pixel 0.09 ha"
  threshold_shift:
    value: 0.05
    source: "Claude's choice, 2026-11-14: the bare-day numbers are recomputed with bare_days.ndvi_max 0.05 lower and 0.05 higher (0.20, 0.30), about twice the scatter of the field's clear observations about its smoothed curve (sigma 0.0267, diary_seasons.json series.sigma_ndvi). The season method does not use the bare threshold, so share_two_seasons has no threshold range"
  year_to_year:
    value: "each number is also computed for each single year 2014-2025 from that year's per-pixel values (a pixel-year counts with min_days_with_value); the lowest and highest year are reported beside the multi-year number, as the spread between years, not as its error"
    source: "Owner's brief (4a): the year-to-year spread. Claude's reading, 2026-11-14"
  worldcover_accuracy:
    value: {asia_cropland_users_pct: 80.6, asia_cropland_users_ci_pct: 2.8, asia_cropland_producers_pct: 82.7, asia_cropland_producers_ci_pct: 2.5, global_cropland_users_pct: 80.6, global_cropland_users_ci_pct: 1.5, global_cropland_producers_pct: 79.3, global_cropland_producers_ci_pct: 1.5}
    source: "ESA WorldCover Product Validation Report (D12-PVR) v2.0, 2022-10-25 (Tsendbazar, Xu, Herold, Lesiv, Duerauer), WorldCover 2021 v200: Table A2.4 p. 29 (Asia, confusion matrix corrected by sample inclusion probabilities): Cropland user's accuracy 80.6 +/- 2.8, producer's accuracy 82.7 +/- 2.5; Table 2 p. 15 (global): user's 80.6 +/- 1.5, producer's 79.3 +/- 1.5; Asia overall 82.1 +/- 1.0 (Table 3 p. 16). Opened 2026-11-14 at esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/docs/WorldCover_PVR_V2.0.pdf"
  worldcover_bound:
    value: "commission share c = 1 - (Asia user's accuracy - its confidence half-width) = 1 - 0.778 = 0.222; worst case, every wrongly mapped pixel on one side: a share s lies in [max(0, (s - c) / (1 - c)), min(1, s / (1 - c))]; the median lies between the per-pixel quantiles 0.5 - c/2 and 0.5 + c/2. Omission (real cropland the map leaves out, 1 - producer's accuracy) cannot be bounded from these data and is stated in words"
    source: "Claude's choice, 2026-11-14: a worst-case bound from the published user's accuracy (its lower confidence end), not a statistical interval. The accuracy is continental, not Nepal's or the box's own; WorldCover 2021 is also out of date in places (the first placeholder square was a construction plot, owner 2026-11-12)"
  range_shown:
    value: "low and high of each multi-year number = the lowest and highest of the threshold-shift values and the WorldCover bound; the year-to-year spread is shown apart"
    source: "Claude's choice, 2026-11-14"
  field_check:
    value: "VALIDATION 3.23 passes when (a) the map's code, fed the demo field's own mean observation series (greenness_field.parquet, HLS rows from the field's first clear observation), gives exactly the diary's bare days in each year 2014-2025 (diary_bare_days.json by_year) and exactly its threshold seasons of the HLS years (start, peak, end; diary_seasons.json chosen seasons_by_year); (b) the diary's mean bare days of the HLS years lies within the range of the field's own HLS pixels' mean bare days on the map; (c) every field pixel's seasons-a-year class equals the diary's (its HLS seasons per year, averaged over 2014-2025 and rounded)"
    source: "Owner's brief (4a): a consistency check, not tuning. Claude's definition, fixed 2026-11-14 before the first run. (b) has no tolerance: the field's series is the mean of its pixels', so its value should lie among theirs"
  classes:
    value: {bare_days_breaks: [30, 60, 90, 120], bare_days_colours: ["#ffffd4", "#fed98e", "#fe9929", "#d95f0e", "#993404"], seasons_colours: ["#edf8e9", "#bae4b3", "#74c476", "#238b45"], no_data_colour: "#969696"}
    source: "Claude's choice, 2026-11-14: five bare-day classes, under 30, 30-60, 60-90, 90-120, 120 or more days a year; four season classes 0, 1, 2, 3 or more. Colours: ColorBrewer 2.0 (Brewer & Harrower, colorbrewer2.org) sequential YlOrBr 5-class and Greens 4-class, both marked colour-blind safe there; light = little, dark = much. The legend always carries the numbers (never colour alone)"
  render:
    value: {crs: "EPSG:3857", ground_pixel_m: 15, resampling: nearest, non_cropland: transparent}
    source: "Claude's choice, 2026-11-14: Leaflet's L.imageOverlay stretches an image linearly between its corners in Web Mercator, so the class grid is warped from UTM 45N to EPSG:3857 by nearest neighbour (classes are never averaged) at about 15 m on the ground at the box centre, half an HLS pixel, so the 0.7 degree turn of the UTM grid stays readable; each PNG must stay under 100 KB"

sample_fields:                    # Local Impact 4b (pipeline/area/samples.py, scripts/pick_sample_fields.py). Written and committed BEFORE the first run.
  candidate_rule:
    value: "the demo's own rule, by import from pipeline/fetch/placeholder.py: 60 m squares of WorldCover 2021 cropland with a 30 m cropland margin and no built-up pixel within 100 m of the margin (cropland_squares), whose HLS monthly greenness tops NDVI 0.25 in the monsoon and the winter of each of 2023-2025 (season_check, Nepal's seasons, the default), ranked as the demo's were (rank: SoilGrids cell within soilgrids.nearest_cell_max_m first, then the weaker season's peak, then distance to the box centre). Every candidate square is tested, not every third"
    source: "Owner's brief (4b, 2026-11-13): pick by the same rule as the demo field (REVIEW_NOTES H3; config/fields/demo.yaml header). Testing every square instead of every third is Claude's choice, 2026-11-14: the same rule on a denser list"
  spread:
    value: {split_at: origin_point, per_quadrant: 1, min_apart_km: 1.5}
    source: "Owner's brief (4b): e.g. the best candidate in each quadrant of the box, at least 1.5 km from the demo field and from each other. Claude's reading, 2026-11-14: the box is split into four quadrants at its centre (the demo's origin_point, 27.67 N, 85.43 E); going down the ranked list, a candidate is taken when its quadrant has none yet and its centre is at least 1.5 km (great circle) from the demo field's centre and from every sample already taken. A quadrant with no such candidate gets none (reported)"
  label:
    value: "config/fields/sample_<n>.yaml: placeholder true, sample true, name 'Bhaktapur sample field <n> (PLACEHOLDER)', the demo's placeholder rotations, water_source null, the demo's fetch_box, bbox, validation_station and correction_label"
    source: "Owner's brief (4b) and owner's 8b (2026-11-14, via the integrator): each is labelled a sample and listed in index.json (the integrator writes index.json)"

validation_checks:                # independent checks of the twin (owner's group 3a-3c and GLDAS, 2026-11-14): pipeline/checks/, scripts/run_validation_checks.py. Written and committed BEFORE the first run of any of them; only data AVAILABILITY was looked at first (ECOSTRESS overpass counts at the field pixel, FAOSTAT items, GLDAS variables), no outcome statistic. Checks only: nothing here changes an export.
  common:
    correlation:
      value: "Pearson and Spearman correlation, each with a 95% percentile bootstrap interval: 10,000 resamples, seed 0 (numpy default_rng). Per-season and per-year checks resample the seasons or years; monthly checks resample whole calendar years (12-month blocks), so a year's autocorrelated months stay together"
      source: "Owner's brief (2026-11-13, night): 'the correlation (Pearson and Spearman) with a bootstrap CI (fixed seed) and n'. Percentile interval and year blocks: Efron & Tibshirani 1993, An Introduction to the Bootstrap, ch. 13 (percentile interval) and sec. 8.6 (blocks for dependent data); the counts and the seed are Claude's choices"
    detectable_r:
      value: "with each result, the smallest |r| its n can tell from zero at the 5% level, two-sided: r = t / sqrt(n - 2 + t^2), t the 97.5% point of Student's t with n - 2 degrees of freedom"
      source: "The usual t test of a Pearson correlation (t = r sqrt(n - 2) / sqrt(1 - r^2)) solved for r; owner's brief: 'say plainly what n allows'"
    degenerate_twin:
      value: "a twin series is not testable when more than half of its values are one and the same value (e.g. ETa/ETc = 1.000 when the crop never runs short): reported as 'not testable', with no correlation"
      source: "Claude's choice, fixed before the first run: a correlation with a near-constant series measures its one or two odd seasons, not agreement (METHOD_NOTES 36: the twin's rain-fed rice is 100% in 22 of 25 seasons)"
    rain_versions:
      value: [corrected, uncorrected]
      source: "Owner's decision 1 (2026-11-13): every rain-based result is also run on GPM as published; the twin's results for each come from data/checks/<field>/replay.json and rain_uncorrected/replay.json"
    twin_consistency:
      value: "where daily twin values are needed the twin is rerun in memory with the calls of scripts/run_replay.py and run_plans.py; its per-season ETa, ETc and harvest must equal replay.json (and the rice-then-wheat option's yearly harvest must equal plans.json current_options) within 1e-6, else the run stops"
      source: "Claude's choice, fixed before the first run: another agent may switch on a new bare-soil evaporation later (rules.yaml bare_soil); this keeps a stale or mismatched twin from giving numbers silently (golden rule 12c in spirit). Rerun the replay and plans first, then this check"
    agree_band_r:
      value: 0.3
      source: "Cohen 1988, Statistical Power Analysis for the Behavioral Sciences, 2nd ed., sec. 3.2: r = 0.1 small, 0.3 medium, 0.5 large. Used for the monthly checks (GLDAS): 'holds up' needs the interval's lower bound above a medium correlation, since with 300 months any correlation above about 0.1 differs from zero"
  ecostress:
    clean_pixel:
      value: "the one 70 m pixel whose centre lies in the field (row 39, col 90 of the box grid, EPSG:32645): 37% of it is field, 50% of the field is in it. The area-weighted mean of the 4 pixels touching the field is kept beside it as a sensitivity"
      source: "DATA_AUDIT 1.8 trap 5 (REVIEW_2 L11): one pixel centre in the field; shares computed on a 1 m sub-grid of the field polygon (Claude, 2026-11-14)"
    clean_lst_qc:
      value: "an LST pixel is kept only where QC bits 1-0 are 00 (pixel produced, best quality); 01 (degraded) and 11 (not produced) are dropped, as is QC 65535"
      source: "ECOL2 User Guide V3, Table 6 (DATA_AUDIT 1.8, verified): bits 1&0 00 = produced, 01 = produced but degraded, 11 = not produced. Best quality only is Claude's choice, fixed before the first run: every LST outside the physical range below in the box (V002) carries bits 01"
    clean_cloud:
      value: "cloud = 1 is dropped in both versions; QC and cloud count only beside a valid value (rules.yaml ecostress.qc_needs_valid_value)"
      source: "DATA_AUDIT 1.8 traps 1-2: V002 already blanks LST under cloud (0 of 5.06 million valid pixels have cloud = 1), V003 does not (10.6%), so the mixed series applies the cloud layer to both"
    clean_lst_range_c:
      value: [-98.0, 70.7]
      source: "Hard limit after masking (golden rule 12c with decision D2: fail loudly; values outside rule 12's -30 to 50 C but inside this range are counted as range_warnings): the coldest land surface temperature measured from space, about -98 C (Scambos et al. 2018, Geophys. Res. Lett. 45, 6124-6133, doi:10.1029/2018GL078133) and the hottest, 70.7 C (Mildrexler, Zhao & Running 2011, Bull. Amer. Meteor. Soc. 92(7), 855-860; MODIS, Lut Desert, 2005; both read 2026-11-14). The cached range 14.6 K to 1,305.8 K (DATA_AUDIT 1.8 trap 3) is not physical"
    clean_esi:
      value: "ESI kept where it is 0 to 1 (outside: fail loudly), cloud = 0, and the same overpass (version, orbit, scene) has a kept (best-quality, cloud-free) LST at the pixel"
      source: "ESI range 0 to 1: ECOSTRESS Tiled User Guide V2, Table 11 (DATA_AUDIT 1.8). ESI comes from the PT-JPL evapotranspiration, which is driven by the overpass's LST; the ESI files carry no QC layer, so the LST pixel's QC is the only quality information: Claude's choice, fixed before the first run"
    clean_iteration:
      value: "one granule per overpass (product, version, orbit, scene): the latest build, then the highest product iteration (the last two fields of the file name, e.g. _0712_02)"
      source: "DATA_AUDIT 1.8 trap 4: 119 LSTE overpasses have two or three iterations and 111 of the first pairs differ. Claude's choice, fixed before the first run: a later production of the same overpass replaces the earlier one"
    clean_date:
      value: "the overpass's local date: the UTC time in the file name + 05:45"
      source: "DATA_AUDIT 1.8: time stamps read as UTC (TODO-VERIFY there); Nepal is UTC+05:45. Only the season a date falls in matters here"
    statistic:
      value: "per crop season of the field's current rotation (the twin's own dates in replay.json; slot monsoon = rice, winter = potato), the mean ESI of the kept overpasses inside it, as its difference from the slot's mean over the qualifying seasons, against the twin's ETa/ETc of the same season; Spearman (primary) and Pearson, per slot, both rain versions"
      source: "Owner's brief (3a): the seasonal ESI anomaly against the twin's ETa/ETc anomaly for the current rotation. ESI (actual over potential ET, PT-JPL, model-based from the satellite's LST) and ETa/ETc are both ratios of water used to water needed. Claude's reading, fixed before the first run"
    min_overpasses_per_season:
      value: 3
      source: "Claude's choice, fixed before the first run: a season's mean from fewer than 3 clear overpasses is one or two days, not a season"
    min_seasons:
      value: 6
      source: "Claude's choice, fixed before the first run: with 6 seasons a correlation must exceed about 0.81 to differ from zero (detectable_r); ECOSTRESS covers at most 8 monsoons (2018-2025) and 7 winters"
    holds_up:
      value: "Spearman rho above 0 with the 95% bootstrap interval's lower bound above 0, in both rain versions, in a slot with at least min_seasons seasons of at least min_overpasses_per_season kept overpasses, and the twin series not degenerate"
      source: "Owner's brief (3a): pre-declare minimum seasons, minimum clear overpasses, the statistic, the CI and the threshold. Claude's choices, fixed before the first run"
    secondary:
      value: "overpass days: each kept ESI against the twin's daily Ks (ETa/ETc that day, current rotation, rain-fed, bare days included) on its local date; Spearman with a year-block bootstrap, raw (seasonal cycle included: it shows only that both see the dry season) and as anomalies from each calendar month's mean. Descriptive; it does not decide the diary line"
      source: "Claude's choice, fixed before the first run: uses every clear overpass, not only seasons with 3 or more"
    diary_line:
      value: "only if the check holds up in at least one slot: one line of at most 8 words about crop thirst seen from the Space Station, with its uncertainty wording, proposed to the owner; this check never writes to an export"
      source: "Owner's brief (3a)"
  twin_vs_hls:
    pairing:
      value: "monsoon: the twin's rice season of year Y with the HLS monsoon season whose peak is in Y; winter: the twin's winter crop harvested in Y with the HLS winter season whose peak is in Y (slots by pipeline/diary/guess.slot_of). HLS years only (2014-2025, the chosen season method in diary_seasons.json); the anomaly is a season's peak NDVI minus its slot's mean peak"
      source: "Owner's brief (3b; VALIDATION 4.2). The same target as field memory (rules.yaml field_memory.target). Claude's pairing, fixed before the first run. Caveat (VALIDATION 4.2, METHOD_NOTES 40): the placeholder potato runs 30 Oct to 21 Feb, the satellite's winter season about 7 Jan to 18 May"
    primary:
      value: "per slot, the twin's season ETa/ETc against the peak NDVI anomaly; expected sign positive (less water shortfall, greener)"
      source: "Owner's brief (3b): ETa/ETc, dry days, harvest_pct per season. Claude's choice of the primary, fixed before the first run"
    secondary:
      value: "dry days (expected negative); harvest_pct (expected positive; FAO-33 makes it a straight-line function of ETa/ETc within one crop, so its ranks are the same unless clamped at 0); the winter slot again with the rice-then-wheat option (wheat sown 15 Nov, nearer the satellite's season; plans.json current_options)"
      source: "Owner's brief (3b). Descriptive; they do not decide the result"
    min_seasons:
      value: 8
      source: "Claude's choice, fixed before the first run: about two thirds of the 12 HLS years"
    holds_up:
      value: "the primary's Spearman interval (95%) excludes 0 on the expected side in both rain versions"
      source: "Claude's choice, fixed before the first run"
  faostat:
    crops:
      value: {rice: "twin rice, current rotation (FAOSTAT item 27)", potato: "twin potato, current rotation (item 116, read from the same bulk file for this check)", wheat: "twin wheat of the rice-then-wheat option (item 15)"}
      source: "Owner's brief (3c): rice, wheat, maize, and potato if the bulk file has it (it has Nepal potato, item 116, 2000-2024). Maize is in no current rotation, so it is not compared"
    year_pairing:
      value: "FAOSTAT year Y with the twin season harvested in year Y (the twin's season year, rules.yaml replay.year_of_season); years 2002-2024"
      source: "Claude's reading, TODO-VERIFY in FAOSTAT's QCL methodology: FAOSTAT credits a crop to the calendar year of its harvest (Nepal's wheat 2016, harvested after the 2015/16 winter drought, is 2,329 kg/ha after 2,591 in 2015; DATA_AUDIT 1.12)"
    detrend:
      value: "first differences: this year's value minus last year's, for the national yield (kg/ha) and the twin's harvest %"
      source: "Owner's brief (3c): pre-declare the detrending (e.g. first differences). National yields rise steadily (Nepal rice 2,675 to 4,192 kg/ha, 2001-2024); first differences remove that without a fitted trend. Claude's choice, fixed before the first run"
    statistic:
      value: "Pearson and Spearman of the first differences, bootstrap over the differences (common.correlation), and the share of years in which both go the same way"
      source: "Claude's choice, fixed before the first run"
    holds_up:
      value: "the Spearman interval (95%) of a crop's first differences excludes 0 on the positive side, in both rain versions, with the twin series not degenerate"
      source: "Claude's choice, fixed before the first run. A national yield mixes the plains, irrigation, seed and fertiliser; one 60 m placeholder field's weather is a small part of it"
  gldas:
    pairs:
      value: {soil: "the twin's root-zone wetness 1 - Dr/TAW (current rotation, rain-fed, monthly mean) against GLDAS soil moisture 0-100 cm (m3/m3)", et: "the twin's ETa (current rotation, rain-fed, monthly total) against GLDAS Evap (monthly total)", pet: "the twin's ET0 (monthly total) against GLDAS PotEvap (monthly total; rain-independent, reported once)"}
      source: "Owner, 2026-11-14 (via the integrator): GLDAS as one more independent check of the twin's soil moisture and evapotranspiration over 2001-2025, monthly anomalies and correlation with CIs, both rain versions. GLDAS_NOAH025_M v2.1, the 0.25-degree cell holding the field (pipeline/fetch/gldas.py). Noah's PotEvap is the closest GLDAS variable to ET0, not ET0"
    anomaly:
      value: "monthly values minus each calendar month's own mean over 2001-2025 (300 months), as in the SMAP check (VALIDATION 4.2b); also June-September and October-May separately, and the step at 2017 in standard deviations"
      source: "scripts/run_smap_check.py's method, kept the same so the two checks compare; Claude's choice, fixed before the first run"
    holds_up:
      value: "Pearson r of the monthly anomalies with its 95% year-block bootstrap interval's lower bound above common.agree_band_r (0.3), in both rain versions"
      source: "Claude's choice, fixed before the first run (common.agree_band_r: Cohen 1988)"
verification:                     # owner's accuracy and verification programme, 2026-11-14 (item 1: yardsticks first). Written and committed BEFORE any score below was computed (scripts/run_verification.py, pipeline/checks/verify.py). Published sources were looked up by a research sub-agent that was not shown any of our results.
  common:
    threshold:
      value: 0.92
      source: "Owner, 2026-11-14 (the local lead's requirement): VERIFIED needs at least 92%, as percent correct for categories and the percent of cases within tolerance for amounts; the point estimate counts, with its confidence interval always shown beside it"
    n_min:
      value: 10
      source: "Claude's choice, set before any scoring (the owner asked for a minimum number of test cases). No general published rule exists (research sub-agent, 2026-11-14); map-accuracy practice asks far more, about 50 per class (Olofsson et al. 2014, Remote Sens. Environ. 148:42-57). Below 10 cases one case moves the share by more than 10 points, more than the 8-point margin 92% leaves, and even 10 of 10 has a 95% Wilson lower bound of 72%"
    interval:
      value: "95% Wilson score interval of the share, always shown beside it"
      source: "Brown, Cai & DasGupta 2001, Statistical Science 16(2):101-133 ('we recommend the Wilson interval ... for small n'); formula as Newcombe 1998, Statistics in Medicine 17:857-872, method 3, whose Table II values tests/test_verify.py reproduces"
    statuses:
      value: {VERIFIED: "an independent reference, at least n_min cases, and a share of at least the threshold", ESTIMATE: "tested but below the threshold, or tested only against a reference that is not independent (consistency), or a projection that cannot be tested yet: shown with its range, never used alone for field advice", NOT YET VERIFIABLE: "no independent reference data yet, or fewer than n_min cases: the data that would verify it are named, and any partial result is shown"}
      source: "Owner, 2026-11-14 (item 4): VERIFIED (meets 92% on an independent test), ESTIMATE (shown with its range, not used for field advice), NOT YET VERIFIABLE (with the data that would verify it)"
    independence:
      value: "a reference is independent only if it was not used to build, fit, scale, choose or tune the output. A reference built from the same satellite record, the same crop model or the same weather measures consistency, not truth, and can give at most ESTIMATE. A reference seen before its rule was set is marked not independent"
      source: "Owner, 2026-11-14 (item 3): say what each reference is and whether it is truly independent; seasons scored against the same satellite record measure consistency, only the farmer's dates make it a true test"
    field_advice:
      value: "field advice (the plans and tips) uses only VERIFIED outputs, or says plainly that it rests on an estimate"
      source: "Owner, 2026-11-14 (item 4)"
    wording:
      value: "every accuracy statement says what was measured, with its number, n and range, e.g. 'within 19% of DHM's rain gauges in 14 of 18 months (78%, 55-91%)'; never an apology"
      source: "Owner, 2026-11-14 (item 4)"
  locked_test:
    farmer:
      value: "every answer in the farmer's files (data/field_visit/<field>/: farmer.yaml, corners.csv, probe_spots.csv): dates, best and worst years, calendar, watering. Their SHA-256 is written into config/locked_test.yaml before any score uses them; no rule, fit or method choice reads them"
      source: "Owner, 2026-11-14 (item 1): lock the farmer's answers; the worst and best years are asked before the farmer sees the app"
    cups:
      value: "every bench cup and push-in (data/probe/bench/cups.csv and the bench logs): each cup is scored by a line fitted on the other cups only (leave one cup out, rules.yaml probe.bench); cups.csv's SHA-256 is locked on arrival"
      source: "Owner, 2026-11-14 (item 1); rules.yaml probe.bench (committed 32890ca before any bench data)"
    field_readings:
      value: "the probe's readings at the field and any weighed soil samples: the twin is scored on its state BEFORE a reading updates it (the Kalman prior), never after"
      source: "Claude's choice, set before any reading exists: a state after the update has already seen the reading"
    dhm_bulletins:
      value: "DHM's monthly gauge bulletins (data/clean/<field>/dhm_bulletin_months.csv). Months up to December 2025 may be used to choose the central rain version and fit a correction, only as rain_selection says (leave one gauge out); January-July 2026 are the locked test months, never used to fit or choose"
      source: "Owner, 2026-11-14 (items 1 and 2: merging GPM with DHM gauges only if tested on gauges and months it never saw); owner, 2026-11-14 afternoon: 'choose the central rain version and any monthly correction by testing on months and gauges it never saw. Show me the result before switching.' Amended before any 2026 month was compared. Already seen: the corrected rain against the three-gauge mean in the 20 scorable months of June 2023-December 2025 (13 within 19%, compliance table of b37ce10)"
    known_events:
      value: "config/known_events.yaml events and negative controls: never used to set or tune an event rule"
      source: "Owner, 2026-11-12 and 2026-11-14 ('never tune anything on the test set or the validation events')"
    years:
      value: "2014-2025. Any calibration (soil water held, root depth, Ky) is fitted on 2002-2013 only; whether a change is kept is decided by leave-one-year-out within 2002-2013; 2014-2025 only reports the score before and after"
      source: "Owner, 2026-11-14 (item 2: 'fit on some years, test on years it never saw'; keep a change only if it improves the held-out score). A block in time, not alternate years: year-to-year changes need consecutive years, and neighbouring years are not independent (Roberts et al. 2017, Ecography 40:913-929, blocked cross-validation). Deciding keep-or-drop inside 2002-2013 keeps the test block untouched"
    already_seen:
      value: "looked at before these yardsticks were written: the twin's rain level against DHM's Bhaktapur normal (1.35 x, VALIDATION 3.1) and six DHM bulletin months of 2025 (3.9c); the events against known_events (4.1); the three season methods' agreement (3.15); the plan picks under changed inputs (4.4). The tolerances below come from published sources or stated conventions, not from these numbers. Added 2026-11-15, before the new rows were scored: the twin's monthly mean night temperature against Bhaktapur's normal (3.11b); the twin's daily soil-water anomalies against SMAP L4 and GLDAS (4.2b, 4.2d); DHM's onset trend as computed by pipeline/diary/onset_dhm.py (the sentence shown); never the frost words against DHM's order, the soil words against the models' terciles, or any model output beside the district yields"
      source: "Claude, for the record (golden rule 11: honest outputs)"
  outputs:
    rain_months:
      value: {shown: "Rain behind the month words, dry days and events", measure: "monthly rain, the twin's central (tuned) rain against the mean of the valley gauges, within 19%; in-sample: the tuning factors were fitted on these gauge months", reference: "DHM monthly gauge bulletins: Bhaktapur, Changu Narayan, Kathmandu Airport", independent: false, needs: "bulletin months after 2025 with the twin's rain for them (the locked 2026 months; VALIDATION 3.9e)", verify_by: "DHM's rain gauge months of 2026, kept aside and never used to tune.", gauges: ["Bhaktapur", "Changu Narayan", "Kathmandu Airport"], min_gauges: 2, min_gauge_mm: 10, rain_column: rain_mm, tolerance_rel: 0.19}
      source: "independent false (Claude, 2026-11-14, before re-scoring): since the owner's switch to the tuned rain (gauge_calibration.apply), the twin's rain is the corrected rain times factors fitted on June 2023-December 2025 of these same gauges plus Nagarkot, which covers every month this check can score (the twin's weather ends 2025-12-31), so the score is in-sample and cannot verify. The out-of-sample evidence is verification.rain_selection (leave one gauge out; the locked 2026 months). Tolerance: IMD's 'normal' category, -19% to +19% of the long-period average, which IMD uses 'operationally' for monthly rain over districts (IMD, Frequently asked Questions on Monsoon, Q3, p. 1: https://mausamaudit.imd.gov.in/imd_latest/monsoonfaq.pdf). Borrowed: it describes how unusual a month was, not how wrong a satellite is; no published satellite-against-gauge standard for monthly totals exists (GPM's Level-1 requirement covers instantaneous rain rates only; Skofronick-Jackson et al. 2017, BAMS 98:1679). DHM's own seasonal band, 90-110% 'near normal' (DHM Monsoon 2025 summary, p. 2), is reported beside it for whole seasons. Gauges: the three valley-floor gauges within 10 km of the field used in VALIDATION 3.9c, fixed in advance; at least 2 reporting; months whose gauge mean is under 10 mm are listed, not scored (a percentage of almost nothing). Claude's choices, fixed before the first score"
    rain_month_words:
      value: {shown: "The rain word of each month (low, medium, high)", measure: "the month's word equals the tercile of DHM's Bhaktapur normal for that month", reference: "DHM 1991-2020 normals, Bhaktapur", independent: true, needs: "-", verify_by: "-"}
      source: "Same tercile rule as the diary (rules.yaml months; CLAUDE.md 'Monthly calendar'), applied to DHM's normals (config/dhm_normals_1991_2020.csv); the twin's corrected rain is not scaled to DHM. Claude's choice, fixed before the first score"
    heat_month_words:
      value: {shown: "The heat word of each month (none, some, high)", measure: "the month's word equals the tercile of DHM's Bhaktapur normal daytime temperature", reference: "DHM 1991-2020 normals, Bhaktapur", independent: true, needs: "-", verify_by: "-"}
      source: "Same tercile rule as the diary; the temperature correction was fitted to Kathmandu Airport (GHCN), not to Bhaktapur, so Bhaktapur's normals are independent of the fit (VALIDATION 3.11b). Claude's choice, fixed before the first score"
    frost_month_words:
      value: {shown: "The frost word of each month", measure: "the month's frost word (none < risk < high) against DHM's Bhaktapur 1991-2020 normal minimum (night) temperature of each month: a month passes when no month with a colder normal has a milder frost word, no month with a warmer normal has a frostier word, and, since a month's coldest night is at most about its mean night temperature, a month whose normal is below frost_risk_c (2 C) is not 'none' and one below frost_c (0 C) is 'high'. Months with equal normals are not ordered. 12 cases", reference: "DHM 1991-2020 normals, Bhaktapur (minimum temperature)", independent: true, needs: "DHM's daily night temperatures at Bhaktapur, or a thermometer at the field", verify_by: "The farmer's records of frosty nights, or a thermometer at the field one winter.", station: Bhaktapur, variable: tmin_c}
      source: "Owner, 2026-11-15 (item 1): 'check them against DHM's 1991-2020 temperature normals (minimum temperatures), the same way the rain and heat month words were checked'. Same reference family and the same 12 monthly cases as rain_month_words and heat_month_words. The frost words are not thirds: they are the owner's fixed bands of each month's median coldest night (CLAUDE.md 'Frost'; pipeline/diary/months.py frost_band), so the tercile rule would test a rule the site does not use; the test is the order of the months by DHM's normal, plus the one bound that follows from DHM's mean (a month's coldest night is at most its mean night temperature, about, as our band uses the median over years). It cannot show that a 'risk' month's coldest night really lies between 0 and 2 C: DHM's normals have no coldest nights. Independent: the frost temperatures are quantile-mapped to Kathmandu Airport (GHCN), not to Bhaktapur. Already seen: the twin's monthly mean Tmin against Bhaktapur's normal (VALIDATION 3.11b, 0.98 C; Bhaktapur's nights are colder November-April); the frost bands were fixed by the owner on 2026-11-12, never tuned to it. Claude's test, fixed before the first score (2026-11-15)"
    soil_month_words:
      value: {shown: "The soil word of each month (dry, medium, wet)", measure: "the month's soil word equals the tercile word (dry, medium, wet; the diary's rule, pipeline/diary/months.py tercile_words) of each model's mean root-zone soil moisture in that calendar month: NASA SMAP L4 root zone (0-100 cm; data/clean/<field>/smap.parquet smap_l4_rootzone_m3m3, every day of its record, 2015-03-31 to 2025-12-31) and GLDAS-2.1 Noah root zone (0-100 cm, the field's own cell; gldas.parquet theta_0_100cm_m3m3, every month 2001-2025). 24 cases (12 months x 2 models); each model's share reported beside", reference: "NASA SMAP L4 and GLDAS-2.1 Noah (models, not measured soil)", independent: false, needs: "weighed soil samples or a calibrated probe through a year", verify_by: "A probe walk on the real field, once a month for a year.", models: {smap_l4: {file: smap.parquet, column: smap_l4_rootzone_m3m3, date: date}, gldas: {file: gldas.parquet, column: theta_0_100cm_m3m3, date: month}}}
      source: "Owner, 2026-11-15 (item 2): 'check them against NASA SMAP L4 and GLDAS monthly soil-moisture patterns, noting that these are models, not ground truth'. Not independent (owner, 2026-11-14, item 3: model references measure consistency), so at most ESTIMATE whatever the share. Root zone in both, as the soil word comes from the twin's root-zone wetness (scripts/run_diary.py: 1 - Dr/TAW). Already seen: daily anomalies of the twin against SMAP L4 (VALIDATION 4.2b, r 0.62) and GLDAS (4.2d); never the monthly words. Claude's choices, fixed before the first score (2026-11-15)"
    cover_months:
      value: {shown: "Which months the field is bare or growing", measure: "each month bare or not, satellite against the farmer's normal year", reference: "the farmer's calendar", independent: true, needs: "the farmer's answers", verify_by: "The farmer's records: which months the field is bare."}
      source: "Owner, 2026-11-14 (items 1 and 3: the farmer's answers are the true test of the satellite's seasons). Category per month (12 cases)"
    season_dates:
      value: {shown: "When each crop is sown and harvested", measure: "the satellite's season start and end dates within 10 days of the farmer's dates, per crop and year", reference: "the farmer's dates for recent years", independent: true, needs: "the farmer's dates for 3 recent years", verify_by: "The farmer's records: when they sowed and harvested, for 3 years.", tolerance_days: 10}
      source: "No published day-accuracy standard exists (research sub-agent, 2026-11-14: ESA GlobDiversity LSP requirements, NASA VIIRS phenology validation and others state none). 10 days is one dekad, the time unit of operational crop monitoring ('Phenological timings are expressed as dekads': JRC ASAP Water Satisfaction Index manual v2.0, Boogaard et al. 2019, EUR 29396 EN, sec. 2.3; FEWS NET agroclimatology glossary); published satellite results reach 7-16 days (VIIRS LSP against PhenoCam and ground sites; Sakamoto et al. 2005, RSE 96:366, paddy planting RMSE 12.1 days). A chosen convention, stated as such"
    rotation_guess:
      value: {shown: "Our guess of the crops (rice, then potato or wheat)", measure: "guess equals the farmer's rotation, per field", reference: "farmers' answers", independent: true, needs: "at least 10 fields whose farmers told us their rotation", verify_by: "The farmer's records of what they grew, from at least 10 fields."}
      source: "Owner, 2026-11-14 (item 4); one field gives one case"
    flood_years:
      value: {shown: "Flood years in the replay", measure: "valley floods found (hit rate); false alarms beside it", reference: "sourced valley floods (known_events.yaml)", independent: false, needs: "more sourced valley flood years", verify_by: "The farmer's records of flood years, and more written records for the valley."}
      source: "Hit rate (probability of detection) and false-alarm ratio as defined by the WWRP/WGNE Joint Working Group on Forecast Verification Research (https://jwgfvr.github.io/forecastverification; Jolliffe & Stephenson 2012, Forecast Verification, 2nd ed.). Not independent: the flood rule's earlier versions were run before it was set, so the valley floods were already known to be among the wettest days (VALIDATION 4.1, REVIEW_2 M8)"
    drought_years:
      value: {shown: "Dry years in the replay", measure: "valley dry seasons found (hit rate); false alarms beside it, a dry flag in a season DHM's gauges show was normal counting as one", reference: "sourced valley droughts and DHM's negative controls (known_events.yaml)", independent: false, needs: "more sourced valley drought seasons", verify_by: "The farmer's records of dry years, and more written records for the valley."}
      source: "As flood_years. Not independent: deciles 1-2 were chosen partly because they found more of these events (owner's batch item 17; VALIDATION 4.1)"
    harvest_years:
      value: {shown: "Each year's harvest in the replay (baskets)", measure: "the farmer's 3 worst years in our lowest third and 3 best in our highest third (when the farmer's answers arrive); and Bhaktapur's district yields: for each crop and fiscal year in the file, a good or bad year in both (each series' residual from its own straight line over those years has the same sign; a zero residual is not scored)", reference: "the farmer's best and worst years; MoALD district yields, Bhaktapur (7 fiscal years)", independent: true, needs: "the farmer's answers; more years of Bhaktapur district yields", verify_by: "The farmer's records: their best and worst harvest years.", district: {file: data/clean/demo/district_yields_bhaktapur.csv, crops: {paddy: rice, potato: potato}, not_scored: {wheat: "not in the current plan's seasons (rice then wheat is run as whole years only)"}, fiscal_year_starts: "07-16", seasons: "data/checks/<field>/replay.json, the field's water case (rain-fed while the water source is unknown), harvest_pct of each season"}}
      source: "District part: owner, 2026-11-15 (item 4: 'compare our good and bad years with Bhaktapur's district yields (the 7 years we found), and report the matches honestly, whatever the result'). Paddy against our rice, potato against our potato (the current plan, rice then potato); wheat listed, not scored (no wheat season in the current plan). A season belongs to the fiscal year its harvest date falls in (Nepal's fiscal year runs from Shrawan 1, about 16 July, to the end of Asar, about 15 July). Good or bad: the residual from a least-squares straight line on the year, fitted to each series alone over the scored years, which removes the steady rise from better seeds and inputs that a weather-only model cannot show; Claude's choice, fixed before any model output was put beside the district file (SI_LOG: the file was collected without opening a model output). The field's water case is the one the replay exports; the watered case is reported beside, not scored. Year-to-year direction over consecutive fiscal years (pipeline/checks/verify.py same_direction) reported beside, not scored. Farmer part: owner, 2026-11-14 (item 1: the farmer's best and worst years as matches out of 6). Thirds by average rank of the year's harvest in the field's water case, 2002-2025 (Claude's choice, fixed before any answer exists). No published pass mark for year-to-year direction exists (research sub-agent: Mueller et al. 2017, GMD 10:1403, benchmark by correlation only); the owner's 92% is applied"
    plan_cover_gap_beats_current:
      value: {shown: "'Fill the empty months' grows more than today's plan", measure: "share of runs (today and 46 climate runs, two rain versions) in which its harvest beats today's plan", reference: "our own runs: the same crop model", independent: false, needs: "harvests measured on fields that tried it", verify_by: "A season of Safe Trial: one part of the field tries it.", rain_versions: [corrected, dhm]}
      source: "Owner, 2026-11-14 (item 1: the plans as the share of ensemble runs in which each suggested plan beats the current one). Runs from data/checks/<field>/future.json (23 NEX-GDDP-CMIP6 models x SSP2-4.5 and SSP5-8.5, and the 2002-2025 replay) for the central rain and the DHM-scaled dry edge. Every run shares the twin, so this shows the advice is robust, not that its numbers are right: not independent"
    plan_safest_beats_current:
      value: {shown: "'Feed your soil' grows more than today's plan", measure: "share of runs (today and 46 climate runs, two rain versions) in which its harvest beats today's plan", reference: "our own runs: the same crop model", independent: false, needs: "harvests measured on fields that tried it", verify_by: "A season of Safe Trial: one part of the field tries it.", rain_versions: [corrected, dhm]}
      source: "As plan_cover_gap_beats_current"
    monsoon_start:
      value: {shown: "When the monsoon usually starts, and whether it has shifted", measure: "our copy of DHM's onset dates, 2001-2024, equal to DHM's table on a second reading", reference: "DHM's own table (the record itself)", independent: true, needs: "a second reading of DHM's table", verify_by: "DHM's own onset dates, read a second way."}
      source: "Owner, 2026-11-14 ('fix the answer, not the method'): DHM's record is shown as DHM's; what we can get wrong is the copy"
    monsoon_shift:
      value: {shown: "Whether the monsoon's start has shifted ('No clear change since 2001, in Nepal's weather office records')", measure: "the sentence shown, recomputed from a second reading of DHM's onset table (pdftotext and a regular expression, years 2001-2024) by an independent implementation: the Mann-Kendall p as scipy.stats.kendalltau of onset calendar day on year, the 95% range as scipy.stats.theilslopes at 1 - trends.alpha; 'no clear change' when the range holds 0 or p >= trends.alpha, else a clear shift earlier or later. Cases: the record's 24 years; a year passes when its onset date on the second reading equals ours and the recomputed sentence says the same as the one shown (a different sentence fails every year)", reference: "DHM's official onset dates (the record itself)", independent: true, needs: "a second reading of DHM's table", verify_by: "DHM's own onset dates, read a second way.", years: [2001, 2024]}
      source: "Owner, 2026-11-15 (item 3): 'if the statement shown is \"no clear change since 2001, in Nepal's weather office records\", it comes straight from DHM's official onset dates: label its source as DHM and check the statement against them'. The sentence summarises DHM's own record, so what can be wrong is our copy of the 24 dates or our arithmetic: the copy is checked year by year, the arithmetic by a second implementation. The cross-checks (CHIRPS, GPM) stay on How we know and are no longer listed as its sources (labels.outputs.monsoon_shift). Claude's test, fixed before the first score (2026-11-15)"
    groundwater:
      value: {shown: "Water under the ground is falling", measure: "the regional trend's direction against well levels", reference: "none yet", independent: true, needs: "well-level records for the Kathmandu valley (Groundwater Resources Development Board)", verify_by: "Well levels measured in the valley by Nepal's groundwater office."}
      source: "Owner, 2026-11-14 (item 4)"
    part_soil_water:
      value: {shown: "How wet each part is today", measure: "the twin's soil water before a reading within 0.04 m3/m3 of the weighed or calibrated value", reference: "weighed soil samples or the calibrated probe at the field", independent: true, needs: "probe readings and weighed samples at the field", verify_by: "A probe walk on the real field.", tolerance_m3m3: 0.04}
      source: "0.04 m3/m3 is NASA SMAP's accuracy requirement (Entekhabi et al. 2010, Proc. IEEE 98:704, Table 1; in practice an unbiased RMSE over core validation sites at 9-40 km, mountains excluded: Reichle et al. 2016, IGARSS, NTRS 20170007932). Applied here to each reading, bias included: stricter than SMAP's own use"
    probe_water:
      value: {shown: "The soil probe's water reading", measure: "each push-in, calibrated on the other cups, within 0.04 m3/m3 (4 water-% points) of the weighed water", reference: "the team's weighed cups", independent: true, needs: "the team's cup test", verify_by: "The cup test: the probe in 6 cups of weighed water.", tolerance_m3m3: 0.04}
      source: "Owner, 2026-11-14 (item 1: the probe against weighed water within 0.04 m3/m3, NASA SMAP's accuracy requirement; Entekhabi et al. 2010, Table 1). Leave one cup out (rules.yaml probe.bench)"
    outlook_2040:
      value: {shown: "Harvest by 2040", measure: "cannot be checked before 2040; its climate change lies inside published CMIP6 ranges for Nepal (VALIDATION 4.7)", reference: "a consistency check only", independent: false, needs: "time", verify_by: "A projection: checked against published ranges only."}
      source: "Owner, 2026-11-14 (item 4: ESTIMATE, shown with its range)"
    plan_scores:
      value: {shown: "The water, cover and soil-kept scores", measure: "model indices with no measured counterpart", reference: "none", independent: false, needs: "measured water use and soil loss on the field", verify_by: "A season of Safe Trial, with the water used and the soil lost measured."}
      source: "Owner, 2026-11-14 (item 4)"
  rain_selection:                 # owner, 2026-11-14 afternoon, item 1. Written and committed BEFORE any comparison of 2026 months, and before the leave-one-gauge-out scores were computed
    gauges:
      value: ["Bhaktapur", "Changu Narayan", "Nagarkot", "Kathmandu Airport"]
      source: "Owner, 2026-11-14: 'Bhaktapur, Changu Narayan, Nagarkot and the airport'. Nagarkot sits on the valley rim at about 2,100 m, so it is expected to read wetter than the valley floor; it is kept because the owner named it"
    months:
      value: {selection: "every bulletin month from the first issue to 2025-12", test: "2026-01 to 2026-07 (locked)", min_gauge_mm: 10}
      source: "Owner, 2026-11-14 (months it never saw). A month whose gauge reads under 10 mm is listed, not scored (verification.outputs.rain_months). Claude's split, fixed before the run: the test months are the newest, a block in time"
    candidates:
      value: {published: "GPM IMERG as published (Final, else Late for days Final lacks)", corrected: "the break-corrected rain (gpm_series.correction; Late days scaled with the Final factors)", dhm_scaled: "GPM scaled month by month to DHM's Bhaktapur 1991-2020 normals (the current dry edge)", gauge_calibrated: "the corrected rain times one factor for June-September and one for the other months, each the ratio of sums gauge / corrected over the training gauges' selection months"}
      source: "Owner, 2026-11-14 ('our rain versions' and 'any monthly correction'). Two factors, not twelve: with about 30 selection months a factor per calendar month would rest on two or three months each (Claude's choice, fixed before the run). For 2026 the versions are built from IMERG fetched for 2026 the same way as the record"
    selection_score:
      value: "leave one gauge out over the selection months: for each of the four gauges, each candidate's share of that gauge's months within 19% of it (verification.outputs.rain_months.tolerance_rel), the gauge-calibrated factors fitted on the other three gauges only; pooled over the four gauges. Highest pooled share wins; a tie goes to the lower median absolute log ratio. The gauge-calibrated version is kept only if it beats the best of the other three"
      source: "Owner, 2026-11-14 ('testing on months and gauges it never saw'; keep a change only if it improves the held-out score). Claude's scoring rule, fixed before the run"
    test_score:
      value: "the winner, once, on the locked 2026 months at all four gauges (a gauge-calibrated winner refitted on all four gauges' selection months): share within 19%, n and 95% Wilson interval. Reported with every candidate's 2026 score beside it, for information. Nothing switches without the owner's go"
      source: "Owner, 2026-11-14 ('Show me the result before switching')"
    wettest_day:
      value: "where a bulletin gives a month's wettest day, each candidate's wettest day of that month against it, as a ratio; reported, not scored"
      source: "Owner, 2026-11-14 ('monthly totals and, where given, the wettest day'). Days differ by up to a day (DHM's day ends 08:45 local, IMERG's at 05:45 local); the month's maxima are compared, not dates"
  year_order:                     # owner, 2026-11-14 afternoon, item 2. Written and committed BEFORE any yearly comparison was computed
    data:
      value: "each year's June-September (monsoon) rain at the nearest DHM stations (Bhaktapur, Changu Narayan, Kathmandu Airport, Nagarkot), in mm or as % of normal, from DHM's yearly monsoon reports; our June-September totals of each rain version at the field"
      source: "Owner, 2026-11-14: 'from DHM's yearly monsoon reports, collect each year's monsoon rain at the nearest stations'"
    measure:
      value: "Spearman rank correlation between our yearly monsoon totals and the stations' (the mean of the stations' % of normal where at least two report, and each station alone), with a 95% bootstrap interval (validation_checks.common.correlation); holds up when the interval's lower bound is above 0. Also each year's class with DHM's own bands (below normal < 90%, near normal 90-110%, above normal > 110% of the record's mean for ours, of DHM's normal for the stations): the share of years in the same class. 2023 reported by itself: its rank and class in each"
      source: "Owner, 2026-11-14 ('check whether our wet and dry years come in the right order (rank correlation). Report 2023 specifically'). Bands: DHM, Preliminary Precipitation and Temperature Summary, Monsoon Season 2025, p. 2 ('less than 90% of normal ... below normal, 90 to 110% ... near normal, more than 110% ... above normal'). Claude's measure details, fixed before the run"

# ---------- The four features of the farmer's question (coordinator's brief, 2026-11-14): "What can I grow in my field's
# empty months without risking the harvest I depend on?" Built only from outputs we already have. Every block below was
# written and committed BEFORE its first run; nothing in it was tuned to config/known_events.yaml or to any check result.

labels:                           # feature 1: two labels on every number (pipeline/export/build_labels.py -> site/data/labels/<field>.json)
  sure:
    value: "'verified' only when the output's scorecard row (data/checks/<field>/scorecard.json from scripts/run_verification.py; a sample field takes its source field's, sample_of) has status VERIFIED; every other output is 'estimate', its status, k and n kept for the detail view. An output with no scorecard row (scorecard null) is NOT YET VERIFIABLE with k = n = 0: no yardstick exists for it yet. An output tied to several rows takes the weakest status (NOT YET VERIFIABLE < ESTIMATE < VERIFIED) and the sums of their k and n"
    source: "Coordinator's brief, 2026-11-14: 'sure is verified only when the scorecard status is VERIFIED. Everything else is estimate, with the status kept for detail'; verification.common.statuses. The no-row and several-rows readings are Claude's, fixed before the first run"
  scales:
    value: {field: {en: "Your field", ne: "तपाईंको खेत", about: "30 m or finer", below_m: 90}, neighbourhood: {en: "Around your field", ne: "तपाईंको खेत वरपर", about: "250 m to 1 km", below_m: 3000}, valley: {en: "Your valley", ne: "तपाईंको उपत्यका", about: "about 10 km", below_m: 22000}, region: {en: "Your wider region", ne: "तपाईंको फराकिलो क्षेत्र", about: "50 km or more"}}
    source: "Names and 'about' texts: coordinator's brief, 2026-11-14 (the Nepali is Claude's draft, not reviewed by a native speaker). The bounds between classes are Claude's choice, fixed before the first run: the geometric middle of neighbouring classes' typical sizes, sqrt(30 x 250) m = 87 m -> 90 m, sqrt(1 x 10) km = 3.2 km -> 3 km, sqrt(10 x 50) km = 22.4 km -> 22 km. A source's size is its grid cell, or the area a point record or index stands for"
  rule:
    value: "a number takes the coarsest scale among the inputs that mainly drive it (outputs.<id>.inputs); inputs it also rests on are listed (also) but do not set the scale. 'twin' stands for the twin's three inputs: its rain (gpm), weather (power) and soil (soilgrids). A total over an area takes the scale of the area it sums (area_box)"
    source: "Coordinator's brief, 2026-11-14 ('a number takes the coarsest scale among the inputs that mainly drive it'). The twin's inputs: CLAUDE.md 'Who supplies what to the twin'. The area rule is Claude's choice, fixed before the first run: a share of all the cropland in the 10 km fetch box describes the box, not one 30 m pixel"
  source_scales:
    value: {gpm: valley, power_corrected: valley, power: region, ghcn: valley, hls: field, modis: neighbourhood, soilgrids: neighbourhood, grace: region, nasadem: field, smap: valley, nexgddp: region, dhm_normals: valley, dhm_onset: region, dhm_bulletins: valley, chirps: valley, gpcc: region, crop_calendar: region, worldcover: field, probe: field, oni: region, area_box: valley, literature: region}
    source: "Each source's cell against the bounds above: GPM IMERG 0.1 deg (about 10 km); NASA POWER 0.5 x 0.625 deg (about 55 km) is 'power', but 'power_corrected' (valley) for a field whose temperatures are corrected to the Kathmandu Airport station (temperature_correction; the field config's correction_label), as the brief says; GHCN-Daily Kathmandu Airport, a point 7 km away standing for the valley floor; HLS 30 m; MODIS 250 m; SoilGrids 250 m (nearest cell 859 m away); GRACE's mascon about 300 km; NASADEM 30 m; SMAP L4 9 km; NEX-GDDP-CMIP6 0.25 deg (25-28 km here); DHM's Bhaktapur normals and bulletins, valley gauges within 10 km; DHM's onset dates, one date for the monsoon's entry into eastern Nepal; CHIRPS 0.05 deg (about 5 km), valley; GPCC's 1-degree box (about 100 km); the FAO crop calendar, Nepal Hill zone; WorldCover 10 m; the probe, a few cm of one part; NOAA's ONI, the Nino-3.4 region of the Pacific; the area map's fetch box, about 10 km. The brief's examples are kept (GPM valley, corrected POWER valley, HLS field, MODIS and SoilGrids neighbourhood, GRACE region, probe field). Claude's assignments for the rest, fixed before the first run"
  outputs:
    value:
      rain_months: {inputs: [gpm], also: [dhm_bulletins], scorecard: [rain_months], rain_corrected: true}
      rain_month_words: {inputs: [gpm], also: [], scorecard: [rain_month_words], rain_corrected: true}
      heat_month_words: {inputs: [power, ghcn], also: [], scorecard: [heat_month_words], rain_corrected: false}
      frost_month_words: {inputs: [power, ghcn], also: [], scorecard: [frost_month_words], rain_corrected: false}
      soil_month_words: {inputs: [twin], also: [], scorecard: [soil_month_words], rain_corrected: true}
      cover_months: {inputs: [hls], also: [], scorecard: [cover_months], rain_corrected: false}
      season_dates: {inputs: [hls], also: [crop_calendar], scorecard: [season_dates], rain_corrected: false}
      rotation_guess: {inputs: [hls], also: [crop_calendar], scorecard: [rotation_guess], rain_corrected: false}
      flood_years: {inputs: [gpm], also: [], scorecard: [flood_years], rain_corrected: true}
      drought_years: {inputs: [gpm], also: [], scorecard: [drought_years], rain_corrected: true}
      harvest_years: {inputs: [twin], also: [], scorecard: [harvest_years], rain_corrected: true}
      plan_cover_gap_beats_current: {inputs: [twin, nexgddp], also: [], scorecard: [plan_cover_gap_beats_current], rain_corrected: true}
      plan_safest_beats_current: {inputs: [twin, nexgddp], also: [], scorecard: [plan_safest_beats_current], rain_corrected: true}
