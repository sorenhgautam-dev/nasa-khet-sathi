      plan_cover: {inputs: [crop_calendar], also: [], scorecard: [plan_scores], rain_corrected: false}
      plan_soil_kept: {inputs: [gpm], also: [crop_calendar], scorecard: [plan_scores], rain_corrected: true}
      plan_gain: {inputs: [twin], also: [], scorecard: [plan_scores], rain_corrected: true}
      plan_tips: {inputs: [twin], also: [hls], scorecard: [plan_scores], rain_corrected: true}
      plan_months: {inputs: [crop_calendar], also: [], scorecard: [season_dates], rain_corrected: false}
      replay_year: {inputs: [twin], also: [], scorecard: [harvest_years], rain_corrected: true}
