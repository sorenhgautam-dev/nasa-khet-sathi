      part_status: {inputs: [twin], also: [], scorecard: [part_soil_water], rain_corrected: true}
      part_greener: {inputs: [hls], also: [], scorecard: null, rain_corrected: false}
      part_low_ground: {inputs: [nasadem], also: [], scorecard: null, rain_corrected: false}
      pulse_hls: {inputs: [hls], also: [], scorecard: null, rain_corrected: false}
      pulse_modis: {inputs: [modis], also: [], scorecard: null, rain_corrected: false}
      pulse_curve: {inputs: [hls, modis], also: [], scorecard: null, rain_corrected: false}
      pulse_seasons: {inputs: [hls, modis], also: [], scorecard: [season_dates], rain_corrected: false}
      pulse_typical: {inputs: [hls], also: [crop_calendar], scorecard: [season_dates], rain_corrected: false}
      nearby_fields: {inputs: [area_box], also: [hls, worldcover], scorecard: null, rain_corrected: false}
      replay_window: {inputs: [twin], also: [oni], scorecard: [harvest_years.replay_window], rain_corrected: true}
      checkup_rain: {inputs: [gpm], also: [dhm_bulletins, dhm_normals, chirps], scorecard: [rain_months], rain_corrected: true}
      checkup_break: {inputs: [gpm, chirps], also: [gpcc], scorecard: null, rain_corrected: false}
      rainrisk_harvest: {inputs: [gpm], also: [crop_calendar], scorecard: null, rain_corrected: true}      # 2026-11-14, rain_risk: no yardstick row yet, so estimate
      fertiliser_saver: {inputs: [literature], also: [], scorecard: null, rain_corrected: false}           # 2026-11-14, fertiliser_saver: a published range, not this field
      heatclock_today: {inputs: [power, ghcn], also: [crop_calendar], scorecard: null, rain_corrected: false}   # 2026-11-14, heat_clock: no yardstick row yet
      heatclock_2040: {inputs: [nexgddp], also: [crop_calendar], scorecard: null, rain_corrected: false}
    source: "Every number or data word the site shows (docs/TRACEABILITY.md, screen by screen, plus the four new features): the 19 rows of verification.outputs by their own ids, and the rest tied to the row that tests the same thing, as TRACEABILITY's Status column does (e.g. the replay's dry days to rain_months; the plan cards' water, cover and soil-kept to plan_scores). 'harvest_years.replay_window' is that row's farmer score of the 25-Year Replay (window_replay.farmer_scoring). rain_corrected: the number is computed from the twin's corrected rain (the watered harvest is not: watering keeps Ks at 1 whatever the rain). Claude's mapping, fixed before the first run"

window_replay:                    # feature 2: the 25-Year Replay (pipeline/plans/window.py; pipeline/export/build_replay.py -> site/data/replay/<field>.json)
  start:
    value: "the day after the twin's state day (data/clean/<field>/twin_state.json date; the demo's 2026-11-03 gives 2026-11-04), written in the file and fixed until the next export. A field with no twin state of its own (a sample field) takes its source field's (sample_of)"
    source: "Coordinator's brief, 2026-11-14: windows from a fixed start date written in the file (the site stays unchanged until January), e.g. the twin's state date. The twin's state is the soil at the end of its day, so the window starts the next day: Claude's choice, fixed before the first run"
  windows:
    value: {m3: 3, m6: 6}
    source: "Coordinator's brief: the next 3 months and the next 6 months. A window of m months ends the day before the same day m months later (2026-11-04 to 2027-02-03 and to 2027-05-03)"
  past_seasons:
    value: "every year Y in which the window, started on the start's month and day of Y, ends on or before the last day of the twin's record (weather.parquet, 2001-01-01 to 2025-12-31) and every crop it holds was sown on or after the record's first day: on the demo the 24 seasons 2001-02 to 2024-25. A season is named 'Y-(Y+1)' (two digits after the dash) and its year is the year its window ends (replay.year_of_season); the file carries year_count"
    source: "Coordinator's brief ('a Nov-May window gives about 24 past seasons. Put year_count in the file'); replay.year_of_season (owner-approved 2026-11-12)"
  plans:
    value: "each plan of site/data/fields/<field>.json (current, cover_gap, safest) and each current_options option, at its exported sowing days (crops[].start, MM-DD) in every past year, each crop for its crops.json season length (stages_days). The window holds every crop season that overlaps it; a crop sown before the start is in the ground on the first day at its own stage (its Kc curve counted from its sowing day) and is not sown again. season_dates and paddy_rainfed (both off today) are not applied: the calendar days are the coming season's plan"
    source: "Coordinator's brief: 'each of the three exported plans ... plus current_options gets its coming season run through every past season'. The in-ground reading is Claude's, fixed before the first run: the plans' winter crops are sown 15-30 October by the FAO calendar, before a November start"
  twin:
    value: "the existing twin day by day over the window only, rain-fed: the FAO-56 bucket (twin/soil_water.run_bucket) with season.simulate's segments, TAW (the crop's Zr; a bare spell the next crop's, else the last one's), table p, curve numbers (curve_numbers), Kc curves (each crop's Kc mid and end adjusted for its whole season's own climate, kc_climate), bare-soil surface layer (bare_soil; De starts at TEW x Dr / TAW) and a paddy's losses (paddy_losses); depletion handed between segments as a fraction of TAW (season.carry_over). The window's first day starts from the chosen start's depletion"
    source: "Coordinator's brief: 'use the existing twin (pipeline/twin/*, pipeline/plans/simulate.py, twin_options.py; FAO-56 bucket and FAO-33 harvest)'. tests/test_window.py checks that a window run gives season.simulate's days to rounding"
  rain:
    value: "the twin's central rain (weather.parquet rain_mm: break-corrected and gauge-tuned, gpm_series.gauge_calibration); every square is also run on the other rain versions untuned, dhm and uncorrected (pipeline/twin/inputs.with_rain with scripts/common.rain_kw) and their result and score are written beside it"
    source: "Coordinator's brief: 'with the central rain (the tuned version, now the main one)'; 'also record the result under the other rain versions (dhm, untuned, uncorrected)'"
  water_case:
    value: "rain-fed only: the risk case. The file says that watering removes the dry stress: in the twin's watered case a crop is refilled whenever Dr passes RAW, so every crop day starts at or below RAW, Ks is 1 (FAO-56 eq. 84) and the score below is 100"
    source: "Coordinator's brief: 'Rain-fed is the risk case; say in the file that watering removes dry stress'; CLAUDE.md (irrigation refills when Dr > RAW); twin/soil_water.run_bucket"
  starts:
    value: {wet: {depletion_fraction: "0", probe_band: "too wet"}, medium: {depletion_fraction: "p / 2", probe_band: "good"}, dry: {depletion_fraction: "(1 + p) / 2", probe_band: "needs water"}}
    source: "Coordinator's brief: precompute dry, medium and wet starts and let the probe's band (probe.band) pick one. probe.band: 'needs water' below theta_fc - p (theta_fc - theta_wp), 'good' from there to field capacity, 'too wet' above field capacity, p = crops.json p of the crop in the ground on the twin state's day. In depletion (FAO-56 eqs. 82-84) 'good' is 0 <= Dr/TAW <= p and 'needs water' p < Dr/TAW <= 1. Each start is the middle of its band; 'too wet' starts at field capacity, the wettest the bucket holds (eq. 88 drains the rest the same day). p: the current plan's crop in the ground on the start day (the next crop's when the ground is bare, as season.simulate uses for a bare spell), as the probe's band uses; the same fraction of TAW starts every plan (the same water in the soil). Claude's choice, fixed before the first run"
  start_default:
    value: "before any probe reading: the start whose band holds the twin's own state (twin_state.json dr_mm / taw_mm, against the same p). A field with no twin state of its own: medium"
    source: "Coordinator's brief: 'which start is the default before any probe reading (the twin's own state today)'. The fallback is Claude's choice, fixed before the first run: the middle of the 'good' band, the band the probe cannot rule out without a reading"
  score:
    value: "the water need met over the window's crop days: 100 x sum(ETa) / sum(ETc) over every crop day in the window (all crops pooled; bare days do not count), rounded to a whole number; null when no crop grows in the window. This is FEWS NET's Water Requirement Satisfaction Index (WRSI), taken over the window rather than a whole season"
    source: "WRSI = actual over required crop evapotranspiration, 100 = no yield loss from water shortage (Frere & Popov 1979, FAO Plant Production and Protection Paper 17; USGS FEWS NET WRSI readme, iridl.ldeo.columbia.edu/documentation/usgs/adds/wrsi/WRSI_readme.pdf, found by a web search 2026-11-14, not opened). Over the window instead of the season: Claude's choice, fixed before the first run, because a window may end before harvest, where FAO-33's seasonal harvest formula does not apply"
  classes:
    value: {worked_min: 80, failed_below: 50}
    source: "SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 11): the failure bound is confirmed: FEWS NET's product page (https://earlywarning.usgs.gov/fews/product/890) says 'less than 50 is regarded as a crop failure condition (Smith, 1992)' (Smith 1992, FAO Publication 73). The other bands, and so the 80 cut for 'worked', could not be opened (the USGS readme needs an IRI sign-in): the 80 cut is unsourced, Claude's grouping, values unchanged. As first written: FEWS NET WRSI classes: below 50 failure, 50-60 poor, 60-80 mediocre, 80-95 average, 95-99 good, 99-100 very good (World Bank Data Catalog, 'Gridded dekadal Water Requirement Satisfaction Index (WRSI) for Africa', metadata of 2025-06-24, read in a web-search summary 2026-11-14, not opened); 'a WRSI below 50 is regarded as a crop failure condition (Smith 1992)' (the USGS WRSI readme, as the same search summarised it). Grouped by Claude, fixed before the first run: worked = average or better (80 or more), struggled = poor or mediocre (50 to under 80), failed = failure (under 50)"
  reason:
    value: "the longest run of consecutive dry crop days in the window (Ks < 1): {code: dry_spell, month: the run's first day's month MM, days: its length}, the earliest of equal runs; with no dry crop day {code: no_dry_days}; with no crop in the window {code: no_crop_in_window}"
    source: "CLAUDE.md: 'A dry day is a day with Ks < 1 during a crop season'. The longest run as the reason is Claude's choice, fixed before the first run; the UI renders the words from the code"
  sensitive:
    value: "a square is sensitive when its result word under any of the other rain versions differs from the central one"
    source: "Coordinator's brief: 'Mark a square sensitive when they differ'"
  enso:
    value: {threshold_c: 0.5, season_now: "the latest 3-month season in NOAA's ONI table that ends before the start's month (start 2026-11-04: ASO 2026)", season_past: "the same 3-month season of the year each past season starts (ASO of Y for season Y-(Y+1))", states: "el_nino when the ONI is +0.5 C or more, la_nina when -0.5 C or less, else neutral"}
    source: "SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 12): the +/-0.5 C threshold is NOAA's; the 5-overlapping-seasons rule is for classifying past episodes; since 1 February 2026 NOAA's official index is the relative ONI (RONI), so this is the legacy ONI table, still updated, and every output says 'ONI (NOAA's older index)'. NOAA CPC Oceanic Nino Index (ONI), https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt (US government, public domain): 3-month running means of ERSST.v5 sea-surface temperature anomalies in the Nino 3.4 region; NOAA marks warm and cold periods with a threshold of +/- 0.5 C (CPC's ONI page; cited from memory, not opened 2026-11-14). One season's value, not NOAA's full episode (the threshold met for 5 consecutive overlapping seasons): the state known at the start. The season choice is Claude's, fixed before the first run"
  farmer_scoring:
    value: "once the farmer's locked years exist (data/field_visit/<field>/farmer_years.csv), the current plan's m6 results from the default start are scored with verify.year_matches on the score (worst years in the lowest third, best in the highest third, average ranks for ties), over the farmer's rows whose crop grows in that window; a named year is the year the window ends. Written into the scorecard row harvest_years as replay_window (k, n, status by verification.common); NOT YET VERIFIABLE until then"
    source: "Coordinator's brief (owner's D3: the farmer's three best and three worst years are locked test data; 'the Replay's results against the best and worst years'); the thirds as verification.outputs.harvest_years, fixed before any answer exists"

pulse:                            # feature 3: Field Pulse, खेतको नाडी (pipeline/export/build_pulse.py -> site/data/pulse/<field>.json)
  points:
    value: "the observations the diary's own series uses (scripts/run_diary.py run_greenness, data/clean/<field>/greenness_field.parquet): HLS images that pass greenness.min_clear_fraction from the first clear HLS day (greenness.hls_from), MODIS composites before it; NDVI rounded to 3 decimals. HLS points are labelled field scale, MODIS points neighbourhood scale"
    source: "Coordinator's brief, 2026-11-14 ('use the diary's own cloud-masked series'; 'round NDVI to 3 decimals'); labels.source_scales"
  curve:
    value: {step_days: 7, from: "the diary's smoothed curve (data/clean/<field>/seasons_daily.parquet ndvi_smooth, the chosen season method's input), every 7th day from its first day, NDVI to 3 decimals, with the day's source"}
    source: "Coordinator's brief ('thin the curve to about weekly')"
  seasons:
    value: "every season of the chosen method (data/checks/<field>/diary_seasons.json chosen.seasons_by_year): its year (the key), slot (rotation_guess slots by peak month: monsoon June-November, winter December-May), source, green-up (the method's start), peak, end and peak NDVI"
    source: "Coordinator's brief ('the seasons per year (green-up, peak, harvest)'); season_detection; pipeline/diary/guess.py SLOTS"
  typical:
    value: "per slot, over the HLS seasons only (season_dates.seasons): green-up, peak and harvest (the season's end) = the median over the years of each date counted in days from 1 January of the season's year (earlier dates negative), written MM-DD in a 365-day year; planting = green-up minus the slot's guessed crop's initial stage (diary.guess; crops.json stages_days.ini), as season_dates.sowing reads the threshold method's start. The farmer confirms or corrects them on the phone"
    source: "Coordinator's brief ('the typical planting and harvest dates the farmer can confirm or correct'); season_dates.sowing (FAO-56 ch. 6: the initial stage runs from planting to about 10% ground cover). The median over years is Claude's choice, fixed before the first run"
  nearby:
    value: "totals only, copied from the field's own area map (data/checks/<field>/area_map.json: cropland area and the three numbers with their low and high; the map file site/data/area/<field>.json): only the demo has one; any other field gets null. This field's own diary values sit beside them"
    source: "Coordinator's brief ('nearby: totals only, from the area map ... demo only; other fields get null')"
  farmer_scoring:
    value: "once the farmer's locked dates exist (data/field_visit/<field>/farmer_dates.csv: crop, year, planted, harvested), each row is matched with the Pulse's HLS season of the same slot (the slot of the middle day between planted and harvested) and year (the year the crop is harvested): planted against the season's planting (green-up minus the crop's initial stage), harvested against its end; a date passes within verification.outputs.season_dates.tolerance_days (10 days, one dekad); a missing season fails. Written into the scorecard row season_dates (k, n, status by verification.common); NOT YET VERIFIABLE until then"
    source: "Coordinator's brief: 'Field Pulse season dates within one dekad (+-10 days)'; verification.outputs.season_dates (fixed before any answer exists); the slot as season_dates.match. Claude's matching, fixed before the first run"

checkup:                          # feature 4: Data Check-up (pipeline/export/build_checkup.py -> site/data/checkup/<field>.json)
  contents:
    value: "how this field's rain record was checked, worded as a check, not a fault: the field's own break test (data/checks/<field>/break_test.json, gpm_series.break_test) for every field; and where the field's own run has them, the rest of rain check B's evidence: the gauge weight's monthly range before the break year and the range of its yearly means after (data/clean/<field>/gauge_evidence.parquet, break_test.json), GPCC stations, Pettitt on GPM / CHIRPS and on CHIRPS alone with their steps, the IMERG Late check (rain_check_b.json late_check), Pettitt on GPM's yearly totals, DHM's Bhaktapur normal against GPM before and after the break and against the twin's central rain; the correction applied (data/cards/<field>/weather.json corrections.rain_break; gpm_series.gauge_calibration); the rain versions' mean yearly rain over the record's complete years; and one chart's yearly series (GPM as published, the twin's central rain, CHIRPS v3.0). evidence_level 'full' when the field has the gauge evidence, the Late check and DHM normals; else 'own_break_test'"
    source: "Coordinator's brief, 2026-11-14. Nothing new is computed beyond yearly sums and means of the existing tables"
  depends_on_corrected_rain:
    value: "the output ids whose labels.outputs entry has rain_corrected true"
    source: "Coordinator's brief; labels.outputs (fixed above)"


rain_risk:                        # item 1 (owner's brief, 2026-11-14): heavy rain in each plan crop's harvest weeks (pipeline/plans/risk.py; pipeline/export/build_risks.py --kind rainrisk -> site/data/rainrisk/<field>.json). Written and committed BEFORE its first run.
  heavy_rain_mm:
    value: {threshold: 50, inclusive: true}
    source: "SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 1): DHM Meteorological Forecasting Division, 'Terms used in Weather Forecasting in Nepal' (dhm.gov.np/mfd/api/image/forecast-terminology/, one-page PDF): heavy rain is '50 mm or more but less than 100 mm' in 24 h; very heavy '100 mm or more but less than 200 mm'; extremely heavy '200 mm or more'. Every lower bound is inclusive, so 'a heavy-rain day' here is a day of 50 mm or more: heavy or above. The page does not say which 24 hours"
  day:
    value: "the twin's rain day: the IMERG day, a UTC day, 05:45 to 05:45 Nepal time (IMERG V07 Technical Documentation, 13 July 2023, p. 40; CLAUDE.md). DHM's page names no clock hours for its 24 h, so our days and DHM's may not be the same 24 hours: said in the file's Why? text"
    source: "CLAUDE.md 'Who supplies what to the twin' (IMERG days are UTC days); owner's brief: 'IMERG days are UTC days: say so in Why?'"
  harvest_window:
    value: "each crop's FAO-56 late-season stage: the last stages_days.late days of its season (config/crops.json: rice 22, wheat 35, potato 30, lentil 31 days), ending on the crop's last day as the plan exports it (fields/<field>.json crops[].end, MM-DD). The window's first day is end - (late - 1) days, counted in a 365-day year; the same MM-DD dates are used in every year (a leap year can shift the real season by one day: not modelled)"
    source: "Owner's brief, 2026-11-14 ('the crop's FAO-56 late-season stage from config/crops.json is the natural choice'). FAO-56 (Allen et al. 1998), Chapter 6, 'Length of growth stages' (https://www.fao.org/4/x0490e/x0490e0b.htm, opened 2026-11-14): 'The end of the mid-season and beginning of the late season is usually marked by senescence of leaves'; the late season ends with Kc end at harvest. The stage lengths: crops.json stages_days (FAO-56 Table 11, scaled to the local season; owner-approved 2026-11-12). A wording 'from the start of maturity to harvest' was looked for on that page and not found, so it is not quoted"
  years:
    value: "the harvest years 2002-2025 (24): a year is the year the window ends; every window of those years lies inside the twin's record (weather.parquet, 2001-01-01 to 2025-12-31). The same complete years as the replay (CLAUDE.md: only complete years are exported, 2002-2025)"
    source: "Owner's brief ('from our 2002-2025 rain ... the years with a heavy-rain day ... in the crop's harvest window. Show them as squares, one per year'); CLAUDE.md output contract (complete years)"
  plans:
    value: "every plan of site/data/fields/<field>.json and every current_options option, each of its crops at its exported sowing and end days"
    source: "Owner's brief ('for each plan's crops (site/data/fields/<id>.json plans and current_options)')"
  rain:
    value: "the squares use the twin's central rain (weather.parquet rain_mm: break-corrected and gauge-tuned). The same count is made on the other rain versions untuned, dhm and uncorrected (pipeline/twin/inputs.with_rain with scripts/common.rain_kw, as the replay builds them); the range shown in Why? is the lowest and highest count over the four"
    source: "Owner's brief ('Give the count under the other rain versions too (dhm, untuned, uncorrected) ... shown as a range in Why?')"
  count:
    value: "per crop and version: the number of harvest years with at least one heavy-rain day in the window; per year: the number of heavy-rain days and the largest day (mm, 1 decimal). No probability, no trend, no future: counts of past years only"
    source: "Owner's brief (example line 'Heavy rain at harvest: 5 of 24 years'). Claude's wording of the per-year detail, fixed before the first run"
  words:
    value: "a crop with no heavy-rain year in its harvest weeks (central rain) is said as good news: 'None in these years. Good news.'; every screen says these are past years, not a forecast"
    source: "Owner's brief ('Near-zero counts are good news: say so in plain words', item 4; applied here too). Claude's wording, fixed before the first run"
  dry_spells:
    value: "per plan crop (rain_risk.plans) and harvest year (rain_risk.years): the longest run of consecutive days with rain under trends.dry_day_mm (1 mm) from the crop's sowing day to its last day (crops[].start to end, MM-DD, the same every year; a run is cut at both ends), on the twin's central rain; the same on the other three rain versions (rain_risk.rain) for the range in Why?. Shown simply: the typical year (the median over the 24 years, rounded half up to whole days) and the worst years (the three longest runs with their years; ties: the later year first). No fixed spell length and no squares of 'dry years'"
    source: "Owner's answer 1, 2026-11-14 evening: 'use the weather office's own measure, the longest run of dry days (under 1 mm) after sowing, shown simply (typical years and the worst years), sourced to DHM'. SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 2a, 2b): DHM, Update of Climate Change Study of Nepal (2024), Table 6 p.16: CDD, the maximum run of days with RR < 1 mm (no 8-day rule). Conditions said in Why?: DHM counts CDD per calendar year, here it is counted per crop season from sowing (our adaptation); our days are IMERG UTC days. Until this answer the dry spells were left out (owner's brief); the rounding and 'three worst' are Claude's, fixed before the first run"
  label:
    value: "labels.outputs.rainrisk_harvest: GPM rain drives it (valley), no scorecard row yet (estimate), made from the corrected rain (the rain mark)"
    source: "Owner's brief: 'add an entry for each new output, with its scale and scorecard row (none yet = estimate)'"

fertiliser_saver:                 # item 2 (owner's brief, 2026-11-14): the next crop after lentil on the "Feed your soil" plan (pipeline/plans/risk.py; build_risks.py --kind fertiliser -> site/data/fertiliser/<field>.json). Written and committed BEFORE its first run.
  plan:
    value: "the plan with id safest ('Feed your soil') when one of its crops is a legume (crops.json legume: true; lentil on every prepared field); the next crop is the plan's crop that follows the legume in the rotation (rice, the next monsoon). Any other field gets applies: false and no numbers"
    source: "Owner's brief, 2026-11-14 ('FERTILISER SAVER, on the Feed your soil plan (plan id safest, rice then lentil)')"
  carry_over_kg_n_ha:
    value: [23, 45]
    source: "SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 4a): Mamindla Nagaraju, 'Drought management through foliar application and balance supply of nutrients in lentil (Lens culinaris Medic.)', M.Sc. (Ag) Agronomy thesis, Banaras Hindu University, Varanasi, 2017, Introduction p.2 (PDF p.13): 'The carry-over of N from lentil is low at 23–45 kg N ha-1', citing Quinn, M.A. (2009), 'Biological nitrogen fixation and soil health improvement', in Erskine et al. (eds), The Lentil: Botany, Production and Uses, pp. 229-247 (not opened). Conditions stated in every output: both ends come from this one sentence; 'carry-over' is not defined (residue N, soil N or an N credit is not said); no country or conditions; a secondary citation; a wide, uncertain range"
  measured_uptake_kg_n_ha:
    value: 2.3
    source: "SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 4b): S.P. Mooleki, A.E. Slinkard and C. van Kessel, 'Nitrogen and non-nitrogen benefits of lentil in the succeeding wheat crop', University of Saskatchewan, pp. 292-300, p.297: 'Only 2.3 kg N ha-1 was recovered in the subsequent wheat crop. [...] it represented 14.6% of the 15.8 kg N ha-1 supplied by the lentil residue.' Dinsmore, Saskatchewan, Canada; shown in Why? as the one field measurement, far below the range"
  urea_n_share:
    value: 0.466
    source: "SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 10b), computed from the formula CO(NH2)2 = CH4N2O with IUPAC CIAAW 'Abridged Standard Atomic Weights 2024' (H 1.0080, C 12.011, N 14.007, O 15.999): N 2 x 14.007 = 28.014 g/mol; molar mass 12.011 + 15.999 + 28.014 + 4 x 1.0080 = 60.056 g/mol; share 28.014 / 60.056 = 0.4665, used as 46.6 % (0.466), as the owner's brief says ('23/0.466 to 45/0.466'). Commercial urea is sold as 46 % N (SOURCES_CHECK 10b); the arithmetic is shown in Why?"
  bag_kg:
    value: 50
    source: "SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 6): BankingNews, 16 July 2026, 'Rs. 847 per 50 kg bag of urea'; The Kathmandu Post, 26 May 2026, 'Rs894.50 per 50-kg sack of urea'. Both say 50 kg"
  arithmetic:
    value: "urea_saved_kg_ha = carry_over / urea_n_share, low and high, rounded to whole kg; bags_ha = urea_saved_kg_ha (unrounded) / bag_kg, rounded to 1 decimal for Why? and to whole bags for the main line. Per hectare only"
    source: "Owner's brief ('urea saved is 23/0.466 to 45/0.466 kg per hectare. Bags are 50 kg ... Show kg and bags as a range, per hectare only'). The rounding is Claude's, fixed before the first run"
  area:
    value: "per hectare only; no ropani figure until a ropani-to-square-metre conversion is opened in a government or academic source. Why? says so"
    source: "SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 10a): NOT FOUND (the National Statistics Office site was unreachable twice). Owner's brief: 'Say in Why? that a ropani figure waits for a source'"
  context:
    value: "one line: fertiliser can be short when paddy planting begins (the next crop after lentil is rice, planted in the monsoon). Conditions said in Why?: the districts quoted are in the Terai and inner Terai, not Bhaktapur"
    source: "SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 5): 'Farmers scramble for fertiliser as paddy planting season begins amid shortages', The Kathmandu Post, Post National Bureau, 26 May 2026: 'Farmers say they have suffered for years from shortages of fertiliser, seeds and irrigation facilities during the paddy planting season.'"
  check_tab:
    value: "the safest plan's 'check locally' tab adds: dhaincha grown before rice, in the NARC booklet's own words ('a popular green-manuring crop for rice'; nitrogen gain 'equivalent to 50-100 kg of fertilizer N', citing Lacsina et al. 1987; no 'per hectare' is added, the booklet prints none), then 'ask the local agriculture office whether it fits'. No claim that it fits this field (pipeline/words/tabs.json, condition plan_is_safest)"
    source: "SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 3): Bishnu H. Adhikary, 'Green-Manuring for Increased Crop Production', Nepal Agricultural Research Council (NARC), Communication, Publication and Documentation Division, Khumaltar, NARC Publication Serial No. 0042-2013/14, January 2014, hosted by the Directorate of Agriculture Development, Lumbini: https://doad.lumbini.gov.np/media/publications/Green_Manuring_booklet.pdf (PDF p.5: 'Dhaincha is a popular green-manuring crop for rice and it is reported that nitrogen gain by green manured Dhaincha is equivalent to 50-100 kg of fertilizer N (Lacsina et al., 1987).'). Owner's brief: 'Then: ask the local agriculture office whether it fits. No claim that it fits'"
  label:
    value: "labels.outputs.fertiliser_saver: input 'literature' (labels.source_scales literature: region, the coarsest class, because the range comes from studies elsewhere, not from this field or valley); no scorecard row (estimate)"
    source: "Owner's brief ('the two labels on every number'; 'none yet = estimate'). The 'literature' source and its scale are Claude's choice, fixed before the first run"

heat_clock:                       # item 4 (owner's brief, 2026-11-14): heat and cold at the sensitive times of wheat and potato (pipeline/plans/risk.py; build_risks.py --kind heatclock -> site/data/heatclock/<field>.json). Written and committed BEFORE its first run.
  crops:
    value: "wheat and potato only, wherever a plan or current option grows them (each sowing day once). Rice and lentil are left out: no threshold for them is confirmed in notes/SOURCES_CHECK.md. Wheat flowering ('pollen damage outside 8-35 C') is left out: that sentence is FAO-66's rice chapter (p.106), verdict DIFFERENT (SOURCES_CHECK 7a)"
    source: "Owner's brief, 2026-11-14 ('wheat and potato only (rice and lentil left out)'; 'DON'T use wheat pollen damage outside 8-35 C')"
  wheat_grain_filling_heat:
    value: {temperature: tmax_c, above_c: 34, inclusive: false}
    source: "SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 7b): FAO Irrigation and Drainage Paper 66, Crop yield response to water (2012), wheat, p.98: 'Temperatures above 34 oC are possible in most wheat-growing regions during grain filling. Such temperatures accelerate senescence and can cause significant reduction in grain yield through reduced grain size'. Conditions said in Why?: worded as what is possible, not a tested threshold; the kind of daily temperature is not stated. Our reading, stated: the daily maximum (heat uses the daily maximum), strictly above 34 C ('above')"
  wheat_window:
    value: "the FAO-56 late-season stage of crops.json (wheat stages_days.late = 35 days), ending on the crop's last day as the plan exports it: the grain-filling window. Same MM-DD dates every year, as rain_risk.harvest_window"
    source: "Owner's brief ('FAO-66's wheat stage days if SOURCES_CHECK has them, else FAO-56 stage lengths in crops.json: say which'). SOURCES_CHECK 7 (stage timing): FAO-66 Table 1, p.95, row India gives sowing to anthesis '70-103' days and to maturity '85-145' days, and 'FAO-66 gives no separate grain-filling length'. So FAO-56 stage lengths in crops.json are used. Our 140-day wheat's late stage is days 106-140 after sowing: after FAO-66's latest anthesis (day 103) and before its latest maturity (day 145), so it lies inside grain filling but may miss its first days. Claude's reading, fixed before the first run"
  potato_cold:
    value: {temperature: tmin_frost_c, at_or_below_c: 1, inclusive: true}
    source: "SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 7c): FAO-66 potato, p.187: 'The temperature for frost or cold stress for potato is considered 1 oC and less, whereas that of heat stress is 35 oC or higher. However, potato cultivars vary in their tolerance to frost, cold and heat stress, and the extent of damage depends on stress intensity and duration.' Conditions: no crop stage, no daily max/min stated. Our reading, stated: the daily minimum (cold uses the daily minimum), 1 C or less. Today's nights are the twin's frost temperatures (weather.parquet tmin_frost_c, quantile-mapped to Kathmandu Airport), which count too many cold nights (held-out check: 15 nights below 2 C where the station had 9; CLAUDE.md 'Cold nights', REVIEW_NOTES M8): labelled in the file and on the screen"
  potato_heat:
    value: {temperature: tmax_c, at_or_above_c: 35, inclusive: true}
    source: "SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 7d): the same FAO-66 p.187 sentence ('35 oC or higher'). Our reading: the daily maximum"
  potato_window:
    value: "the potato's whole season, sowing day to last day (crops.json stages_days, 115 days), since FAO-66 names no stage"
    source: "Owner's brief ('potato uses its whole season, since no stage is given')"
  wheat_floret_heat:
    value: {temperature: tmax_c, above_c: 30, inclusive: false}
    source: "Owner's answer 2, 2026-11-14 evening ('use FAO's wheat-book numbers (above 30 C at floret formation ...), labelled estimate'). SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 7a), re-opened 2026-11-14 evening: E. Acevedo, P. Silva and H. Silva, 'Wheat growth and physiology', in Curtis, Rajaram and Gomez Macpherson (eds), Bread Wheat: Improvement and Production, FAO Plant Production and Protection Series No. 30, 2002 (https://www.fao.org/4/Y4011e/y4011e06.htm): 'Temperatures above 30°C during floret formation cause complete sterility (Owen, 1971; Saini and Aspinal, 1982).' Conditions: the kind of daily temperature is not stated; our reading, as heat_clock's other heat checks: the daily maximum, strictly above 30 C. Labelled estimate"
  wheat_floret_window:
    value: {from_days_after_sowing: 20, to_days_after_sowing: 100}
    source: "The same chapter, Table 3.1 ('Days from emergence to physiological maturity in a spring and winter wheat', spring type Yecora, adapted from Stapper and Fischer 1990): floral initiation (double ridge) 20, terminal spikelet 45, first node 60, heading 90, anthesis 100, physiological maturity 140. The text: after double ridge 'The glume and lemma primordium stages follow. The floret primordia are found in the axil of each lemma'; GS2 runs 'from double ridge to anthesis'. The end of floret formation is not given, so the whole of GS2 (days 20 to 100) is used. Our readings, stated in Why?: the table counts from emergence and we count from the sowing day (day 0; FAO-66 Table 1 India: emergence about 4 days after sowing); the table's 140-day cycle is used as it is because crops.json wheat is 140 days; the MM-DD dates are counted in a 365-day year, the same every year (as wheat_window)"
  wheat_flower_frost:
    value: {temperature: tmin_frost_c, below_c: 0, inclusive: false}
    source: "Owner's answer 2, 2026-11-14 evening ('frost below 0 C around flowering ... with the frost caveat for our cold-night temperatures'). SOURCES CHECKED 2026-11-14 (notes/SOURCES_CHECK.md 7a), the same chapter: 'Frost can be particularly damaging between flag leaf emergence and ten days after anthesis [...] The damage during this period occurs at minimum screen temperatures below 0°C'. Our nights are the twin's frost temperatures (tmin_frost_c), which count too many cold nights against Kathmandu Airport (potato_cold), while Bhaktapur's own winter nights are 1.0-1.5 C colder than the twin's (VALIDATION 3.11b, DHM normals): both said in Why?. Labelled estimate"
  wheat_flower_window:
    value: {from_days_after_sowing: 90, to_days_after_sowing: 110}
    source: "Table 3.1 above: heading 90, anthesis 100; the text: 'ten days after anthesis' = day 110. Flag leaf emergence is not in the table; heading, which follows it, is used as the start, so the window may start a little late (said in Why?). Days from the sowing day, as wheat_floret_window"
  wheat_book_checks:
    value: "the two wheat-book checks run like the others (today and around_2040, the same words rule; each wheat sowing day once); their file rows say 'estimate' and carry the conditions above"
    source: "Owner's answer 2, 2026-11-14 evening. Until this answer they were left out (crops, above)"
  today:
    value: "the harvest years 2002-2025 (24; a season's year is the year its window ends), from weather.parquet: tmax_c (POWER corrected to Kathmandu Airport by the monthly offset, temperature_correction) for heat, tmin_frost_c for potato cold. Per year: the number of risky days in the window; per check: the years with at least one, and the mean days per season"
    source: "Owner's brief ('today: our 2002-2025 daily weather. Potato cold uses our frost temperatures, tmin_frost_c in weather.parquet, which overcount cold nights; label it'); rain_risk.years"
  around_2040:
    value: "data/clean/<field>/nexgddp_daily.parquet (NEX-GDDP-CMIP6, 23 models, one 0.25 deg cell; historical 1995-2014, ssp245 and ssp585 2026-2040): tasmax_c for heat, tasmin_c for cold, used as the models give them (not corrected to the station). The window is taken by month and day in each model's own calendar (360-day, 365-day or Gregorian); a season counts when its whole window lies in the period (a window that crosses 1 January needs both years). Per model and period: the mean risky days per complete season. Per scenario: the median over models of the 2026-2040 mean, its lowest and highest model, the median of the models' own 1995-2014 means, and every model's own pair (1995-2014 beside 2026-2040), the like-for-like comparison. A field with no series of its own (a sample field) uses its source field's (sample_of) when both lie in the same 0.25 deg cell (cell centres at 0.125 + 0.25 k deg), else none"
    source: "Owner's brief ('around 2040: the daily NEX-GDDP series on disk ... Report the median and the model range. For a like-for-like comparison, also give each model's own 1995-2014 count beside its 2026-2040 count'). The calendar handling, the complete-season rule and the sample rule are Claude's, fixed before the first run"
  words:
    value: "near-zero counts are said as good news in plain words: today, a check with no year holding a risky day ('None in these years. Good news.'); around 2040, a check whose every model's 2026-2040 mean is below 1 day a season in both scenarios ('Still rare around 2040. Good news.'). The cold count carries 'Our cold nights may be too many.'"
    source: "Owner's brief ('Near-zero counts are good news: say so in plain words')"
  label:
    value: "labels.outputs.heatclock_today (POWER corrected to the station: valley; estimate) and heatclock_2040 (NEX-GDDP: region; estimate)"
    source: "Owner's brief: 'add an entry for each new output, with its scale and scorecard row (none yet = estimate)'"

simple_cards:                     # owner, 2026-11-14 evening: the three farmer cards (pipeline/export/build_simple.py -> site/data/simple/<field>.json)
  replay_window:
    value: m6
    source: "Owner: '[Crop] this winter: better than what you grow now'. The Replay's 6-month window (to early May) holds every winter crop's whole season in the plans (potato to 21 Feb, wheat to 3 Mar or 3 Apr, lentil to 24 Feb). Claude's choice, fixed before the first run"
  start:
    value: start_default
    source: "The Replay's own default start (window_replay; the twin's state, medium before any probe reading); the card has no controls (owner)"
  compare:
    value: {score: "each past winter's Replay score (water need met over the window's crop days, WRSI)", better_by: 10, worse_by: 10}
    source: "Owner: 'with the threshold for better/same/worse fixed in rules.yaml before running'. Better = the suggested crop's score at least 10 points above the farmer's own winter crop's in the same past winter; worse = at least 10 points below; same otherwise. 10 points is Claude's choice, unsourced (half the width of the WRSI 'mediocre' class 60-80 named in window_replay.classes, whose bands other than the failure bound could not be opened). Fixed before the first run, without looking at the comparisons"
  per_ten:
    value: "largest remainder: 10 x count / winters, floored; the leftover faces go to the largest remainders (ties: better, then same, then worse)"
    source: "Owner: 'scaled from our 24 winters to about X of every 10 winters, rounded'; the faces must add up to 10, so the largest-remainder (Hamilton) rounding. Claude's choice"
  verdict:
    value: "better when better winters are at least half of all winters and outnumber the worse ones; worse when worse winters are at least half and outnumber the better ones; same when same winters are at least half; otherwise mixed"
    source: "Owner: 'If it's worse or mixed, say so just as plainly.' Claude's choice, fixed before the first run"
  suggestion:
    value: "the suggested plan (cover_gap or safest, never current) whose winter crop differs from the farmer's answer and has the most (better minus worse) winters; ties: fewer worse winters, then the plans' order"
    source: "Claude's choice, fixed before the first run: the card names one crop ('[Crop] this winter'), the one that does best against the farmer's own crop"
  watering:
    value: "an answer of 'yes, I can water' compares every winter as 'same': the twin's watered case meets every crop's water need (window_replay watering), so water cannot tell the crops apart; the card says so plainly"
    source: "The twin is a water model (CLAUDE.md: the bucket, Ks, FAO-33 harvest); it has no heat, pest, price or labour effects"
  winter_answers:
    value: "the winter crops of the field's current_options (demo: potato, wheat), each compared through its Replay plan (rice_potato, rice_wheat)"
    source: "Owner: 'What do you grow in winter?' asked once and kept on the phone; current_options (owner, 2026-11-13)"

weather_ahead:                    # owner, 2026-11-14 evening: the team's weather spec, approved with four changes ("Weather ahead", the third choice on Choose). pipeline/diary/weather_ahead.py; scripts/run_weather.py -> data/checks/<field>/weather.json -> the optional block fields/<field>.json weather. Written and committed BEFORE its first run.
  basis:
    value: "what usually happened on this field in its own record, never a forecast: every sentence says 'usually' or 'in past years', never 'will'. The screen says so once at the top"
    source: "Owner, 2026-11-14 evening: 'What usually happens here, from 24 years of records. Not a forecast.'; the team's spec ('It is NOT a forecast ... Every sentence says usually, never will')"
  blocks:
    value: {count: 12, starts_on_day: 15, key: "the Gregorian month the block starts in, as words.json months ('Nov' = Mangsir, 15 Nov to 14 Dec)"}
    source: "Owner: 'One block per month for the next 6 months, Bikram Sambat first'. Each block is an approximate Bikram Sambat month starting on the 15th of a Gregorian month, the rule already fixed in monsoon_onset_dhm.bs_dates (a real BS month starts a day or two either side). Claude's choice, fixed before the first run: blocks, not calendar months, so that a Nepali month name labels its own days"
  years:
    value: "per block, the 24 latest blocks lying wholly in the twin's record (weather.parquet, 2001-01-01 to 2025-12-31): blocks starting in 2002-2025, and Poush (starting 15 December) 2001-2024. A block's year is the year it starts"
    source: "Owner: 'from 24 years of records'; the replay's 24 complete years (CLAUDE.md). Claude's reading for the block that crosses 1 January"
  next_six:
    value: "the screen shows the block holding the viewer's date and the five after it (on 14 Nov 2026: Kartik to Chaitra; from 15 Nov 2026: Mangsir to Baisakh); the file holds all twelve, so the screen stays right in any month (site/js/app.js blockKeys)"
    source: "Owner: 'one block per month for the next 6 months'; the team's spec (Nov 2026 - Apr 2027). The Choose screen's month strip also starts at the next month (site/js/app.js nextMonths) Owner, 2026-11-14 evening, farmer screens: 'Weather: one block for this month and each coming month' (the screen follows this; this text corrected the same night)"
  rain:
    value: "the twin's central rain (weather.parquet rain_mm: break-corrected and gauge-tuned): the block's total in each of its 24 years, given as the median, lowest and highest year; the median under each other rain version (untuned, dhm, uncorrected; pipeline/twin/inputs.with_rain with scripts/common.rain_kw) is the range in Why?"
    source: "Team spec ('Rain: the twin's central rain (break-corrected + gauge-tuned), with the other rain versions as a range'); rain_risk.rain"
  rain_word:
    value: {rule: "terciles of the twelve block means (as months.terciles)", words: [dry, some_rain, wet]}
    source: "months.terciles (owner-approved 2026-11-13) applied to the twelve blocks; owner: 'Usually: [dry/wet, cold/warm]'. The middle word 'some rain' is Claude's"
  temperature:
    value: "weather.parquet tmax_c and tmin_c (POWER corrected to Kathmandu Airport by the monthly offset, temperature_correction): the block's mean daily maximum and minimum over its 24 years, 1 decimal"
    source: "Team spec ('Temperature: NASA POWER, via weather.parquet (Kathmandu-valley corrected tmin_c / tmax_c)')"
  temperature_word:
    value: {rule: "terciles of the twelve block means of the daily mean, (tmax_c + tmin_c) / 2", words: [cold, mild, warm]}
    source: "months.terciles applied to temperature; owner: 'Usually: [dry/wet, cold/warm]'. The middle word 'mild' and the use of the daily mean are Claude's"
  frost_band:
    value: "the band of the block's median coldest night (tmin_frost_c) over its 24 years: below months.frost_c 'high', below months.frost_risk_c 'risk', else 'none' (as months.frost_month_rule). A band, never a count of nights. Why? says our cold nights are too many against Kathmandu Airport, and Bhaktapur's winter nights are 1.0-1.5 C colder than ours (VALIDATION 3.11b)"
    source: "Team spec ('Frost: tmin_frost_c (the quantile-mapped frost temperature). Frost shown as RISK BANDS, never counts'; 'Bhaktapur's winter nights are 1-1.5 C colder than the model (DHM normals): say so'); months.frost_c, frost_risk_c, frost_month_rule; VALIDATION 3.11b"
  dry_run:
    value: "DHM's measure: the longest run of days with rain under trends.dry_day_mm (1 mm) inside the block, per year (a run is cut at the block's ends); given as the typical year (the median, rounded half up to whole days) and the worst years (the three longest, with their years; ties: the later year first). No fixed spell length"
    source: "Owner's change 1 ('use DHM's own measure, the longest run of dry days (under 1 mm), not a fixed length') and answer 1 ('shown simply (typical years and the worst years), sourced to DHM'), 2026-11-14 evening. SOURCES CHECKED (notes/SOURCES_CHECK.md 2a, 2b): DHM, Update of Climate Change Study of Nepal (2024), Table 6 p.16: CDD, the maximum run of days with RR < 1 mm. DHM counts it per calendar year; here per block (our adaptation, said in Why?)"
  crops:
    value: "every crop of the field's plans and current_options (each crop and sowing day once), at its exported days (crops[].start to end, MM-DD, the same every year, counted in a 365-day year); its stages from config/crops.json stages_days, day 0 = the sowing day"
    source: "rain_risk.plans; heat_clock.crops"
  dangers:
    value:
      cold: "potato: heat_clock.potato_cold (tmin_frost_c 1 C or less, whole season); wheat: heat_clock.wheat_flower_frost (tmin_frost_c below 0 C, heat_clock.wheat_flower_window)"
      heat: "potato: heat_clock.potato_heat (tmax_c 35 C or more, whole season); wheat: heat_clock.wheat_floret_heat (tmax_c above 30 C, heat_clock.wheat_floret_window) and heat_clock.wheat_grain_filling_heat (tmax_c above 34 C, heat_clock.wheat_window)"
      dry_spell: "every crop: no day of trends.dry_day_mm (1 mm) or more in the part of the crop's FAO-56 mid- and late-season stages that lies in the block (the block's longest dry run covers all of it)"
      big_rain: "every crop: a day of trends.heavy_rain_mm (20 mm) or more in the part of the crop's FAO-56 initial stage (sowing) or late stage (harvest, rain_risk.harvest_window) that lies in the block; rice: the late stage (harvest) only, never sowing (owner's answer 3, 2026-11-14 night: 'drop the big rain at sowing warning (paddy is flooded at transplanting anyway)')"
      left_out: "rice and lentil have no temperature danger (no limit confirmed in notes/SOURCES_CHECK.md); disease weather is left out (owner's change 4); maize and other crops not in a plan are not shown"
    source: "Owner's change 2, 2026-11-14 evening ('Crop harm from heat and cold: use crop-stage limits from the sources already checked (FAO wheat book: above 30 C at floret formation, above 34 C at grain filling, frost below 0 C around flowering; potato: heat at 35 C or above, cold at 1 C or below)'), with heat_clock's sources and windows. Team spec's danger table: dry spell hurts at 'flowering, grain fill', heavy rain at 'harvest, sowing'. Windows: FAO-56 ch. 6 (https://www.fao.org/4/x0490e/x0490e0b.htm, opened 2026-11-14): 'once the effective full cover for a plant canopy has been reached, the rate of further phenological development (flowering, seed development, ripening, and senescence) ...', so flowering and grain fill lie after effective full cover, in the mid- and late-season stages; the initial stage is the sowing weeks. 20 mm is ETCCDI R20mm (trends.heavy_rain_mm), the team spec's threshold; DHM calls 10-50 mm 'moderate' and only 50 mm or more 'heavy' (rain_risk.heavy_rain_mm), so the screen says 'big rain', never 'heavy rain', and Why? says so. The dry-spell test uses DHM's run of dry days with no fixed length (change 1): the whole part in the block is dry"
  attach:
    value: "a crop's danger window counts in a block when the block holds at least half of the window's days, or the window covers at least half of the block's days (in a 365-day year); then only the window's days inside the block are tested"
    source: "Claude's choice, fixed before the first run: a danger is never shown in a month the window only touches, and every window lands in at least one block"
  count:
    value: "per danger, crop and block: the years (of the block's 24) with at least one risky day in the tested days (dry_spell: years whose tested days are all dry). Why? says 'in N of 24 years'; the farmer screen says 'Most years.' (N at least half) or 'Some years.' (N from 1 to under half). A danger with N = 0 is never a 'Watch out'; Why? lists it as 'None in these years. Good news.'"
    source: "Team spec ('how often: in N of the last 24 years'); owner: 'Only the biggest danger per month on screen; the rest ... the years and the sources go behind a Why? button'. 'At least half' is simple_cards.verdict's cut; Claude's choice"
  rank:
    value: "per block, the dangers with N of at least 1, most years first; ties: cold, heat, dry_spell, big_rain, then the crops in the order of the field's plans. Two lists: rain_fed (every danger) and watered (no dry_spell: watering stands in for the missing rain, as the twin's watered case). The screen shows the first danger of the farmer's own crop (their 'What do you grow in winter?' answer, and rice from June to October), else 'Usually no big danger.' (farm.wx_calm), never another crop's danger (owner's answer 1, 2026-11-14 night); the watered list when the farmer said they can water"
    source: "Owner: 'Watch out: [the single biggest danger, which crop]'. No published rule compares dangers of different kinds, so 'biggest' means 'happened in the most years': Claude's choice, fixed before the first run"
  change:
    value: "per danger with N of at least 1 (team spec: 'is it changing?'): Mann-Kendall and Sen's slope (trends.mk_sen at trends.alpha) on one number per year over the block's 24 years. Heat: the days in the block above the local 90th percentile of Tmax (trends.hot_day, TX90p). Cold: the nights in the tested days at or past the crop's limit (used for the trend only, never shown as a count). Dry spell: the block's longest dry run. Big rain: the days of 20 mm or more in the tested days. Words: more_common (p < alpha, slope > 0), less_common (p < alpha, slope < 0), cant_tell (fewer than 4 years with a value, or the same number in every year), else about_same, shown as 'No clear change.'. Temperature series leave out every block with a day in 2001-2003 (trends.hot_day_caveat); rain series carry gpm_series.trend_caveat in Why?"
    source: "Team spec ('is it changing: Mann-Kendall + Sen's slope (existing trends code) -> more common / about the same / less common / can't tell'; 'Temperature trends: leave out POWER's 2001-2003'; 'Rain trends: carry the GPM 2017-break caveat'); owner's change 2 ('Use the local 90th percentile only for is it changing?'). The yearly numbers for cold, dry spell and big rain, and the screen words 'No clear change' (as the DHM onset screen's 'No clear shift'), are Claude's"
  tips:
    value: {cold: "Cover young plants on clear, cold nights.", heat: "Water in the evening on hot days.", dry_spell: "Water before flowering if no rain.", big_rain: "Clear drains before the rains.", end: "Check with your local expert."}
    source: "Team spec's tip examples ('final wording reviewed'); owner: 'Every tip ends Check with your local expert.' Advice, not a number: reviewed by a person (SI_LOG), the Nepali by a native speaker"
  recent_weeks:
    value: "left out: no recent-weeks section. Recent rain is dropped (owner's change 3). Recent temperature cannot be checked: the Kathmandu Airport record on disk (GHCN-Daily NP000444540, downloaded 2026-11-11) ends 2025-08-24, and DHM's monthly bulletins on disk give rain only"
    source: "Owner's change 3, 2026-11-14 evening: 'drop recent rain ... Keep recent temperature with its as of date, or drop the section if it can't be checked'"
  season_outlook:
    value: "left out of the app's answers; a next step 'once its skill for Nepal is verified' (docs/NEXT_STEPS.md), listed with its reason on How we know under 'What is not ready yet' (your_plan.nr_outlook, owner 2026-11-14 night) and in README and docs/PROJECT_PAGE.md"
    source: "Owner's answer 3, 2026-11-14 evening; notes/SOURCES_CHECK.md 9b (IRI's skill at the field's cell for Dec-May is about zero)"
  checks:
    value:
      rain_words: "the block rain words against the same tercile rule on DHM's Bhaktapur normals (config/dhm_normals_1991_2020.csv), each block's normal taken as half of the month it starts in plus half of the next; and calendar months (the twin's 2001-2025 monthly means against the twelve normals). Reported as k of 12, with the months that differ"
      frost: "the known frost events (config/known_events.yaml, category frost): the band of the block holding each event, typical and in the event's own year"
      rain_events: "the known floods with dates (category flood): a day of 20 mm or more in the twin's central rain on the event's dates or one day either side (UTC days); the known winter droughts (category drought, months inside November-April): each of the event's blocks with a longest dry run above that block's median. Reported as k of n, the valley ('yes') events apart"
      report_card: "VALIDATION.md's accuracy report card gets a 'Weather ahead' row in plain words (low / medium / high), from these checks and the frost row"
    source: "Team spec ('Checks before export (into VALIDATION.md)'). The details are Claude's, fixed before the first run; checks only, never tuning"
  export:
    value: "the optional block 'weather' in fields/<field>.json (pipeline/export/schema.json; CONTRACT_CHANGES.md): basis, years, the twelve blocks (key, BS name, days, usual, dry run, dangers rain_fed and watered with tip keys, N, change), the danger windows, sources. Screen words live in words.json (screen 'weather', new Nepali marked for review). Nothing else in the file changes"
    source: "Owner: 'schema and CONTRACT_CHANGES updated (optional block)'; team spec ('Golden rule 1: the new block goes into schema.json + CONTRACT_CHANGES.md, optional, so nothing breaks')"
  label:
    value: "every number in the block is an estimate from POWER corrected to the airport (valley) and the twin's rain (valley); frost carries the cold-night caveat"
    source: "Team spec ('Every number shown carries source, resolution and years; model-based data labelled model-based'); labels.source_scales"

farmer_answers:                   # owner, 2026-11-14 evening: farmer screens show only the final answer (pipeline/export/build_simple.py -> site/data/simple/<field>.json plans, animation). Written and committed BEFORE its first run.
  plan_word:
    value: {compare: "each suggested plan against the farmer's own plan (their winter-crop answer's Replay plan, simple_cards.winter_answers), season by season in the Replay window (m3 and m6), each start (dry, medium, wet), rain-fed, by simple_cards.compare (10 WRSI points)", word: "simple_cards.verdict: better -> 'usually_better', same -> 'about_same', worse -> 'usually_worse', mixed -> 'mixed'", watered: "about_same for every plan (simple_cards.watering)", current: "the farmer's own plan gets no word (it is 'now')"}
    source: "Owner's answer, 2026-11-14 evening: 'replace Safe choice / Some risk / Risky with relative words the replay can support (\"Usually better than now\", \"About the same\", \"Usually worse\"), since the ranking held up in every sensitivity test' (VALIDATION 4.4). The comparison and verdict are the committed simple_cards rules (cd83641); 'mixed' is simple_cards.verdict's fourth word. This replaces the Safe/Some risk/Risky rule committed in 5b4ab42, which was never run"
  wording:
    value: {by_label: "each farmer sentence names its output (labels.outputs) and takes its wording from that output's status in site/data/labels/<field>.json: VERIFIED -> a plain statement; ESTIMATE and NOT YET VERIFIABLE -> a soft one ('usually', 'may'), never a plain promise", always_soft: "Weather ahead's lines (its block words are not the verified calendar-month words; its dangers say 'may'), the plan words, the crop guess (asked as a question) and the sowing calendar ('usually sown in')", today: "until the soil stick's calibration passes (data/checks/probe/bench.json: steady, order and temperature proofs all true, as build_story.bench_is_real), each patch is compared with the others ('drier than the others. Water it first.'); after it passes, its band ('dry. Water it today.', 'fine', 'too wet'): switched automatically", tips: "every tip ends 'Check with your local expert.'"}
    source: "Owner, 2026-11-14 evening: 'the back end chooses the wording from each output's label in the compliance table. VERIFIED: a plain statement. ESTIMATE: a softer word (usually, may)'; owner's answer the same evening: treat NOT YET VERIFIABLE outputs as estimates with careful wording, never a plain promise; Today compares patches until the cup test passes; the sowing months 'usually', sourced to the FAO crop calendar; weather dangers always 'may'; everything updates automatically when a label changes"
  actions:
    value: "per plan and window: every crop of the plan whose season touches the window (window_replay.plans), in date order: 'sow' (rice: 'plant') in the month of its sowing day, and 'harvest' in the month of its last day; the plan's last harvest is joined with the plan's next sowing after it into one action, 'harvest, then plant/sow the next crop', even when that sowing falls after the window. Months are approximate Bikram Sambat months starting on the 15th (weather_ahead.blocks; monsoon_onset_dhm.bs_dates): a day from the 15th takes its own Gregorian month's key, an earlier day the previous one ('10-15' = Kartik, '03-03' = Falgun). The actions are the plan's calendar, the same every year, not a promise that this season can still start on time"
    source: "Owner, 2026-11-14 evening: 'plain actions with Bikram Sambat months (\"Sow wheat in Kartik\", \"Harvest in Baisakh, then plant rice in Asar\")'; the owner's answer the same evening: shown as the usual calendar ('Wheat is usually sown in Kartik'), sourced to the FAO crop calendar (crops.json calendar windows; crop_calendar). Rice is transplanted as seedlings, hence 'plant'; the joining rule is Claude's, fixed before the first run"
  animation:
    value: {window: m6, start: "the Replay's start_default", plans: "the field's three plans (current, cover_gap, safest)", green: "a season that did not fail (score at or above window_replay.classes.failed_below)", red: "a failed season", winner: "the plan with the most green seasons; ties: the higher median score, then the plans' order"}
    source: "Owner, 2026-11-14 evening: 'a small field steps through the years, green when the plan did well, red when it struggled, then shows the winning plan'; 'We keep the plan that works most often'. Red uses the sourced failure bound, as confidence_word; the screen calls it 'Failed', not the Replay's 'struggled' (its 50-79 class). Claude's choice, fixed before the first run"
