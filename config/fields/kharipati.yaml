# A REAL farm (owner, 2026-11-15, 10:06 Nepal time): the teammate's package design/kharipati_sudal_farm_package.zip.
# Anything unknown is null with a TODO. Do not guess it.
#
# Kharipati / Sudal, north-east of Bhaktapur, Bhaktapur District, Nepal. The outline was traced by the teammate along the
# field's bunds on an OpenAerialMap drone orthomosaic ('Kharipati/Sudal Imagery' by Rabi Shrestha, 5 May 2026, DJI Mavic 2
# Pro, Pix4Dmapper, 1.7 cm per pixel, CC-BY 4.0), georeferenced from the GeoTIFF itself (WGS 84 / UTM 45N). Traced by eye:
# area about +/-5-10 % (package README). The FARM is real; its CROPS are not known: there are no farmer's answers yet, so
# the rotation below is the demo's placeholder and the app asks the farmer (current_options), as on the demo field.
# Visual cross-check only (owner, 2026-11-15; a team observation, not a measurement): on 5 May 2026 the drone photo shows
# a ripe, golden crop that looks like a winter cereal such as wheat (VALIDATION 3.34). It does not change any result.
# Inside the demo's fetch box, about 2.2 km from the demo's placeholder field, in the same GPM, POWER and NEX-GDDP cells:
# every dataset comes from the box's cached downloads (owner: "use only cached data: no new downloads"; box_of,
# power_point_of). The 30 m satellite data (HLS, NASADEM) see about one square of this farm.
id: kharipati
name: Real farm in Kharipati, Bhaktapur (PLACEHOLDER crops)   # the farm is real; its crops are not (the export refuses a placeholder rotation under a name without 'placeholder')
placeholder: true                   # the crops and the water source are placeholders (no farmer's answers yet); the location is real
real_farm: true                     # the outline is a real farm's (drone photo), not a picked square
box_of: demo                        # shares the demo's box downloads (scripts/fetch_field.py), as a sample field does, but runs the full pipeline
power_point_of: demo                # NASA POWER: the cached point the demo's own POWER table used (its card: 27.6785, 85.427417), same 0.5 x 0.625 deg and 1 deg cells (pipeline/fetch/power.py; sample-1's own download in this cell is identical, 25 of 25 years)
