# Demo field. Anything unknown is null with a TODO. Do not guess it.
#
# PLACEHOLDER (owner, 2026-11-12): the real field's location is not known yet. 27.67 N, 85.43 E is in
# Bhaktapur's old city, not farmland, so it is NOT the field: it is only the centre of the fetch box.
# Every dataset is fetched for the box (about 5 km each way), so a nearby real field is covered later
# without re-downloading. The field below is a 60 m x 60 m square. The owner chose candidate 1 from
# pipeline/fetch/placeholder.py (data/clean/demo/placeholder_candidates.json: WorldCover 2021 cropland
# with a 30 m cropland margin, no built-up pixel within 100 m of that margin, HLS greenness in both the
# monsoon and the winter of 2023-2025), then moved it 25 m north (owner, 2026-11-12): on Google Maps the
# Kasan River and its riparian strip run about 30 m south of candidate 1's centre, at the square's
# southern edge, and the strip is too narrow for WorldCover or HLS to show. After the move the square is
# 107 m from the nearest WorldCover built-up pixel, but its 30 m margin is 77 m from it: the search's
# 100 m rule is missed by 23 m. Accepted by the owner, 2026-11-12, as an exception to the 100 m rule. Tree-line and season checks: REVIEW_NOTES.md (H3).
# Replace lat, lon and polygon with the real corners when known.
id: demo
name: Bhaktapur demo field (PLACEHOLDER location and rotation)
placeholder: true
country: Nepal
origin_point: {lat: 27.67, lon: 85.43}   # CLAUDE.md demo point: Bhaktapur old city, not the field (owner, 2026-11-12)
lat: 27.690767                      # PLACEHOLDER field centre: candidate 1 moved 25 m north (owner, 2026-11-12); 2.59 km NE of the origin point
lon: 85.441792
polygon: [[85.441487, 27.690497], [85.442097, 27.690497], [85.442097, 27.691037], [85.441487, 27.691037]]  # PLACEHOLDER: SW, SE, NE, NW as [lon, lat]
earlier_placeholders:              # squares this field replaced (owner, 2026-11-12); pipeline/fetch/placeholder.py marks them
  - {lat: 27.6785, lon: 85.427417, side_m: 100, why_replaced: "a construction plot on satellite imagery; WorldCover 2021 is out of date there"}
  - {lat: 27.690542, lon: 85.441792, side_m: 60, why_replaced: "candidate 1 as found; moved 25 m north, away from the Kasan River strip at its southern edge"}
fetch_box: [85.379227, 27.625034, 85.480773, 27.714966]  # [min_lon, min_lat, max_lon, max_lat]: 5 km N, S, E, W of origin_point
bbox: [85.379227, 27.625034, 85.480773, 27.714966]       # index.json prepared area = the fetch box
elevation_m: 1325.0                 # NASADEM_HGT v001 mean over the PLACEHOLDER polygon (4 pixels, 1324-1326 m; slope 1.6 deg mean; data/clean/demo/nasadem_field.json, 2026-11-12). POWER cell: 1269.39 m
water_source: null                  # TODO(owner): one of rain-only, canal, well, irrigated. Unknown: both cases are run
current_rotation: [rice, potato]    # PLACEHOLDER (owner, 2026-11-12): rice in the monsoon, then potato in winter (the field shows vegetable beds)
current_rotation_options: [[rice, potato], [rice, wheat]]  # PLACEHOLDER (owner, 2026-11-13, answer 6 to REVIEW_2): the season timing cannot tell potato from wheat, so the app asks the farmer and the export holds both; the first is the default
current_rotation_source: "PLACEHOLDER (owner, 2026-11-12): rice in the monsoon, then potato in winter, sown on the FAO Crop Calendar Nepal Hill-zone default windows; the real rotation comes from the farmer"
validation_station: NP000444540        # NOAA GHCN-Daily KATHMANDU AIRPORT (validation; temperature correction A). About 7.4 km west of the placeholder field (great-circle, from the station's 27.700 N 85.367 E in ghcnd-stations.txt, DATA_AUDIT 1.11). Every record is GHCN S-flag 'S' (synoptic-derived: use with caution)
correction_label: Kathmandu-valley correction  # decision A: POWER temperature corrected from validation_station
sections: {cell_m: 30}   # this field's parts (owner, 2026-11-15: sectioning is per field): 30 m, about one NASA HLS pixel, so 2 x 2 = 4 parts
