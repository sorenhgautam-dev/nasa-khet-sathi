<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your farm in parts (web)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&amp;family=Inter:wght@400;500;600;700&amp;family=Mukta:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14301E}a:hover{color:#0B1F12}
.ks-wbg{background:#89A378 url(/_blob/3aa695d5bdb8271424d72ab091c78b64) center bottom/cover no-repeat}
@keyframes ks-drift{from{transform:translateX(-260px)}to{transform:translateX(110vw)}}
@keyframes ks-fly{0%{transform:translate(-120px,30px)}100%{transform:translate(110vw,-40px)}}
@keyframes ks-flap{to{transform:scaleY(.35)}}
.ks-cloud{position:absolute;left:0;z-index:-1;width:240px;height:60px;border-radius:99px;background:rgba(255,253,246,.75);filter:blur(10px);animation:ks-drift linear infinite;pointer-events:none}
.ks-birds{position:absolute;z-index:-1;left:0;top:150px;width:110px;height:36px;animation:ks-fly 32s linear 2s infinite;opacity:.55;pointer-events:none}
.ks-birds path{fill:none;stroke:#3A3A35;stroke-width:1.6;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:ks-flap .55s ease-in-out infinite alternate}
.ks-sun{position:absolute;z-index:-1;width:56px;height:56px;margin:-28px 0 0 -28px;left:var(--x1);top:var(--y1);pointer-events:none;animation:ks-sunmove 1.8s cubic-bezier(.2,.8,.2,1) both}
@keyframes ks-sunmove{from{left:var(--x0);top:var(--y0)}to{left:var(--x1);top:var(--y1)}}
.ks-sun .ks-glow{position:absolute;inset:-46px;border-radius:50%;animation:ks-sunpulse 3.4s ease-in-out infinite}
@keyframes ks-sunpulse{50%{transform:scale(1.18);opacity:.75}}
.ks-sun .ks-rays{position:absolute;left:-16px;top:-16px;width:88px;height:88px;animation:ks-sunrot 26s linear infinite}
@keyframes ks-sunrot{to{transform:rotate(360deg)}}
.ks-sun .ks-core{position:absolute;inset:0;border-radius:50%}
@keyframes ks-pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes ks-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes ks-wave{50%{opacity:.2}}
[style*="height: 66px"] > svg:last-child,[style*="height: 68px"] > svg:last-child{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
[style*="height: 66px"]:hover > svg:last-child,[style*="height: 68px"]:hover > svg:last-child{transform:translateX(7px)}
button:hover path[d^="M15.5"],button:hover path[d^="M18.5"]{animation:ks-wave .9s ease-in-out infinite}
button:hover path[d^="M18.5"]{animation-delay:.18s}
@keyframes ks-grow{from{transform:scale(0,0)}70%{transform:scale(1.1,1.15)}to{transform:scale(1)}}
@keyframes ks-sway2{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
</style>
</helmet>
<div class="{{rootClass}}" style="width: 100%; min-height: 900px; box-sizing: border-box; padding: 24px; position: relative; isolation: isolate; overflow: hidden; color: #14301E; font-family: Inter, Mukta, system-ui, sans-serif">
  <sc-if value="{{showSky}}" hint-placeholder-val="{{ true }}">
  <div class="ks-sun" aria-hidden="true" style="--x0: 16%; --y0: 280px; --x1: 31%; --y1: 160px"><span class="ks-glow" style="background: radial-gradient(circle, rgba(242,177,82,.55), rgba(242,177,82,0) 66%)"></span><svg class="ks-rays" viewBox="0 0 66 66"><g stroke="#F2B654" stroke-width="2.4" stroke-linecap="round"><path d="M33 2v7M33 57v7M2 33h7M57 33h7M11 11l5 5M50 50l5 5M55 11l-5 5M16 50l-5 5"></path></g></svg><span class="ks-core" style="background: radial-gradient(circle at 35% 32%, #FBE3A0, #F2B654 58%, #D9902E); box-shadow: 0 0 0 8px rgba(242,177,82,0.22)"></span></div>
  <span class="ks-cloud" aria-hidden="true" style="top: 70px; animation-duration: 95s; animation-delay: -45s"></span>
  <span class="ks-cloud" aria-hidden="true" style="top: 180px; width: 180px; animation-duration: 120s; animation-delay: -90s; opacity: .8"></span>
  <span class="ks-cloud" aria-hidden="true" style="top: 290px; width: 160px; height: 44px; animation-duration: 140s; animation-delay: -25s; opacity: .6"></span>
  <svg class="ks-birds" viewBox="0 0 120 40" aria-hidden="true"><path d="M10 20q6-6 12 0q6-6 12 0"></path><path d="M40 10q5-5 10 0q5-5 10 0"></path><path d="M62 24q5-5 10 0q5-5 10 0"></path><path d="M86 14q4-4 8 0q4-4 8 0"></path></svg>
  </sc-if>

  <div style="max-width: 1360px; margin: 0 auto; min-height: 852px; box-sizing: border-box; border-radius: 32px; padding: 26px clamp(20px, 3.4vw, 48px) 32px; border: 2px solid rgba(255,255,255,0.85); background: rgba(255,250,242,0.18); display: flex; flex-direction: column; gap: 28px">
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <div style="display: flex; align-items: center; gap: 12px">
        <sc-if value="{{standalone}}" hint-placeholder-val="{{ true }}"><a href="W2_Photo.dc.html" aria-label="{{t.back}}" style="width: 48px; height: 48px; border-radius: 999px; background: rgba(255,255,255,0.42); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14301E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
        </a></sc-if><sc-if value="{{embedded}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{navTo.W2}}" aria-label="{{t.back}}" style="border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; width: 48px; height: 48px; border-radius: 999px; background: rgba(255,255,255,0.42); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14301E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
        </button></sc-if>
        <span style="font-family: Archivo, Mukta, sans-serif; font-stretch: 125%; font-weight: 900; font-size: 22px">{{t.brand}}</span>
      </div>
      <div aria-label="{{t.stepOf}}" style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 26px; border-radius: 999px; background: rgba(255,255,255,0.42); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.7); gap: 14px">
        <span style="font-size: 16px; font-weight: 700; margin-right: 6px">{{t.stepOf}}</span>
        <span style="width: 88px; height: 8px; border-radius: 999px; background: #14301E"></span>
        <span style="width: 88px; height: 8px; border-radius: 999px; background: #14301E"></span>
        <span style="width: 88px; height: 8px; border-radius: 999px; background: #E3D6BF"></span>
      </div>
      <div style="display: flex; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.42); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.7)">
        <button aria-pressed="{{isNe}}" onClick="{{setNe}}" style="{{neStyle}}">नेपाली</button>
        <button aria-pressed="{{isEn}}" onClick="{{setEn}}" style="{{enStyle}}">EN</button>
      </div>
    </header>

    <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 40px">
      <div style="flex: 1 1 380px; min-width: 0; max-width: 520px; display: flex; flex-direction: column; gap: 22px; animation: ks-rise 700ms ease-out both">
        <h1 style="margin: 0; font-family: Archivo, Mukta, sans-serif; font-stretch: 125%; font-weight: 900; font-size: clamp(40px, 4.4vw, 68px); line-height: 0.95; text-transform: uppercase">
          <span style="display: block; color: #14301E">{{t.h1}}</span>
          <span style="display: block; color: #9A5426">{{t.h2}}</span>
        </h1>
        <div style="display: flex; align-items: flex-start; gap: 14px; padding: 18px 20px; border-radius: 22px; background: rgba(255,255,255,0.42); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.7)">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
            <p aria-live="polite" style="margin: 0; font-weight: 700; font-size: 20px">{{lead}}</p>
            <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #4A5646">{{t.sub}}</p>
          </div>
          <button aria-label="{{t.listen}}" onClick="{{speak}}" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 999px; border: 1px solid rgba(255,255,255,0.7); background: rgba(255,255,255,0.42); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.7); color: #14301E; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
          </button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <div style="padding: 14px 16px; border-radius: 20px; background: rgba(255,255,255,0.42); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.7); display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #7A6A4A">{{t.partsTag}}</span>
            <span style="font-family: Archivo, Mukta, sans-serif; font-stretch: 112%; font-weight: 900; font-size: 30px">{{partsNum}}</span>
          </div>
          <div style="padding: 14px 16px; border-radius: 20px; background: rgba(255,255,255,0.42); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.7); display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #7A6A4A">{{t.spotsTag}}</span>
            <span style="font-family: Archivo, Mukta, sans-serif; font-stretch: 112%; font-weight: 900; font-size: 30px">{{partsNum}}</span>
          </div>
        </div>
        <sc-if value="{{standalone}}" hint-placeholder-val="{{ true }}"><a href="W4_Robot.dc.html" style="height: 66px; border-radius: 999px; background: #14301E; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: Archivo, Mukta, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 19px; box-shadow: 0 18px 34px -16px rgba(20,48,30,0.7)">
          <span>{{t.cta}}</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8E05A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </a></sc-if><sc-if value="{{embedded}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{navTo.W4}}" style="border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; height: 66px; border-radius: 999px; background: #14301E; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: Archivo, Mukta, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 19px; box-shadow: 0 18px 34px -16px rgba(20,48,30,0.7)">
          <span>{{t.cta}}</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8E05A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </button></sc-if>
      </div>

      <div style="flex: 1.3 1 480px; min-width: 0; display: flex; justify-content: center">
        <div role="img" aria-label="{{t.sceneAria}}" style="position: relative; width: 100%; max-width: 680px; aspect-ratio: 4 / 3; border-radius: 32px; overflow: hidden; background: #F3EAD8; border: 2.5px dashed #CDBF9F; box-sizing: border-box; box-shadow: 0 30px 60px -30px rgba(40,50,20,0.5)">
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
            <span style="font-family: Archivo, Mukta, sans-serif; font-stretch: 125%; font-weight: 900; font-size: 40px; text-transform: uppercase; color: #DCCDAE">{{t.yourFarm}}</span>
          </div>
          <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr))">
            <span style="{{q1}}"></span><span style="{{q2}}"></span><span style="{{q3}}"></span><span style="{{q4}}"></span>
          </div>
          <span style="{{lineV}}"></span>
          <span style="{{lineH}}"></span>
          <sc-for list="{{crops}}" as="c" hint-placeholder-count="0"><span style="{{c.style}}"><svg width="24" height="28" viewBox="0 0 24 28" aria-hidden="true" style="display: block; overflow: visible"><path d="M12 18 L22 22 L12 26 L2 22Z" fill="#B08A5C"></path><path d="M2 22 L12 26 V28 L2 24Z" fill="#8A6640"></path><path d="M22 22 L12 26 V28 L22 24Z" fill="#9C7650"></path><path d="M12 22 V10" stroke="#4E7A3A" stroke-width="2" stroke-linecap="round"></path><path d="M12 15 C 7 14, 4 10, 5 6 C 10 7, 12 10, 12 15Z" fill="{{c.leaf}}" style="transition: fill 500ms"></path><path d="M12 12 C 16 11, 20 7, 19 3 C 14 4, 12 8, 12 12Z" fill="{{c.leaf2}}" style="transition: fill 500ms"></path></svg></span></sc-for>
          <sc-if value="{{showNums}}" hint-placeholder-val="{{ false }}">
            <sc-for list="{{nums}}" as="n" hint-placeholder-count="4">
              <span style="{{n.style}}">{{n.label}}</span>
            </sc-for>
          </sc-if>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { lang: 'en', stage: 0 }; }
  componentDidMount() {
    var self = this;
    this.timers = [
      setTimeout(function () { self.setState({ stage: 1 }); }, 500),
      setTimeout(function () { self.setState({ stage: 2 }); }, 1400),
      setTimeout(function () { self.setState({ stage: 3 }); }, 2100)
    ];
  }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  renderVals() {
    var S = {
      en: { brand: 'Khet Sathi', back: 'Back', stepOf: 'Step 2 of 3', h1: 'Your farm,', h2: 'in 4 parts', listen: 'Listen', sceneAria: 'Your farm split into 4 numbered parts', yourFarm: 'Your farm', making: 'Making the parts…', done: 'Here are the 4 parts.', sub: 'The robot will take soil from the middle of each part.', partsTag: 'Parts', spotsTag: 'Test spots', cta: 'Start robot test' },
      ne: { brand: 'खेत साथी', back: 'पछाडि', stepOf: '३ मध्ये दोस्रो चरण', h1: 'तपाईंको खेत,', h2: '४ भागमा', listen: 'सुन्नुहोस्', sceneAria: '४ भागमा बाँडिएको तपाईंको खेत', yourFarm: 'तपाईंको खेत', making: 'भाग बनाउँदै…', done: 'यी ४ भाग हुन्।', sub: 'रोबोटले हरेक भागको बीचबाट माटो लिन्छ।', partsTag: 'भाग', spotsTag: 'जाँच्ने ठाउँ', cta: 'रोबोट जाँच सुरु गर्नुहोस्' }
    };
    var lang = this.state.lang;
    var t = S[lang];
    var num = function (v) { var s = String(v); return lang === 'ne' ? s.replace(/[0-9]/g, function (d) { return '०१२३४५६७८९'[d]; }) : s; };
    var st = this.state.stage;
    var C = [[25, 25], [75, 25], [25, 75], [75, 75]];
    var q = function (i) { return 'background: ' + (i === 0 || i === 3 ? 'rgba(20,48,30,0.06)' : 'rgba(154,84,38,0.06)') + '; opacity: ' + (st >= 2 ? 1 : 0) + '; transition: opacity 500ms ease ' + (i * 100) + 'ms'; };
    var on = 'height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #14301E; color: #FFFFFF; font-weight: 700; font-size: 14px; cursor: pointer; font-family: Inter, Mukta, sans-serif';
    var off = 'height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #14301E; font-weight: 600; font-size: 14px; cursor: pointer; font-family: Inter, Mukta, sans-serif';
    var lead = st >= 3 ? t.done : t.making;
    var CROPS = [];
    [[0, 0], [50, 0], [0, 50], [50, 50]].forEach(function (q, qi) {
      for (var r = 0; r < 3; r++) for (var c = 0; c < 5; c++) {
        var x = q[0] + 6 + c * 9.5, y = q[1] + 12 + r * 14;
        if (Math.abs(x - (q[0] + 25)) < 9 && Math.abs(y - (q[1] + 25)) < 13) continue;
        CROPS.push({ x: x, y: y, q: qi, k: CROPS.length });
      }
    });
    var self_ = this;
    return {
      rootClass: this.props.embedded ? '' : 'ks-wbg',
      showSky: !this.props.embedded,
      standalone: !this.props.embedded,
      embedded: !!this.props.embedded,
      navTo: {W1: function () { if (self_.props.onNav) self_.props.onNav('W1'); }, W2: function () { if (self_.props.onNav) self_.props.onNav('W2'); }, W3: function () { if (self_.props.onNav) self_.props.onNav('W3'); }, W4: function () { if (self_.props.onNav) self_.props.onNav('W4'); }, W5: function () { if (self_.props.onNav) self_.props.onNav('W5'); }, W6: function () { if (self_.props.onNav) self_.props.onNav('W6'); }, W7: function () { if (self_.props.onNav) self_.props.onNav('W7'); }},
      t: t,
      isEn: lang === 'en' ? 'true' : 'false',
      isNe: lang === 'ne' ? 'true' : 'false',
      enStyle: lang === 'en' ? on : off,
      neStyle: lang === 'ne' ? on : off,
      setEn: () => this.setState({ lang: 'en' }),
      setNe: () => this.setState({ lang: 'ne' }),
      q1: q(0), q2: q(1), q3: q(2), q4: q(3),
      lineV: 'position: absolute; left: calc(50% - 1.5px); top: 0; width: 3px; height: 100%; background: #14301E; transform-origin: 50% 0; transition: transform 800ms cubic-bezier(.2,.8,.2,1); transform: scaleY(' + (st >= 1 ? 1 : 0) + ')',
      lineH: 'position: absolute; top: calc(50% - 1.5px); left: 0; height: 3px; width: 100%; background: #14301E; transform-origin: 0 50%; transition: transform 800ms cubic-bezier(.2,.8,.2,1) 250ms; transform: scaleX(' + (st >= 1 ? 1 : 0) + ')',
      crops: CROPS.map(function (c) { var d = 200 + c.q * 180 + (c.k % 11) * 45; return { leaf: '#7FB24A', leaf2: '#93C258', style: 'position: absolute; left: calc(' + c.x + '% - 12px); top: calc(' + c.y + '% - 22px); transform-origin: 50% 100%; ' + (st >= 3 ? 'animation: ks-grow 600ms cubic-bezier(.34,1.56,.64,1) ' + d + 'ms both, ks-sway2 3.2s ease-in-out ' + (d + 600) + 'ms infinite' : 'transform: scale(0)') }; }),
      showNums: st >= 2,
      nums: C.map(function (c, i) {
        return { label: num(i + 1), style: 'position: absolute; left: calc(' + c[0] + '% - 30px); top: calc(' + c[1] + '% - 30px); width: 60px; height: 60px; border-radius: 999px; background: #14301E; color: #C8E05A; border: 4px solid #FBF4EA; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: Archivo, Mukta, sans-serif; font-stretch: 112%; font-weight: 900; font-size: 24px; animation: ks-pop 450ms cubic-bezier(.34,1.56,.64,1) ' + (i * 120) + 'ms both' };
      }),
      partsNum: st >= 3 ? num(4) : '–',
      lead: lead,
      speak: () => {
        try {
          var u = new SpeechSynthesisUtterance(lead + ' ' + t.sub);
          u.lang = lang === 'ne' ? 'ne-NP' : 'en-IN';
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(u);
        } catch (err) {}
      }
    };
  }
}
</script>
</body>
</html>
