        floats: [['ड्रोन फोटो', 'खेतको माथिबाट फोटो'], ['माटो रोबोट', 'हरेक भाग जाँच्छ'], ['नासा डाटा', '२० वर्षको रेकर्ड'], ['अर्को ३ महिना', 'के लगाउने']],
        caps: ['हरेक कार्ड के गर्छ हेर्न त्यसमाथि माउस राख्नुहोस्।', 'हाम्रो ड्रोनले माथिबाट पूरै खेतको फोटो खिच्छ।', 'हाम्रो रोबोट हरेक भागमा गएर माटो जाँच्छ।', 'तपाईंको क्षेत्रको नासाको २० वर्षको रेकर्ड पढ्छौं।', 'अर्को ३ महिनाको सजिलो योजना पाउनुहुन्छ।'],
        stats: [['ड्रोन + रोबोट', 'खेत हेरिन्छ र जाँचिन्छ', 'हेर'], ['भू-उपग्रह इतिहास', 'नासाको २० वर्षको डाटा', '२०'], ['किसान पहिले', 'निर्णय तपाईंकै', 'तपाईं']] }
    };
    var lang = this.state.lang;
    var t = S[lang];
    var lv = this.state.leaving;
    var self = this;
    var POS = [
      'left: 2%; top: 8%; animation: ks-bob 6s ease-in-out infinite',
      'right: 0; top: 18%; animation: ks-bob 6.6s ease-in-out 0.8s infinite',
      'left: 0; bottom: 18%; animation: ks-bob 7s ease-in-out 1.4s infinite',
      'right: 4%; bottom: 8%; animation: ks-bob 6.2s ease-in-out 0.4s infinite'
    ];
    var KIND = ['isDrone', 'isRobot', 'isSat', 'isLeaf'];
    var BG = [['#F3EAD8', '#9A5426'], ['#14301E', '#C8E05A'], ['#E3EEDC', '#2E5A2A'], ['#C8E05A', '#14301E']];
    var on = 'height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: #14301E; color: #FFFFFF; font-weight: 700; font-size: 14px; cursor: pointer; font-family: Inter, Mukta, sans-serif';
    var off = 'height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #14301E; font-weight: 600; font-size: 14px; cursor: pointer; font-family: Inter, Mukta, sans-serif';
    return {
      ownClouds: !this.props.embedded,
      rootBg: this.props.embedded ? 'background: transparent' : 'background: #F6D19F',
      t: t,
      isEn: lang === 'en' ? 'true' : 'false',
      isNe: lang === 'ne' ? 'true' : 'false',
      enStyle: lang === 'en' ? on : off,
      neStyle: lang === 'ne' ? on : off,
      setEn: () => this.setState({ lang: 'en' }),
      setNe: () => this.setState({ lang: 'ne' }),
      floats: t.floats.map(function (f, i) {
        var hv = self.state.hover, me = hv === i, dim = hv >= 0 && !me;
        var o = { tag: f[0], text: f[1], bg: BG[i][0], fg: BG[i][1],
          enter: function () { self.setState({ hover: i }); }, leave: function () { self.setState({ hover: -1 }); },
          tagStyle: 'font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; transition: color 300ms; color: ' + (me ? '#C8E05A' : '#7A6A4A'),
          style: 'position: absolute; z-index: 3; cursor: default; display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 10px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.95); transition: opacity 400ms ease, background 300ms ease, color 300ms ease, box-shadow 300ms ease; background: ' + (me ? '#14301E' : 'rgba(255,255,255,0.78)') + '; color: ' + (me ? '#FBF4EA' : '#14301E') + '; box-shadow: ' + (me ? '0 24px 40px -18px rgba(20,48,30,0.7)' : '0 16px 34px -18px rgba(122,74,32,0.45)') + '; opacity: ' + (lv ? 0 : (dim ? 0.55 : 1)) + '; ' + POS[i] };
        KIND.forEach(function (k, j) { o[k] = j === i; });
        return o;
      }),
      captions: t.caps.map(function (c, i) { return { text: c, show: i === self.state.hover + 1 }; }),
      stats: t.stats.map(function (s) { return { tag: s[0], text: s[1], badge: s[2] }; }),
      fadeA: 'transition: opacity 450ms ease, transform 450ms ease; opacity: ' + (lv ? 0 : 1) + '; transform: translateY(' + (lv ? -18 : 0) + 'px)',
      fadeB: 'transition: opacity 450ms ease, transform 450ms ease; opacity: ' + (lv ? 0 : 1) + '; transform: translateY(' + (lv ? 24 : 0) + 'px)',
      islandStyle: lv ? 'animation: ks-dive 1500ms cubic-bezier(.55,0,.2,1) forwards' : '',
      veil: this.props.embedded ? 'display: none' : 'position: absolute; inset: 0; z-index: 9; pointer-events: none; background: linear-gradient(180deg, #F4C995 0%, #F7DCB4 35%, #F8ECDA 70%); transition: opacity 500ms ease 1050ms; opacity: ' + (lv ? 1 : 0),
      go: function (e) {
        if (self.state.leaving) return;
        var el = e && e.currentTarget ? e.currentTarget : null;
        var root = el;
        while (root && root.parentNode && !(root.querySelector && root.querySelector('a.ks-next'))) root = root.parentNode;
        var link = root && root.querySelector ? root.querySelector('a.ks-next') : null;
        self.setState({ leaving: true });
        if (self.props.embedded) {
          if (self.props.onNav) self.props.onNav('W2', 1500);
          return;
        }
        self.navT = setTimeout(function () {
          if (link) link.click();
          self.resetT = setTimeout(function () { self.setState({ leaving: false }); }, 250);
        }, 1550);
      },
      speak: () => {
        try {
          var u = new SpeechSynthesisUtterance(t.sub);
          u.lang = lang === 'ne' ? 'ne-NP' : 'en-IN';
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(u);
        } catch (err) {}
      }
    };
  }
}
