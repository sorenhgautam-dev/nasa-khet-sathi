body{margin:0}

@keyframes ks-fly{0%{transform:translate(-90px,20px)}100%{transform:translate(480px,-30px)}}
@keyframes ks-flap{to{transform:scaleY(.35)}}
.ks-cloud{position:absolute;left:0;z-index:-1;width:150px;height:38px;border-radius:99px;background:rgba(255,253,246,.75);filter:blur(8px);animation:ks-drift linear infinite;pointer-events:none}
.ks-birds{position:absolute;z-index:-1;left:0;top:190px;width:70px;height:24px;animation:ks-fly 28s linear 2s infinite;opacity:.55;pointer-events:none}
.ks-birds path{fill:none;stroke:#3A3A35;stroke-width:1.8;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:ks-flap .55s ease-in-out infinite alternate}
.ks-sun{position:absolute;left:0;top:0;width:42px;height:42px;margin:-21px 0 0 -21px;z-index:-1;pointer-events:none;transform:translate(var(--x1),var(--y1));animation:ks-sunmove 1.8s cubic-bezier(.2,.8,.2,1) both}
@keyframes ks-sunmove{from{transform:translate(var(--x0),var(--y0))}to{transform:translate(var(--x1),var(--y1))}}
.ks-sun .ks-glow{position:absolute;inset:-34px;border-radius:50%;animation:ks-sunpulse 3.4s ease-in-out infinite}
@keyframes ks-sunpulse{50%{transform:scale(1.18);opacity:.75}}
.ks-sun .ks-rays{position:absolute;left:-12px;top:-12px;width:66px;height:66px;animation:ks-sunrot 26s linear infinite}
@keyframes ks-sunrot{to{transform:rotate(360deg)}}
.ks-sun .ks-core{position:absolute;inset:0;border-radius:50%}
.ks-tint{position:absolute;left:0;top:0;width:100%;height:560px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(208,92,52,.6) 0%,rgba(232,138,78,.38) 38%,rgba(232,138,78,0) 80%);animation:ks-tintin 1.8s ease both}
@keyframes ks-tintin{from{opacity:var(--t0)}to{opacity:var(--t1)}}
@keyframes ks-arrive{from{opacity:0;transform:scale(1.25);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes ks-wave{50%{opacity:.2}}
[style*="height: 62px"] > svg:last-child{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
[style*="height: 62px"]:hover > svg:last-child,[style*="height: 62px"]:active > svg:last-child{transform:translateX(7px)}
button:hover path[d^="M15.5"],button:active path[d^="M15.5"],button:hover path[d^="M18.5"],button:active path[d^="M18.5"]{animation:ks-wave .9s ease-in-out infinite}
button:hover path[d^="M18.5"]{animation-delay:.18s}
@keyframes ks-grow{from{transform:scale(0,0)}70%{transform:scale(1.1,1.15)}to{transform:scale(1)}}
@keyframes ks-sway2{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes ks-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.ks-blade{transform-box:fill-box;transform-origin:50% 100%;animation:ks-sway 3.2s ease-in-out infinite}
@keyframes ks-path{from{stroke-dashoffset:var(--p0)}to{stroke-dashoffset:var(--p1)}}
@keyframes ks-reveal{from{opacity:0;transform:translateY(34px) scale(.96);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes ks-word{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes ks-cap{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.ks-hcloud{position:absolute;left:0;z-index:-1;border-radius:99px;background:rgba(255,251,242,.6);filter:blur(10px);animation:ks-roam linear infinite;pointer-events:none}
@keyframes ks-roam{0%{transform:translate(-200px,0)}25%{transform:translate(20px,-14px)}50%{transform:translate(200px,8px)}75%{transform:translate(340px,-10px)}100%{transform:translate(480px,0)}}
@keyframes ks-puff{0%,100%{transform:translate(0,0)}25%{transform:translate(12px,-7px)}50%{transform:translate(4px,5px)}75%{transform:translate(-10px,-3px)}}
.ks-puff{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,253,247,.95),rgba(255,253,247,.6) 55%,rgba(255,253,247,0));pointer-events:none;animation:ks-puff ease-in-out infinite}
@keyframes ks-winp{0%{clip-path:inset(46% 38% 44% 38% round 28px);background-size:620px auto;opacity:0}22%{clip-path:inset(24% 6% 42% 6% round 28px);background-size:560px auto;opacity:1}100%{clip-path:inset(0 0 0 0 round 0);background-size:390px auto;opacity:1}}
.ks-win{background:#89A378 url(/_blob/4f0b25b11732b3cab6a3285746008d0b) no-repeat center top/390px auto}
@keyframes ks-word{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes ks-in{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { screen: 'Main', bg: 'Main', fading: false, portal: false, wi: 0, loading: true, lifting: false };
    this.timers = [];
  }
  componentDidMount() {
    var self = this;
    for (var i = 1; i < 6; i++) (function (k) { self.timers.push(setTimeout(function () { self.setState({ wi: k }); }, 360 * k)); })(i);
    this.timers.push(setTimeout(function () { self.setState({ lifting: true }); }, 360 * 6 + 200));
    this.timers.push(setTimeout(function () { self.setState({ loading: false }); }, 360 * 6 + 1200));
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  renderVals() {
    var self = this;
    var st = this.state;
    var SUN = { Main: [30, 300], Photo: [79, 197], Parts: [131, 119], Robot: [183, 81], Choose: [236, 96], Today: [288, 159], Future: [325, 223], Future6: [352, 300] };
    var TINT = { Main: 0, Photo: 0, Parts: 0, Robot: 0.05, Choose: 0.15, Today: 0.4, Future: 0.65, Future6: 0.8 };
    var SET = { Main: 0, Photo: 0, Parts: 0, Robot: 0.1, Choose: 0.3, Today: 0.65, Future: 0.95, Future6: 1 };
    var PROG = { Main: 0, Photo: 0.16, Parts: 0.33, Robot: 0.5, Choose: 0.66, Today: 0.84, Future: 1, Future6: 1 };
    var WORDS = ['\u0928\u092e\u0938\u094d\u0924\u0947', 'Namaste', '\u0916\u0947\u0924 \u0938\u093e\u0925\u0940', 'Know your land', '\u092e\u094c\u0938\u092e', 'Plan your season'];
    var land = st.bg !== 'Main';
    var sp = SUN[st.bg];
    var is = {};
    ['Main', 'Photo', 'Parts', 'Robot', 'Choose', 'Today', 'Future', 'Future6'].forEach(function (k) { is[k] = st.screen === k; });
    return {
      is: is,
      homeSky: 'position: absolute; inset: 0; transition: opacity 900ms ease; opacity: ' + (land ? 0 : 1),
      landStyle: 'position: absolute; inset: 0; ' + (!land ? 'opacity: 0; transition: opacity 600ms ease' : (st.portal ? 'animation: ks-winp 1500ms cubic-bezier(.76,0,.24,1) both' : 'opacity: 1')),
      tintStyle: 'position: absolute; left: 0; top: 0; width: 100%; height: 560px; background: linear-gradient(180deg, rgba(208,92,52,.6) 0%, rgba(232,138,78,.38) 38%, rgba(232,138,78,0) 80%); transition: opacity 2400ms ease; opacity: ' + TINT[st.bg],
      skyStyle: 'position: absolute; inset: 0; transition: opacity 1400ms ease 500ms; opacity: ' + (land ? 1 : 0),
      pathDraw: 'transition: stroke-dashoffset 2600ms cubic-bezier(.45,0,.25,1); stroke-dashoffset: ' + (1 - PROG[st.bg]),
      sunStyle: 'position: absolute; width: 42px; height: 42px; margin: -21px 0 0 -21px; left: ' + sp[0] + 'px; top: ' + sp[1] + 'px; transition: left 2600ms cubic-bezier(.45,0,.25,1), top 2600ms cubic-bezier(.45,0,.25,1), opacity 1200ms ease 500ms; opacity: ' + (land ? 1 : 0),
      sunsetCore: 'position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 32%, #F7B26A, #E2733A 58%, #B84E24); transition: opacity 2400ms ease; opacity: ' + SET[st.bg],
      wrap: 'transition: opacity 380ms ease; opacity: ' + (st.fading ? 0 : 1) + '; animation: ks-in 600ms cubic-bezier(.2,.8,.2,1) both',
      words: WORDS.map(function (w, i) { return { text: w, show: i === st.wi }; }),
      loaderStyle: st.loading ? 'position: absolute; inset: 0; z-index: 50; background: #14301E; display: flex; align-items: center; justify-content: center; transition: transform 950ms cubic-bezier(.76,0,.24,1), border-radius 950ms cubic-bezier(.76,0,.24,1); transform: translateY(' + (st.lifting ? '-110%' : '0') + '); border-bottom-left-radius: ' + (st.lifting ? '50% 120px' : '0') + '; border-bottom-right-radius: ' + (st.lifting ? '50% 120px' : '0') : 'display: none',
      wordStyle: 'display: inline-flex; align-items: center; gap: 12px; color: #FBF4EA; font-family: \'Inter Tight\', Mukta, sans-serif; font-weight: 800; font-size: 38px; letter-spacing: -0.02em; animation: ks-word 300ms ease-out both; transition: opacity 300ms; opacity: ' + (st.lifting ? 0 : 1),
      nav: function (to, delay) {
        if (!to || to === self.state.screen) return;
        self.timers.forEach(clearTimeout);
        self.timers = [];
        var fromHome = self.state.bg === 'Main';
        self.setState({ bg: to, portal: fromHome });
        if (fromHome) self.timers.push(setTimeout(function () { self.setState({ portal: false }); }, 1700));
        self.timers.push(setTimeout(function () {
          self.setState({ fading: true });
          self.timers.push(setTimeout(function () { self.setState({ screen: to, fading: false }); }, 380));
        }, delay || 0));
      }
    };
  }
}
