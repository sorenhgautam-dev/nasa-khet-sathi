  constructor(p) { super(p); this.state = { lang: 'en', leaving: false, sel: -1, wi: 0, loading: true, lifting: false }; this.lt = []; }

      cardB: cardBase + (sel === 1 ? cardOn : cardOff),
      words: WORDS.map(function (w, i) { return { text: w, show: i === ls.wi }; }),
      loaderStyle: (ls.loading && !this.props.embedded) ? 'position: absolute; inset: 0; z-index: 50; background: #14301E; display: flex; align-items: center; justify-content: center; transition: transform 950ms cubic-bezier(.76,0,.24,1), border-radius 950ms cubic-bezier(.76,0,.24,1); transform: translateY(' + (ls.lifting ? '-110%' : '0') + '); border-bottom-left-radius: ' + (ls.lifting ? '50% 120px' : '0') + '; border-bottom-right-radius: ' + (ls.lifting ? '50% 120px' : '0') : 'display: none',
      wordStyle: 'display: inline-flex; align-items: center; gap: 12px; color: #FBF4EA; font-family: \'Inter Tight\', Mukta, sans-serif; font-weight: 800; font-size: 38px; letter-spacing: -0.02em; animation: ks-word 300ms ease-out both; transition: opacity 300ms; opacity: ' + (ls.lifting ? 0 : 1),
      fadeA: 'transition: opacity 450ms ease, transform 450ms ease; opacity: ' + (lv ? 0 : 1) + '; transform: translateY(' + (lv ? -18 : 0) + 'px)',
      fadeB: 'transition: opacity 450ms ease, transform 450ms ease; opacity: ' + (lv ? 0 : 1) + '; transform: translateY(' + (lv ? 28 : 0) + 'px)',
      islandStyle: lv ? 'animation: ks-dive 1500ms cubic-bezier(.65,0,.25,1) forwards' : '',
      veil: (lv && !this.props.embedded) ? 'position: absolute; inset: 0; z-index: 1; pointer-events: none; animation: ks-winp 1500ms cubic-bezier(.76,0,.24,1) both' : 'display: none',
      go: function (e) {
        if (self.state.leaving) return;
        var host = e && e.currentTarget ? e.currentTarget.parentNode : null;
        var link = host ? host.querySelector('a.ks-next') : null;
        self.setState({ leaving: true });
        if (self.props.embedded) { if (self.props.onNav) self.props.onNav('Photo', 1500); return; }
        self.navT = setTimeout(function () {
          if (link) link.click();
          self.resetT = setTimeout(function () { self.setState({ leaving: false }); }, 250);
        }, 1550);
      },
      t: t,
      isEn: lang === 'en' ? 'true' : 'false',
      isNe: lang === 'ne' ? 'true' : 'false',
      enStyle: lang === 'en' ? on : off,
      neStyle: lang === 'ne' ? on : off,
      setEn: () => this.setState({ lang: 'en' }),
      setNe: () => this.setState({ lang: 'ne' }),
      speak: () => {
        try {
          var u = new SpeechSynthesisUtterance(t.lead + ' ' + t.sub);
          u.lang = lang === 'ne' ? 'ne-NP' : 'en-IN';
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }
    };
  }
}
</script>
</body>
</html>
