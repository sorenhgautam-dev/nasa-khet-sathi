body{margin:0}
a{color:#14301E}a:hover{color:#0B1F12}
@keyframes ks-pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes ks-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ks-bg{background:#89A378 url(/_blob/4f0b25b11732b3cab6a3285746008d0b) no-repeat center top/390px auto}
@keyframes ks-drift{from{transform:translateX(-170px)}to{transform:translateX(470px)}}
@keyframes ks-fly{0%{transform:translate(-90px,20px)}100%{transform:translate(480px,-30px)}}
@keyframes ks-flap{to{transform:scaleY(.35)}}
.ks-cloud{position:absolute;left:0;z-index:-1;width:150px;height:38px;border-radius:99px;background:rgba(255,253,246,.75);filter:blur(8px);animation:ks-drift linear infinite;pointer-events:none}
.ks-birds{position:absolute;z-index:-1;left:0;top:190px;width:70px;height:24px;animation:ks-fly 28s linear 2s infinite;opacity:.55;pointer-events:none}
.ks-birds path{fill:none;stroke:#3A3A35;stroke-width:1.8;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:ks-flap .55s ease-in-out infinite alternate}
.ks-sun{position:absolute;left:0;top:0;width:42px;height:42px;margin:-21px 0 0 -21px;z-index:-1;pointer-events:none;transform:translate(var(--x1),var(--y1));animation:ks-sunmove 1.8s cubic-bezier(.2,.8,.2,1) both}
@keyframes ks-sunmove{from{transform:translate(var(--x0),var(--y0))}to{transform:translate(var(--x1),var(--y1))}}
.ks-sun .ks-glow{position:absolute;inset:-34px;border-radius:50%;animation:ks-sunpulse 3.4s ease-in-out infinite}
@keyframes ks-sunpulse{50%{transform:scale(1.18);opacity:.75}}
.ks-sun .ks-rays{position:absolute;left:-12px;top:-12px;width:66px;height:66px;animation:ks-sunrot 26s linear infinite}
@keyframes ks-sunrot{to{transform:rotate(360deg)}}
.ks-sun .ks-core{position:absolute;inset:0;border-radius:50%}
.ks-tint{position:absolute;left:0;top:0;width:100%;height:560px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(208,92,52,.6) 0%,rgba(232,138,78,.38) 38%,rgba(232,138,78,0) 80%);animation:ks-tintin 1.8s ease both}
@keyframes ks-tintin{from{opacity:var(--t0)}to{opacity:var(--t1)}}
@keyframes ks-arrive{from{opacity:0;transform:scale(1.25);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes ks-wave{50%{opacity:.2}}
[style*="height: 62px"] > svg:last-child{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
[style*="height: 62px"]:hover > svg:last-child,[style*="height: 62px"]:active > svg:last-child{transform:translateX(7px)}
button:hover path[d^="M15.5"],button:active path[d^="M15.5"],button:hover path[d^="M18.5"],button:active path[d^="M18.5"]{animation:ks-wave .9s ease-in-out infinite}
button:hover path[d^="M18.5"]{animation-delay:.18s}
@keyframes ks-grow{from{transform:scale(0,0)}70%{transform:scale(1.1,1.15)}to{transform:scale(1)}}
@keyframes ks-sway2{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes ks-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.ks-blade{transform-box:fill-box;transform-origin:50% 100%;animation:ks-sway 3.2s ease-in-out infinite}
@keyframes ks-path{from{stroke-dashoffset:var(--p0)}to{stroke-dashoffset:var(--p1)}}
@keyframes ks-reveal{from{opacity:0;transform:translateY(34px) scale(.96);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes ks-word{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes ks-cap{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":null,"default":false},"onNav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { lang: 'en', stage: 0 }; }
  componentDidMount() {
    var self = this;
    this.timers = [
      setTimeout(function () { self.setState({ stage: 1 }); }, 400),
      setTimeout(function () { self.setState({ stage: 2 }); }, 1300),
      setTimeout(function () { self.setState({ stage: 3 }); }, 2000)
    ];
  }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  renderVals() {
    var S = {
      en: { brand: 'Khet Sathi', back: 'Back', stepOf: 'Step 2 of 3', h1: 'Your farm,', h2: 'in 4 parts', listen: 'Listen', sceneAria: 'Your farm split into 4 numbered parts', yourFarm: 'Your farm', making: 'Making the parts…', done: 'Here are the 4 parts.', sub: 'The robot will take soil from the middle of each part.', cta: 'Start robot test' },
      ne: { brand: 'खेत साथी', back: 'पछाडि', stepOf: '३ मध्ये दोस्रो चरण', h1: 'तपाईंको खेत,', h2: '४ भागमा', listen: 'सुन्नुहोस्', sceneAria: '४ भागमा बाँडिएको तपाईंको खेत', yourFarm: 'तपाईंको खेत', making: 'भाग बनाउँदै…', done: 'यी ४ भाग हुन्।', sub: 'रोबोटले हरेक भागको बीचबाट माटो लिन्छ।', cta: 'रोबोट जाँच सुरु गर्नुहोस्' }
    };
    var lang = this.state.lang;
    var t = S[lang];
    var num = function (v) { var s = String(v); return lang === 'ne' ? s.replace(/[0-9]/g, function (d) { return '०१२३४५६७८९'[d]; }) : s; };
    var st = this.state.stage;
    var C = [[84.5, 74], [253.5, 74], [84.5, 222], [253.5, 222]];
    var q = function (i) { return 'background: ' + (i === 0 || i === 3 ? 'rgba(20,48,30,0.06)' : 'rgba(154,84,38,0.06)') + '; opacity: ' + (st >= 2 ? 1 : 0) + '; transition: opacity 500ms ease ' + (i * 100) + 'ms'; };
    var on = 'height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #14301E; color: #FFFFFF; font-weight: 700; font-size: 14px; cursor: pointer; font-family: Inter, Mukta, sans-serif';
    var off = 'height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: #14301E; font-weight: 600; font-size: 14px; cursor: pointer; font-family: Inter, Mukta, sans-serif';
    var lead = st >= 3 ? t.done : t.making;
    var CROPS = [];
    [[0, 0], [50, 0], [0, 50], [50, 50]].forEach(function (q, qi) {
      for (var r = 0; r < 3; r++) for (var c = 0; c < 4; c++) {
        var x = q[0] + 8 + c * 11.5, y = q[1] + 14 + r * 14;
        if (Math.abs(x - (q[0] + 25)) < 10 && Math.abs(y - (q[1] + 25)) < 14) continue;
        CROPS.push({ x: x, y: y, q: qi, k: CROPS.length });
      }
    });
    var self_ = this;
    return {
      rootClass: this.props.embedded ? '' : 'ks-bg',
      showSky: !this.props.embedded,
      standalone: !this.props.embedded,
      embedded: !!this.props.embedded,
      navTo: {Main: function () { if (self_.props.onNav) self_.props.onNav('Main'); }, Photo: function () { if (self_.props.onNav) self_.props.onNav('Photo'); }, Parts: function () { if (self_.props.onNav) self_.props.onNav('Parts'); }, Robot: function () { if (self_.props.onNav) self_.props.onNav('Robot'); }, Choose: function () { if (self_.props.onNav) self_.props.onNav('Choose'); }, Today: function () { if (self_.props.onNav) self_.props.onNav('Today'); }, Future: function () { if (self_.props.onNav) self_.props.onNav('Future'); }},
      crops: CROPS.map(function (c) { var d = 200 + c.q * 160 + (c.k % 9) * 50; return { leaf: '#7FB24A', leaf2: '#93C258', style: 'position: absolute; left: calc(' + c.x + '% - 9px); top: calc(' + c.y + '% - 17px); transform-origin: 50% 100%; ' + (st >= 3 ? 'animation: ks-grow 600ms cubic-bezier(.34,1.56,.64,1) ' + d + 'ms both, ks-sway2 3.2s ease-in-out ' + (d + 600) + 'ms infinite' : 'transform: scale(0)') }; }),
      t: t,
      isEn: lang === 'en' ? 'true' : 'false',
      isNe: lang === 'ne' ? 'true' : 'false',
      enStyle: lang === 'en' ? on : off,
      neStyle: lang === 'ne' ? on : off,
      setEn: () => this.setState({ lang: 'en' }),
      setNe: () => this.setState({ lang: 'ne' }),
      q1: q(0), q2: q(1), q3: q(2), q4: q(3),
      lineV: 'position: absolute; left: 168px; top: 0; width: 2px; height: 100%; background: #14301E; transform-origin: 50% 0; transition: transform 800ms cubic-bezier(.2,.8,.2,1); transform: scaleY(' + (st >= 1 ? 1 : 0) + ')',
      lineH: 'position: absolute; top: 147px; left: 0; height: 2px; width: 100%; background: #14301E; transform-origin: 0 50%; transition: transform 800ms cubic-bezier(.2,.8,.2,1) 250ms; transform: scaleX(' + (st >= 1 ? 1 : 0) + ')',

      }),
      lead: lead,
      speak: () => {
        try {
          var u = new SpeechSynthesisUtterance(lead + ' ' + t.sub);
          u.lang = lang === 'ne' ? 'ne-NP' : 'en-IN';
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(u);
        } catch (err) {}
      }
    };
  }
}
