<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Khet Sathi web prototype</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&amp;family=Inter:wght@400;500;600;700&amp;family=Mukta:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14301E}a:hover{color:#0B1F12}
.ks-wbg{background:#89A378 url(/_blob/3aa695d5bdb8271424d72ab091c78b64) center bottom/cover no-repeat}
@keyframes ks-drift{from{transform:translateX(-260px)}to{transform:translateX(110vw)}}
@keyframes ks-fly{0%{transform:translate(-120px,30px)}100%{transform:translate(110vw,-40px)}}
@keyframes ks-flap{to{transform:scaleY(.35)}}
.ks-cloud{position:absolute;left:0;width:240px;height:60px;border-radius:99px;background:rgba(255,250,240,.75);filter:blur(10px);animation:ks-drift linear infinite;pointer-events:none}
.ks-birds{position:absolute;left:0;top:150px;width:110px;height:36px;animation:ks-fly 32s linear 2s infinite;pointer-events:none}
.ks-birds path{fill:none;stroke:#3A3A35;stroke-width:1.6;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:ks-flap .55s ease-in-out infinite alternate}
.ks-glow{position:absolute;inset:-46px;border-radius:50%;background:radial-gradient(circle,rgba(242,160,82,.6),rgba(242,177,82,0) 66%);animation:ks-sunpulse 3.4s ease-in-out infinite}
@keyframes ks-sunpulse{50%{transform:scale(1.18);opacity:.75}}
.ks-rays{position:absolute;left:-16px;top:-16px;width:88px;height:88px;animation:ks-sunrot 26s linear infinite}
@keyframes ks-sunrot{to{transform:rotate(360deg)}}
@keyframes ks-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.ks-blade{transform-box:fill-box;transform-origin:50% 100%;animation:ks-sway 3.2s ease-in-out infinite}
@keyframes ks-word{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes ks-portal{0%{transform:scale(0);opacity:1}80%{opacity:1}100%{transform:scale(80);opacity:0}}
@keyframes ks-flash{0%{transform:scale(0);opacity:0}40%{transform:scale(8);opacity:1}100%{transform:scale(14);opacity:0}}
@keyframes ks-winw{0%{clip-path:inset(48% 28% 42% 64% round 32px);background-size:max(170%, 2400px) auto;opacity:0}22%{clip-path:inset(16% 5% 12% 52% round 32px);background-size:max(150%, 2150px) auto;opacity:1}100%{clip-path:inset(0 0 0 0 round 0);background-size:max(100%, 1440px) auto;opacity:1}}
@keyframes ks-in{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes ks-hdrift{from{transform:translateX(-300px)}to{transform:translateX(110vw)}}
.ks-hcloud{position:absolute;left:0;border-radius:99px;background:rgba(255,251,242,.6);filter:blur(12px);animation:ks-hroam linear infinite;pointer-events:none}
@keyframes ks-hroam{0%{transform:translate(-320px,0)}25%{transform:translate(25vw,-18px)}50%{transform:translate(52vw,10px)}75%{transform:translate(80vw,-12px)}100%{transform:translate(110vw,0)}}
@keyframes ks-puff{0%,100%{transform:translate(0,0)}25%{transform:translate(12px,-7px)}50%{transform:translate(4px,5px)}75%{transform:translate(-10px,-3px)}}
.ks-puff{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,253,247,.95),rgba(255,253,247,.6) 55%,rgba(255,253,247,0));pointer-events:none;animation:ks-puff ease-in-out infinite}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; position: relative; isolation: isolate; overflow: hidden; color: #14301E; font-family: Inter, Mukta, system-ui, sans-serif; background: #F6D19F">

  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; pointer-events: none">
    <div style="{{homeClouds}}">
      <span class="ks-puff" style="left: 2%; top: 8%; width: 265px; height: 106px; margin: -53px 0 0 -132px; opacity: 0.59; animation-duration: 11.3s; animation-delay: -0.9s"></span>
      <span class="ks-puff" style="left: 88%; top: 6%; width: 277px; height: 110px; margin: -55px 0 0 -138px; opacity: 0.72; animation-duration: 12.0s; animation-delay: -2.0s"></span>
      <span class="ks-puff" style="left: 1%; top: 40%; width: 186px; height: 74px; margin: -37px 0 0 -93px; opacity: 0.55; animation-duration: 11.7s; animation-delay: -5.7s"></span>
      <span class="ks-puff" style="left: 90%; top: 36%; width: 240px; height: 96px; margin: -48px 0 0 -120px; opacity: 0.81; animation-duration: 10.1s; animation-delay: -1.0s"></span>
      <span class="ks-puff" style="left: 4%; top: 70%; width: 207px; height: 82px; margin: -41px 0 0 -103px; opacity: 0.55; animation-duration: 12.2s; animation-delay: -1.8s"></span>
      <span class="ks-puff" style="left: 86%; top: 66%; width: 218px; height: 87px; margin: -43px 0 0 -109px; opacity: 0.82; animation-duration: 11.1s; animation-delay: -1.0s"></span>
      <span class="ks-puff" style="left: 10%; top: 88%; width: 226px; height: 90px; margin: -45px 0 0 -113px; opacity: 0.66; animation-duration: 10.4s; animation-delay: -4.4s"></span>
      <span class="ks-puff" style="left: 30%; top: 92%; width: 221px; height: 88px; margin: -44px 0 0 -110px; opacity: 0.60; animation-duration: 10.4s; animation-delay: -5.4s"></span>
      <span class="ks-puff" style="left: 52%; top: 94%; width: 174px; height: 69px; margin: -34px 0 0 -87px; opacity: 0.63; animation-duration: 12.9s; animation-delay: -5.8s"></span>
      <span class="ks-puff" style="left: 74%; top: 90%; width: 240px; height: 96px; margin: -48px 0 0 -120px; opacity: 0.83; animation-duration: 12.3s; animation-delay: -1.1s"></span>
      <span class="ks-puff" style="left: 94%; top: 88%; width: 222px; height: 88px; margin: -44px 0 0 -111px; opacity: 0.60; animation-duration: 11.9s; animation-delay: -5.2s"></span>
      <span class="ks-puff" style="left: 42%; top: 4%; width: 206px; height: 82px; margin: -41px 0 0 -103px; opacity: 0.52; animation-duration: 12.0s; animation-delay: -2.1s"></span>
      <span class="ks-puff" style="left: 64%; top: 12%; width: 235px; height: 94px; margin: -47px 0 0 -117px; opacity: 0.73; animation-duration: 11.8s; animation-delay: -2.2s"></span>
      <span class="ks-puff" style="left: 20%; top: 22%; width: 250px; height: 100px; margin: -50px 0 0 -125px; opacity: 0.73; animation-duration: 12.2s; animation-delay: -1.6s"></span>
      <span class="ks-hcloud" style="top: 320px; width: 220px; height: 50px; animation-duration: 125s; animation-delay: -15s; opacity: .7"></span>
      <span class="ks-hcloud" style="top: 540px; width: 280px; height: 60px; animation-duration: 150s; animation-delay: -70s; opacity: .6"></span>
      <span class="ks-hcloud" style="top: 760px; width: 240px; height: 52px; animation-duration: 170s; animation-delay: -35s; opacity: .5"></span>
      <span class="ks-hcloud" style="top: 30px; width: 200px; height: 44px; animation-duration: 135s; animation-delay: -100s; opacity: .55"></span>
      <span class="ks-hcloud" style="top: 80px; width: 260px; height: 60px; animation-duration: 110s; animation-delay: -30s"></span>
      <span class="ks-hcloud" style="top: 210px; width: 190px; height: 46px; animation-duration: 140s; animation-delay: -85s; opacity: .75"></span>
      <span class="ks-hcloud" style="top: 420px; width: 230px; height: 52px; animation-duration: 160s; animation-delay: -50s; opacity: .55"></span>
      <span class="ks-hcloud" style="top: 640px; width: 170px; height: 40px; animation-duration: 180s; animation-delay: -120s; opacity: .45"></span>
    </div>
    <div class="ks-wbg" style="{{landStyle}}"></div>
    <div style="{{tintStyle}}"></div>
    <span style="display: none"></span>
    <div style="{{skyStyle}}">
      <span class="ks-cloud" style="top: 70px; animation-duration: 95s; animation-delay: -30s"></span>
      <span class="ks-cloud" style="top: 180px; width: 180px; animation-duration: 120s; animation-delay: -75s; opacity: .8"></span>
      <span class="ks-cloud" style="top: 290px; width: 160px; height: 44px; animation-duration: 140s; animation-delay: -10s; opacity: .6"></span>
      <svg class="ks-birds" viewBox="0 0 120 40" style="opacity: .55"><path d="M10 20q6-6 12 0q6-6 12 0"></path><path d="M40 10q5-5 10 0q5-5 10 0"></path><path d="M62 24q5-5 10 0q5-5 10 0"></path><path d="M86 14q4-4 8 0q4-4 8 0"></path></svg>
    </div>
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" style="{{pathStyle}}">
      <path d="M -40 812 C 160 742, 300 852, 500 774 S 800 676, 980 742 S 1240 842, 1480 706" fill="none" stroke="#1E3A24" stroke-opacity="0.18" stroke-width="16" stroke-linecap="round"></path>
      <path d="M -40 812 C 160 742, 300 852, 500 774 S 800 676, 980 742 S 1240 842, 1480 706" fill="none" stroke="#C8E05A" stroke-width="9" stroke-linecap="round" pathLength="1" stroke-dasharray="1" style="{{pathDraw}}"></path>
    </svg>
    <svg viewBox="0 0 1440 110" preserveAspectRatio="none" style="{{grassStyle}}">
      <sc-for list="{{blades}}" as="b" hint-placeholder-count="0">
        <path class="ks-blade" d="{{b.d}}" fill="none" stroke="{{b.c}}" stroke-width="{{b.w}}" stroke-linecap="round" style="{{b.anim}}"></path>
      </sc-for>
    </svg>
    <div style="{{sunStyle}}">
      <span class="ks-glow"></span>
      <svg class="ks-rays" viewBox="0 0 66 66"><g stroke="#EFA048" stroke-width="2.4" stroke-linecap="round"><path d="M33 2v7M33 57v7M2 33h7M57 33h7M11 11l5 5M50 50l5 5M55 11l-5 5M16 50l-5 5"></path></g></svg>
      <span style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 32%, #FBE3A0, #F2B654 58%, #D9902E); box-shadow: 0 0 0 8px rgba(242,177,82,0.22)"></span>
      <span style="{{sunsetCore}}"></span>
    </div>
  </div>

  <div style="position: relative; z-index: 1">
    <sc-if value="{{is.W1}}" hint-placeholder-val="{{ true }}">
      <div style="{{wrap}}"><dc-import name="W1_Home" embedded="{{ true }}" on-nav="{{nav}}" hint-size="100%,900px"></dc-import></div>
    </sc-if>
    <sc-if value="{{is.W2}}" hint-placeholder-val="{{ false }}">
      <div style="{{wrap}}"><dc-import name="W2_Photo" embedded="{{ true }}" on-nav="{{nav}}" hint-size="100%,900px"></dc-import></div>
    </sc-if>
    <sc-if value="{{is.W3}}" hint-placeholder-val="{{ false }}">
      <div style="{{wrap}}"><dc-import name="W3_Parts" embedded="{{ true }}" on-nav="{{nav}}" hint-size="100%,900px"></dc-import></div>
    </sc-if>
    <sc-if value="{{is.W4}}" hint-placeholder-val="{{ false }}">
      <div style="{{wrap}}"><dc-import name="W4_Robot" embedded="{{ true }}" on-nav="{{nav}}" hint-size="100%,900px"></dc-import></div>
    </sc-if>
    <sc-if value="{{is.W5}}" hint-placeholder-val="{{ false }}">
      <div style="{{wrap}}"><dc-import name="W5_Choose" embedded="{{ true }}" on-nav="{{nav}}" hint-size="100%,900px"></dc-import></div>
    </sc-if>
    <sc-if value="{{is.W6}}" hint-placeholder-val="{{ false }}">
      <div style="{{wrap}}"><dc-import name="W6_Today" embedded="{{ true }}" on-nav="{{nav}}" hint-size="100%,900px"></dc-import></div>
    </sc-if>
    <sc-if value="{{is.W7}}" hint-placeholder-val="{{ false }}">
      <div style="{{wrap}}"><dc-import name="W7_Future" embedded="{{ true }}" on-nav="{{nav}}" hint-size="100%,900px"></dc-import></div>
    </sc-if>
  </div>

  <div aria-hidden="true" style="{{loaderStyle}}">
    <sc-for list="{{words}}" as="w" hint-placeholder-count="1">
      <sc-if value="{{w.show}}" hint-placeholder-val="{{ false }}">
        <span style="{{loaderWordStyle}}"><span style="width: 12px; height: 12px; border-radius: 999px; background: #C8E05A"></span>{{w.text}}</span>
      </sc-if>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { screen: 'W1', bg: 'W1', fading: false, wi: 0, loading: true, lifting: false, portal: false };
    this.timers = [];
    var bl = [];
    var seed = 7;
    var rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    var cols = ['#6E9A55', '#7FA862', '#8DB46E', '#5F8A4B'];
    for (var x = 0; x <= 1440; x += 9) {
      var h = 40 + rnd() * 60, dx = (rnd() - 0.5) * 18;
      bl.push({ d: 'M ' + x + ' 112 Q ' + (x + dx * 0.4).toFixed(1) + ' ' + (112 - h * 0.6).toFixed(1) + ' ' + (x + dx).toFixed(1) + ' ' + (112 - h).toFixed(1), c: cols[Math.floor(rnd() * 4)], w: (2 + rnd() * 2).toFixed(1), anim: 'animation-duration: ' + (2.6 + rnd() * 1.8).toFixed(2) + 's; animation-delay: -' + (rnd() * 3).toFixed(2) + 's' });
    }
    this.blades = bl;
  }
  componentDidMount() {
    var self = this;
    var n = 6;
    for (var i = 1; i < n; i++) (function (k) { self.timers.push(setTimeout(function () { self.setState({ wi: k }); }, 380 * k)); })(i);
    this.timers.push(setTimeout(function () { self.setState({ lifting: true }); }, 380 * n + 250));
    this.timers.push(setTimeout(function () { self.setState({ loading: false }); }, 380 * n + 1300));
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  renderVals() {
    var self = this;
    var st = this.state;
    var SUN = { W1: [4, 460], W2: [16, 280], W3: [31, 160], W4: [47, 102], W5: [62, 125], W6: [77, 221], W7: [88, 319] };
    var TINT = { W1: 0, W2: 0, W3: 0, W4: 0.05, W5: 0.15, W6: 0.4, W7: 0.65 };
    var SET = { W1: 0, W2: 0, W3: 0, W4: 0.1, W5: 0.3, W6: 0.65, W7: 0.95 };
    var land = st.bg !== 'W1';
    var sp = SUN[st.bg];
    var is = {};
    ['W1', 'W2', 'W3', 'W4', 'W5', 'W6', 'W7'].forEach(function (k) { is[k] = st.screen === k; });
    var PROG = { W1: 0, W2: 0.16, W3: 0.32, W4: 0.5, W5: 0.66, W6: 0.84, W7: 1 };
    var WORDS = ['\u0928\u092e\u0938\u094d\u0924\u0947', 'Namaste', '\u0916\u0947\u0924 \u0938\u093e\u0925\u0940', 'Know your land', '\u092e\u094c\u0938\u092e', 'Plan your season'];
    return {
      blades: this.blades,
      grassStyle: 'position: absolute; left: 0; bottom: 0; width: 100%; height: 110px; transition: opacity 1600ms ease 600ms; opacity: ' + (land ? 1 : 0),
      pathStyle: 'position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity 1200ms ease 600ms; opacity: ' + (land ? 1 : 0),
      pathDraw: 'transition: stroke-dashoffset 2600ms cubic-bezier(.45,0,.25,1); stroke-dashoffset: ' + (1 - PROG[st.bg]),
      words: WORDS.map(function (w, i) { return { text: w, show: i === st.wi }; }),
      loaderStyle: st.loading ? 'position: absolute; inset: 0; z-index: 30; background: #14301E; display: flex; align-items: center; justify-content: center; transition: transform 950ms cubic-bezier(.76,0,.24,1), border-radius 950ms cubic-bezier(.76,0,.24,1); transform: translateY(' + (st.lifting ? '-110%' : '0') + '); border-bottom-left-radius: ' + (st.lifting ? '50% 220px' : '0') + '; border-bottom-right-radius: ' + (st.lifting ? '50% 220px' : '0') : 'display: none',
      loaderWordStyle: 'display: inline-flex; align-items: center; gap: 16px; color: #FBF4EA; font-family: Archivo, Mukta, sans-serif; font-stretch: 125%; font-weight: 800; font-size: clamp(36px, 5vw, 64px); animation: ks-word 300ms ease-out both; transition: opacity 300ms; opacity: ' + (st.lifting ? 0 : 1),
      homeClouds: 'position: absolute; inset: 0; transition: opacity 900ms ease; opacity: ' + (land ? 0 : 1),
      portal: st.portal,
      is: is,
      landStyle: 'position: absolute; inset: 0; background-color: #F4C995; background-position: center bottom; background-size: max(100%, 1440px) auto; ' + (!land ? 'opacity: 0; transition: opacity 600ms ease' : (st.portal ? 'animation: ks-winw 1500ms cubic-bezier(.76,0,.24,1) both' : 'opacity: 1')),
      tintStyle: 'position: absolute; left: 0; top: 0; width: 100%; height: 620px; background: linear-gradient(180deg, rgba(208,92,52,.6) 0%, rgba(232,138,78,.38) 38%, rgba(232,138,78,0) 80%); transition: opacity 2400ms ease; opacity: ' + TINT[st.bg],
      skyStyle: 'position: absolute; inset: 0; transition: opacity 1600ms ease 400ms; opacity: ' + (land ? 1 : 0),
      sunStyle: 'position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; left: ' + sp[0] + '%; top: ' + sp[1] + 'px; transition: left 2600ms cubic-bezier(.45,0,.25,1), top 2600ms cubic-bezier(.45,0,.25,1), opacity 1200ms ease 500ms; opacity: ' + (land ? 1 : 0),
      sunsetCore: 'position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 32%, #F7B26A, #E2733A 58%, #B84E24); transition: opacity 2400ms ease; opacity: ' + SET[st.bg],
      wrap: 'transition: opacity 380ms ease; opacity: ' + (st.fading ? 0 : 1) + '; animation: ks-in 650ms cubic-bezier(.2,.8,.2,1) both',
      nav: function (to, delay) {
        if (!to || to === self.state.screen) return;
        self.timers.forEach(clearTimeout);
        self.timers = [];
        var fromHome = self.state.bg === 'W1';
        self.setState({ bg: to, portal: fromHome });
        if (fromHome) self.timers.push(setTimeout(function () { self.setState({ portal: false }); }, 1900));
        self.timers.push(setTimeout(function () {
          self.setState({ fading: true });
          self.timers.push(setTimeout(function () { self.setState({ screen: to, fading: false }); }, 380));
        }, delay || 0));
      }
    };
  }
}
</script>
</body>
</html>
